name: CI

on:
  push:
    # La rama por defecto de este repo es `master`: sin ella el workflow NUNCA
    # se disparaba en push (detectado por el latido de iter-82).
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      # Crea el esquema en la BD efimera de CI antes del build: las rutas prerender
      # (p.ej. /sitemap.xml) consultan Prisma en build time y fallan si la tabla
      # no existe. Equivale al `npm run db:migrate` del flujo local documentado.
      - run: npx prisma db push --schema packages/core/prisma/schema.prisma --accept-data-loss
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
