name: CI

on:
  push:
    # La rama por defecto de este repo es `master`: sin ella el workflow NUNCA
    # se disparaba en push (detectado por el latido de iter-82).
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
