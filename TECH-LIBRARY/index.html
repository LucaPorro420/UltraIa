ut.tsx      # Dashboard layout\n│   │   ├── dashboard/\n│   │   ├── chat/\n│   │   ├── studio/\n│   │   ├── gallery/\n│   │   ├── builder/\n│   │   ├── cloud/\n│   │   └── blog/\n│   └── api/                # API routes (Route Handlers)\n│       ├── chat/\n│       ├── auth/\n│       ├── cloud/\n│       ├── publications/\n│       └── omag/\n├── components/\n│   ├── aurora/             # Three.js aurora canvas\n│   ├── app-shell/          # Nav, skill pipeline\n│   └── ui/                 # UI kit (Dark Obsidian)\n├── src/\n│   ├── lib/\n│   │   └── server/\n│   │       └── context.ts  # getCurrentUser()\n│   └── instrumentation.ts  # Runtime providers setup\n├── public/\n├── globals.css             # Tailwind v4 + @theme tokens\n├── next.config.ts          # Webpack config, CSP, images\n└── tsconfig.json\n```\n\n## 3. Server Components vs Client Components\n\n### Server Component (default)\n```tsx\n// app/blog/page.tsx - NO necesita \"use client\"\n// Runs on server, zero JS sent to client\nimport { prisma } from '@/lib/prisma';\n\nexport default async function BlogPage() {\n  const posts = await prisma.post.findMany(); // Direct DB access\n  return (\n    <main>\n      {posts.map(post => <article key={post.id}>{post.title}</article>)}\n    </main>\n  );\n}\n```\n\n### Client Component\n```tsx\n// components/chat/chat-client.tsx\n\"use client\" // ← MUST be first line\n\nimport { useState } from 'react';\nimport { useChat } from 'ai/react';\n\nexport function ChatClient() {\n  const { messages, input, handleInputChange, handleSubmit } = useChat();\n  return (/* interactive UI */);\n}\n```\n\n### Reglas clave\n- Server Components: async, DB access, zero JS to client\n- Client Components: \"use client\", hooks, event handlers, browser APIs\n- Server → Client: pass data as props/children\n- Client → Server: Server Actions or API routes\n\n## 4. Data Fetching\n\n```tsx\n// Direct fetch in Server Component (no useEffect needed)\nasync function ProductList() {\n  const products = await fetch('https://api.example.com/products', {\n    next: { revalidate: 3600 } // ISR: revalidate every hour\n  });\n  return <div>{/* render products */}</div>;\n}\n```\n\n### Cache options\n- `cache: 'force-cache'` — cache aggressively\n- `next: { revalidate: N }` — ISR revalidation\n- `cache: 'no-store'` — always fresh data\n- Default in Next.js 15: NO cache (opt-in required)\n\n## 5. Server Actions\n\n```tsx\n// app/actions.ts\n\"use server\"\n\nimport { prisma } from '@/lib/prisma';\n\nexport async function createPost(formData: FormData) {\n  const title = formData.get('title') as string;\n  await prisma.post.create({ data: { title } });\n  revalidatePath('/posts');\n}\n```\n\n```tsx\n// Usage in component\n<form action={createPost}>\n  <input name=\"title\" />\n  <button type=\"submit\">Create</button>\n</form>\n```\n\n## 6. Route Handlers (API Routes)\n\n```ts\n// app/api/chat/route.ts\nimport { streamText } from 'ai';\nimport { openai } from '@ai-sdk/openai';\n\nexport async function POST(req: Request) {\n  const { messages } = await req.json();\n  \n  const result = streamText({\n    model: openai('gpt-4o'),\n    messages,\n  });\n  \n  return result.toDataStreamResponse();\n}\n```\n\n## 7. Middleware\n\n```ts\n// middleware.ts (root)\nimport { NextResponse } from 'next/server';\n\nexport function middleware(request) {\n  const token = request.cookies.get('ultraia_session');\n  if (!token && request.nextUrl.pathname.startsWith('/dashboard')) {\n    return NextResponse.redirect(new URL('/login', request.url));\n  }\n  return NextResponse.next();\n}\n\nexport const config = {\n  matcher: ['/dashboard/:path*', '/api/:path*']\n};\n```\n\n## 8. Configuración UltraIa\n\n```ts\n// next.config.ts\nconst nextConfig: NextConfig = {\n  transpilePackages: ['@ultraia/core'],\n  serverExternalPackages: ['@prisma/client', '@google/stitch-sdk'],\n  experimental: { cpus: 1 },\n  modularizeImports: {\n    'lucide-react': {\n      transform: 'lucide-react/dist/esm/icons/{{ kebabCase member }}',\n    },\n  },\n  images: {\n    remotePatterns: [\n      { protocol: 'https', hostname: 'image.pollinations.ai' },\n      { protocol: 'https', hostname: '*.pollinations.ai' },\n      { protocol: 'https', hostname: 'images.meigen.ai' },\n    ],\n  },\n};\n```\n\n## 9. Rendering Strategies\n\n| Str"},{"slug":"nodejs-patterns","title":"Node.js Patterns","version":"20+","category":"backend","categoryName":"Backend","categoryIcon":"⚙️","categoryColor":"#3b82f6","tags":["api","middleware","streams"],"sections":[{"title":"1. API Route Pattern","content":"\n```typescript\n// Next.js App Router API route\n// app/api/items/route.ts\nimport { NextResponse } from 'next/server';\n\nexport async function GET(request: Request) {\n  const { searchParams } = new URL(request.url);\n  const page = parseInt(searchParams.get('page') || '1');\n  \n  const items = await prisma.item.findMany({\n    skip: (page - 1) * 10,\n    take: 10,\n  });\n  \n  return NextResponse.json(items);\n}\n\nexport async function POST(request: Request) {\n  try {\n    const body = await request.json();\n    const validated = ItemSchema.parse(body);\n    \n    const item = await prisma.item.create({ data: validated });\n    return NextResponse.json(item, { status: 201 });\n  } catch (error) {\n    if (error instanceof z.ZodError) {\n      return NextResponse.json({ error: error.errors }, { status: 400 });\n    }\n    return NextResponse.json({ error: 'Internal Server Error' }, { status: 500 });\n  }\n}\n```\n\n"},{"title":"2. Error Handling","content":"\n```typescript\n// Custom error classes\nclass AppError extends Error {\n  constructor(\n    public statusCode: number,\n    message: string,\n    public code?: string\n  ) {\n    super(message);\n  }\n}\n\nclass NotFoundError extends AppError {\n  constructor(resource: string) {\n    super(404, `${resource} not found`, 'NOT_FOUND');\n  }\n}\n\nclass UnauthorizedError extends AppError {\n  constructor() {\n    super(401, 'Unauthorized', 'UNAUTHORIZED');\n  }\n}\n\n// Usage in route handlers\nexport async function GET(req: Request, { params }: { params: { id: string } }) {\n  const item = await prisma.item.findUnique({ where: { id: params.id } });\n  if (!item) throw new NotFoundError('Item');\n  return Response.json(item);\n}\n```\n\n"},{"title":"3. Data Validation Pattern","content":"\n```typescript\nimport { z } from 'zod';\n\n// Schema definition\nconst CreateItemSchema = z.object({\n  name: z.string().min(1).max(100),\n  description: z.string().optional(),\n  price: z.number().positive(),\n});\n\n// Validation in route\nexport async function POST(req: Request) {\n  const body = await req.json();\n  const result = CreateItemSchema.safeParse(body);\n  \n  if (!result.success) {\n    return Response.json(\n      { error: 'Validation failed', issues: result.error.issues },\n      { status: 400 }\n    );\n  }\n  \n  const item = await prisma.item.create({ data: result.data });\n  return Response.json(item, { status: 201 });\n}\n```\n\n"},{"title":"4. Pagination Pattern","content":"\n```typescript\n// Cursor-based pagination (UltraIa gallery pattern)\nexport async function GET(req: Request) {\n  const { searchParams } = new URL(req.url);\n  const cursor = searchParams.get('cursor');\n  const limit = parseInt(searchParams.get('limit') || '20');\n  \n  const items = await prisma.item.findMany({\n    take: limit + 1, // Fetch one extra to check if there's more\n    ...(cursor && {\n      skip: 1,\n      cursor: { id: cursor },\n    }),\n    orderBy: { createdAt: 'desc' },\n  });\n  \n  const hasMore = items.length > limit;\n  const nextCursor = hasMore ? items[items.length - 1].id : null;\n  \n  return Response.json({\n    items: items.slice(0, limit),\n    nextCursor,\n    hasMore,\n  });\n}\n```\n\n"},{"title":"5. Rate Limiting","content":"\n```typescript\n// Simple in-memory rate limiter\nconst rateLimitMap = new Map<string, { count: number; resetAt: number }>();\n\nexport function rateLimit(key: string, limit: number = 100, windowMs: number = 60000) {\n  const now = Date.now();\n  const entry = rateLimitMap.get(key);\n  \n  if (!entry || now > entry.resetAt) {\n    rateLimitMap.set(key, { count: 1, resetAt: now + windowMs });\n    return true;\n  }\n  \n  if (entry.count >= limit) {\n    return false; // Rate limited\n  }\n  \n  entry.count++;\n  return true;\n}\n```\n\n"},{"title":"6. Referencias","content":"\n- [Node.js Docs](https://nodejs.org/docs/)\n- [Express/Fastify Patterns](https://github.com/fastify/fastify)\n- [Next.js API Routes](https://nextjs.org/docs/app/building-your-application/routing/route-handlers)\n\n"}],"rawContent":"# Node.js Backend Patterns - Guía UltraIa\n\n> **Versión:** 20+ (recomendado)\n> **Runtime:** ESM (ES Modules)\n> **Patterns:** API routes, middleware, error handling\n\n---\n\n## 1. API Route Pattern\n\n```typescript\n// Next.js App Router API route\n// app/api/items/route.ts\nimport { NextResponse } from 'next/server';\n\nexport async function GET(request: Request) {\n  const { searchParams } = new URL(request.url);\n  const page = parseInt(searchParams.get('page') || '1');\n  \n  const items = await prisma.item.findMany({\n    skip: (page - 1) * 10,\n    take: 10,\n  });\n  \n  return NextResponse.json(items);\n}\n\nexport async function POST(request: Request) {\n  try {\n    const body = await request.json();\n    const validated = ItemSchema.parse(body);\n    \n    const item = await prisma.item.create({ data: validated });\n    return NextResponse.json(item, { status: 201 });\n  } catch (error) {\n    if (error instanceof z.ZodError) {\n      return NextResponse.json({ error: error.errors }, { status: 400 });\n    }\n    return NextResponse.json({ error: 'Internal Server Error' }, { status: 500 });\n  }\n}\n```\n\n## 2. Error Handling\n\n```typescript\n// Custom error classes\nclass AppError extends Error {\n  constructor(\n    public statusCode: number,\n    message: string,\n    public code?: string\n  ) {\n    super(message);\n  }\n}\n\nclass NotFoundError extends AppError {\n  constructor(resource: string) {\n    super(404, `${resource} not found`, 'NOT_FOUND');\n  }\n}\n\nclass UnauthorizedError extends AppError {\n  constructor() {\n    super(401, 'Unauthorized', 'UNAUTHORIZED');\n  }\n}\n\n// Usage in route handlers\nexport async function GET(req: Request, { params }: { params: { id: string } }) {\n  const item = await prisma.item.findUnique({ where: { id: params.id } });\n  if (!item) throw new NotFoundError('Item');\n  return Response.json(item);\n}\n```\n\n## 3. Data Validation Pattern\n\n```typescript\nimport { z } from 'zod';\n\n// Schema definition\nconst CreateItemSchema = z.object({\n  name: z.string().min(1).max(100),\n  description: z.string().optional(),\n  price: z.number().positive(),\n});\n\n// Validation in route\nexport async function POST(req: Request) {\n  const body = await req.json();\n  const result = CreateItemSchema.safeParse(body);\n  \n  if (!result.success) {\n    return Response.json(\n      { error: 'Validation failed', issues: result.error.issues },\n      { status: 400 }\n    );\n  }\n  \n  const item = await prisma.item.create({ data: result.data });\n  return Response.json(item, { status: 201 });\n}\n```\n\n## 4. Pagination Pattern\n\n```typescript\n// Cursor-based pagination (UltraIa gallery pattern)\nexport async function GET(req: Request) {\n  const { searchParams } = new URL(req.url);\n  const cursor = searchParams.get('cursor');\n  const limit = parseInt(searchParams.get('limit') || '20');\n  \n  const items = await prisma.item.findMany({\n    take: limit + 1, // Fetch one extra to check if there's more\n    ...(cursor && {\n      skip: 1,\n      cursor: { id: cursor },\n    }),\n    orderBy: { createdAt: 'desc' },\n  });\n  \n  const hasMore = items.length > limit;\n  const nextCursor = hasMore ? items[items.length - 1].id : null;\n  \n  return Response.json({\n    items: items.slice(0, limit),\n    nextCursor,\n    hasMore,\n  });\n}\n```\n\n## 5. Rate Limiting\n\n```typescript\n// Simple in-memory rate limiter\nconst rateLimitMap = new Map<string, { count: number; resetAt: number }>();\n\nexport function rateLimit(key: string, limit: number = 100, windowMs: number = 60000) {\n  const now = Date.now();\n  const entry = rateLimitMap.get(key);\n  \n  if (!entry || now > entry.resetAt) {\n    rateLimitMap.set(key, { count: 1, resetAt: now + windowMs });\n    return true;\n  }\n  \n  if (entry.count >= limit) {\n    return false; // Rate limited\n  }\n  \n  entry.count++;\n  return true;\n}\n```\n\n## 6. Referencias\n\n- [Node.js Docs](https://nodejs.org/docs/)\n- [Express/Fastify Patterns](https://github.com/fastify/fastify)\n- [Next.js API Routes](https://nextjs.org/docs/app/building-your-application/routing/route-handlers)\n"},{"slug":"npm-workspaces","title":"npm Workspaces","version":"-","category":"devops","categoryName":"DevOps","categoryIcon":"🚀","categoryColor":"#22c55e","tags":["monorepo","packages"],"sections":[{"title":"1. Configuration","content":"\n```json\n// package.json (root)\n{\n  \"name\": \"ultraia\",\n  \"private\": true,\n  \"workspaces\": [\n    \"apps/*\",\n    \"packages/*\"\n  ],\n  \"scripts\": {\n    \"dev\": \"npm run dev -w apps/web\",\n    \"build\": \"npm run build -w apps/web\",\n    \"test\": \"npm run test -w packages/core && npm run test -w packages/runtime\",\n    \"typecheck\": \"npm run typecheck -w packages/core && npm run typecheck -w apps/web && npm run typecheck -w packages/runtime\",\n    \"lint\": \"npm run lint -w apps/web\"\n  }\n}\n```\n\n"},{"title":"2. Workspace Dependencies","content":"\n```json\n// apps/web/package.json\n{\n  \"dependencies\": {\n    \"@ultraia/core\": \"*\",\n    \"@ultraia/runtime\": \"*\"\n  }\n}\n```\n\n"},{"title":"3. Common Commands","content":"\n```bash\n# Install all dependencies\nnpm install\n\n# Add dependency to specific workspace\nnpm install zod -w packages/core\n\n# Run script in workspace\nnpm run dev -w apps/web\n\n# Run script in multiple workspaces\nnpm run test -w packages/core -w packages/runtime\n\n# List workspaces\nnpm query .workspace\n\n# Clean\nrm -rf node_modules\nnpm install\n```\n\n"},{"title":"4. Referencias","content":"\n- [npm Workspaces](https://docs.npmjs.com/cli/v7/using-npm/workspaces)\n\n"}],"rawContent":"# npm Workspaces - Guía UltraIa\n\n> **Monorepo:** npm workspaces\n> **Structure:** `apps/*` + `packages/*`\n\n---\n\n## 1. Configuration\n\n```json\n// package.json (root)\n{\n  \"name\": \"ultraia\",\n  \"private\": true,\n  \"workspaces\": [\n    \"apps/*\",\n    \"packages/*\"\n  ],\n  \"scripts\": {\n    \"dev\": \"npm run dev -w apps/web\",\n    \"build\": \"npm run build -w apps/web\",\n    \"test\": \"npm run test -w packages/core && npm run test -w packages/runtime\",\n    \"typecheck\": \"npm run typecheck -w packages/core && npm run typecheck -w apps/web && npm run typecheck -w packages/runtime\",\n    \"lint\": \"npm run lint -w apps/web\"\n  }\n}\n```\n\n## 2. Workspace Dependencies\n\n```json\n// apps/web/package.json\n{\n  \"dependencies\": {\n    \"@ultraia/core\": \"*\",\n    \"@ultraia/runtime\": \"*\"\n  }\n}\n```\n\n## 3. Common Commands\n\n```bash\n# Install all dependencies\nnpm install\n\n# Add dependency to specific workspace\nnpm install zod -w packages/core\n\n# Run script in workspace\nnpm run dev -w apps/web\n\n# Run script in multiple workspaces\nnpm run test -w packages/core -w packages/runtime\n\n# List workspaces\nnpm query .workspace\n\n# Clean\nrm -rf node_modules\nnpm install\n```\n\n## 4. Referencias\n\n- [npm Workspaces](https://docs.npmjs.com/cli/v7/using-npm/workspaces)\n"},{"slug":"playwright","title":"Playwright","version":"1.62.1","category":"testing","categoryName":"Testing","categoryIcon":"🧪","categoryColor":"#06b6d4","tags":["e2e","browser","automation"],"sections":[{"title":"1. Setup","content":"\n```typescript\n// playwright.config.ts\nimport { defineConfig } from '@playwright/test';\n\nexport default defineConfig({\n  testDir: './tests',\n  use: {\n    baseURL: 'http://localhost:3000',\n    headless: true,\n  },\n  projects: [\n    { name: 'chromium', use: { browserName: 'chromium' } },\n  ],\n});\n```\n\n"},{"title":"2. Basic Test","content":"\n```typescript\nimport { test, expect } from '@playwright/test';\n\ntest('should load home page', async ({ page }) => {\n  await page.goto('/');\n  await expect(page).toHaveTitle(/UltraIa/);\n});\n\ntest('should login', async ({ page }) => {\n  await page.goto('/login');\n  await page.fill('input[name=\"identifier\"]', 'admin');\n  await page.fill('input[name=\"password\"]', 'admin');\n  await page.click('button[type=\"submit\"]');\n  await expect(page).toHaveURL('/dashboard');\n});\n```\n\n"},{"title":"3. UltraIa Smoke Test","content":"\n```typescript\n// browser-e2e.mjs (custom driver)\nimport { chromium } from 'patchright';\n\nasync function smokeTest() {\n  const browser = await chromium.launch({ headless: true });\n  const page = await browser.newPage();\n  \n  // Login\n  await page.goto('http://localhost:3000/login');\n  await page.fill('input[name=\"identifier\"]', 'admin');\n  await page.fill('input[name=\"password\"]', 'admin');\n  await page.click('button[type=\"submit\"]');\n  await page.waitForURL('**/dashboard');\n  \n  // Verify pages\n  const pages = ['/dashboard', '/chat', '/gallery', '/builder', '/cloud'];\n  for (const path of pages) {\n    await page.goto(path);\n    const title = await page.title();\n    console.log(`${path}: ${title}`);\n  }\n  \n  await browser.close();\n}\n```\n\n"},{"title":"4. Screenshots","content":"\n```typescript\ntest('capture screenshot', async ({ page }) => {\n  await page.goto('/');\n  await page.screenshot({ path: 'screenshot.png', fullPage: true });\n});\n```\n\n"},{"title":"5. Referencias","content":"\n- [Playwright Docs](https://playwright.dev/docs/)\n- [Playwright GitHub](https://github.com/microsoft/playwright)\n\n"}],"rawContent":"# Playwright - Guía UltraIa\n\n> **Versión usada:** 1.62.1\n> **Propósito:** E2E testing, browser automation, screenshots\n> **Docs:** https://playwright.dev/docs/\n\n---\n\n## 1. Setup\n\n```typescript\n// playwright.config.ts\nimport { defineConfig } from '@playwright/test';\n\nexport default defineConfig({\n  testDir: './tests',\n  use: {\n    baseURL: 'http://localhost:3000',\n    headless: true,\n  },\n  projects: [\n    { name: 'chromium', use: { browserName: 'chromium' } },\n  ],\n});\n```\n\n## 2. Basic Test\n\n```typescript\nimport { test, expect } from '@playwright/test';\n\ntest('should load home page', async ({ page }) => {\n  await page.goto('/');\n  await expect(page).toHaveTitle(/UltraIa/);\n});\n\ntest('should login', async ({ page }) => {\n  await page.goto('/login');\n  await page.fill('input[name=\"identifier\"]', 'admin');\n  await page.fill('input[name=\"password\"]', 'admin');\n  await page.click('button[type=\"submit\"]');\n  await expect(page).toHaveURL('/dashboard');\n});\n```\n\n## 3. UltraIa Smoke Test\n\n```typescript\n// browser-e2e.mjs (custom driver)\nimport { chromium } from 'patchright';\n\nasync function smokeTest() {\n  const browser = await chromium.launch({ headless: true });\n  const page = await browser.newPage();\n  \n  // Login\n  await page.goto('http://localhost:3000/login');\n  await page.fill('input[name=\"identifier\"]', 'admin');\n  await page.fill('input[name=\"password\"]', 'admin');\n  await page.click('button[type=\"submit\"]');\n  await page.waitForURL('**/dashboard');\n  \n  // Verify pages\n  const pages = ['/dashboard', '/chat', '/gallery', '/builder', '/cloud'];\n  for (const path of pages) {\n    await page.goto(path);\n    const title = await page.title();\n    console.log(`${path}: ${title}`);\n  }\n  \n  await browser.close();\n}\n```\n\n## 4. Screenshots\n\n```typescript\ntest('capture screenshot', async ({ page }) => {\n  await page.goto('/');\n  await page.screenshot({ path: 'screenshot.png', fullPage: true });\n});\n```\n\n## 5. Referencias\n\n- [Playwright Docs](https://playwright.dev/docs/)\n- [Playwright GitHub](https://github.com/microsoft/playwright)\n"},{"slug":"prisma-sqlite","title":"Prisma + SQLite","version":"6.7.0","category":"database","categoryName":"Base de Datos","categoryIcon":"🗄️","categoryColor":"#22c55e","tags":["orm","sql","migrations"],"sections":[{"title":"1. ¿Qué es Prisma?","content":"\nPrisma es un ORM TypeScript con:\n- **Schema-first**: defines la DB en `schema.prisma`\n- **Type-safe client**: `@prisma/client` generado automáticamente\n- **Migrations**: control de versiones de la DB\n- **SQLite**: DB local, sin servidor, ideal para desarrollo y desktop\n\n"},{"title":"2. Schema UltraIa","content":"\n```prisma\n// packages/core/prisma/schema.prisma\ngenerator client {\n  provider = \"prisma-client-js\"\n}\n\ndatasource db {\n  provider = \"sqlite\"\n  url      = env(\"DATABASE_URL\")\n}\n\nmodel User {\n  id            String    @id @default(cuid())\n  name          String\n  email         String    @unique\n  password      String\n  role          String    @default(\"USER\") // USER, ADMIN\n  createdAt     DateTime  @default(now())\n  updatedAt     DateTime  @updatedAt\n  \n  sessions      Session[]\n  workspaces    Workspace[]\n  blueprints    AgentBlueprint[]\n  publications  Publication[]\n}\n\nmodel Session {\n  id            String    @id @default(cuid())\n  userId        String\n  token         String    @unique\n  expiresAt     DateTime\n  createdAt     DateTime  @default(now())\n  \n  user          User      @relation(fields: [userId], references: [id])\n}\n\nmodel Workspace {\n  id            String    @id @default(cuid())\n  userId        String\n  name          String\n  createdAt     DateTime  @default(now())\n  \n  user          User      @relation(fields: [userId], references: [id])\n}\n\nmodel AgentBlueprint {\n  id            String    @id @default(cuid())\n  userId        String\n  name          String\n  slug          String    @unique\n  description   String?\n  isPublic      Boolean   @default(false)\n  capabilities  String    @default(\"[]\") // JSON array\n  createdAt     DateTime  @default(now())\n  updatedAt     DateTime  @updatedAt\n  \n  user          User      @relation(fields: [userId], references: [id])\n}\n\nmodel TopicBrief {\n  id            String    @id @default(cuid())\n  tema          String\n  canal         String\n  formato       String\n  tono          String\n  angulo        String?\n  fuentes       String    @default(\"[]\")\n  score         Float     @default(0)\n  estado        String    @default(\"NUEVO\") // NUEVO, PROCESADO, DESCARTADO\n  createdAt     DateTime  @default(now())\n}\n\nmodel Publication {\n  id            String    @id @default(cuid())\n  briefId       String?\n  topicId       String?\n  title         String\n  content       String\n  mediaPath     String?\n  mediaScore    Float?\n  channels      String    @default(\"[]\") // JSON array\n  status        String    @default(\"DRAFT\") // DRAFT, APPROVED, PUBLISHED, FAILED\n  scheduledAt   DateTime?\n  publishedAt   DateTime?\n  createdAt     DateTime  @default(now())\n  updatedAt     DateTime  @updatedAt\n  \n  user          User?     @relation(fields: [userId], references: [id])\n  userId        String?\n}\n```\n\n"},{"title":"3. Prisma Client Usage","content":"\n```typescript\nimport { PrismaClient } from '@prisma/client';\n\nconst prisma = new PrismaClient();\n\n// CRUD Operations\nconst user = await prisma.user.create({\n  data: {\n    name: 'Admin',\n    email: 'admin@ultraia.local',\n    password: await bcrypt.hash('admin', 12),\n    role: 'ADMIN',\n  },\n});\n\n// Find unique\nconst found = await prisma.user.findUnique({\n  where: { email: 'admin@ultraia.local' },\n});\n\n// Find many with filters\nconst posts = await prisma.publication.findMany({\n  where: { status: 'APPROVED' },\n  orderBy: { createdAt: 'desc' },\n  take: 10,\n});\n\n// Update\nawait prisma.user.update({\n  where: { id: user.id },\n  data: { name: 'New Name' },\n});\n\n// Delete\nawait prisma.publication.delete({\n  where: { id: 'some-id' },\n});\n```\n\n"},{"title":"4. Migrations","content":"\n```bash\n# Create migration\nnpx prisma migrate dev --name add_topic_briefs\n\n# Apply migrations\nnpx prisma migrate deploy\n\n# Reset database (danger!)\nnpx prisma migrate reset\n\n# Generate client\nnpx prisma generate\n\n# Push schema without migration (prototyping)\nnpx prisma db push\n```\n\n"},{"title":"5. Raw Queries","content":"\n```typescript\n// Raw SQL\nconst result = await prisma.$queryRaw`\n  SELECT * FROM User WHERE email = ${email}\n`;\n\n// Raw SQL with Prisma\nconst result = await prisma.$queryRawUnsafe(\n  'SELECT * FROM User WHERE email = ?',\n  email\n);\n```\n\n"},{"title":"6. Transactions","content":"\n```typescript\n// Interactive transaction\nconst result = await prisma.$transaction(async (tx) => {\n  const user = await tx.user.create({ data: { name: 'Test' } });\n  const workspace = await tx.workspace.create({\n    data: { name: 'Default', userId: user.id },\n  });\n  return { user, workspace };\n});\n\n// Batch transaction (flat array)\nconst [user, workspace] = await prisma.$transaction([\n  prisma.user.create({ data: { name: 'Test' } }),\n  prisma.workspace.create({ data: { name: 'Default' } }),\n]);\n```\n\n"},{"title":"7. Environment Variables","content":"\n```bash\n# .env\nDATABASE_URL=\"file:./dev.db\"\n\n# For production (SQLite)\nDATABASE_URL=\"file:/path/to/production.db\"\n```\n\n"},{"title":"8. UltraIa Database Patterns","content":"\n```typescript\n// packages/core/src/lib/prisma.ts\nimport { PrismaClient } from '@prisma/client';\n\nconst globalForPrisma = globalThis as unknown as {\n  prisma: PrismaClient | undefined;\n};\n\nexport const prisma = globalForPrisma.prisma ?? new PrismaClient();\n\nif (process.env.NODE_ENV !== 'production') globalForPrisma.prisma = prisma;\n\n// Usage in API routes\nimport { prisma } from '@ultraia/core';\n\nexport async function listPublications(status?: string) {\n  return prisma.publication.findMany({\n    where: status ? { status } : undefined,\n    orderBy: { createdAt: 'desc' },\n  });\n}\n```\n\n"},{"title":"9. Referencias","content":"\n- [Prisma Docs](https://www.prisma.io/docs)\n- [Prisma + SQLite](https://www.prisma.io/docs/orm/overview/databases/sqlite)\n- [Prisma Migrate](https://www.prisma.io/docs/orm/prisma-migrate)\n- [Prisma Client API](https://www.prisma.io/docs/orm/prisma-client)\n\n"}],"rawContent":"# Prisma + SQLite - Guía Completa UltraIa\n\n> **Versión usada:** Prisma 6.7.0, SQLite\n> **Docs:** https://www.prisma.io/docs\n> **Schema:** `packages/core/prisma/schema.prisma`\n\n---\n\n## 1. ¿Qué es Prisma?\n\nPrisma es un ORM TypeScript con:\n- **Schema-first**: defines la DB en `schema.prisma`\n- **Type-safe client**: `@prisma/client` generado automáticamente\n- **Migrations**: control de versiones de la DB\n- **SQLite**: DB local, sin servidor, ideal para desarrollo y desktop\n\n## 2. Schema UltraIa\n\n```prisma\n// packages/core/prisma/schema.prisma\ngenerator client {\n  provider = \"prisma-client-js\"\n}\n\ndatasource db {\n  provider = \"sqlite\"\n  url      = env(\"DATABASE_URL\")\n}\n\nmodel User {\n  id            String    @id @default(cuid())\n  name          String\n  email         String    @unique\n  password      String\n  role          String    @default(\"USER\") // USER, ADMIN\n  createdAt     DateTime  @default(now())\n  updatedAt     DateTime  @updatedAt\n  \n  sessions      Session[]\n  workspaces    Workspace[]\n  blueprints    AgentBlueprint[]\n  publications  Publication[]\n}\n\nmodel Session {\n  id            String    @id @default(cuid())\n  userId        String\n  token         String    @unique\n  expiresAt     DateTime\n  createdAt     DateTime  @default(now())\n  \n  user          User      @relation(fields: [userId], references: [id])\n}\n\nmodel Workspace {\n  id            String    @id @default(cuid())\n  userId        String\n  name          String\n  createdAt     DateTime  @default(now())\n  \n  user          User      @relation(fields: [userId], references: [id])\n}\n\nmodel AgentBlueprint {\n  id            String    @id @default(cuid())\n  userId        String\n  name          String\n  slug          String    @unique\n  description   String?\n  isPublic      Boolean   @default(false)\n  capabilities  String    @default(\"[]\") // JSON array\n  createdAt     DateTime  @default(now())\n  updatedAt     DateTime  @updatedAt\n  \n  user          User      @relation(fields: [userId], references: [id])\n}\n\nmodel TopicBrief {\n  id            String    @id @default(cuid())\n  tema          String\n  canal         String\n  formato       String\n  tono          String\n  angulo        String?\n  fuentes       String    @default(\"[]\")\n  score         Float     @default(0)\n  estado        String    @default(\"NUEVO\") // NUEVO, PROCESADO, DESCARTADO\n  createdAt     DateTime  @default(now())\n}\n\nmodel Publication {\n  id            String    @id @default(cuid())\n  briefId       String?\n  topicId       String?\n  title         String\n  content       String\n  mediaPath     String?\n  mediaScore    Float?\n  channels      String    @default(\"[]\") // JSON array\n  status        String    @default(\"DRAFT\") // DRAFT, APPROVED, PUBLISHED, FAILED\n  scheduledAt   DateTime?\n  publishedAt   DateTime?\n  createdAt     DateTime  @default(now())\n  updatedAt     DateTime  @updatedAt\n  \n  user          User?     @relation(fields: [userId], references: [id])\n  userId        String?\n}\n```\n\n## 3. Prisma Client Usage\n\n```typescript\nimport { PrismaClient } from '@prisma/client';\n\nconst prisma = new PrismaClient();\n\n// CRUD Operations\nconst user = await prisma.user.create({\n  data: {\n    name: 'Admin',\n    email: 'admin@ultraia.local',\n    password: await bcrypt.hash('admin', 12),\n    role: 'ADMIN',\n  },\n});\n\n// Find unique\nconst found = await prisma.user.findUnique({\n  where: { email: 'admin@ultraia.local' },\n});\n\n// Find many with filters\nconst posts = await prisma.publication.findMany({\n  where: { status: 'APPROVED' },\n  orderBy: { createdAt: 'desc' },\n  take: 10,\n});\n\n// Update\nawait prisma.user.update({\n  where: { id: user.id },\n  data: { name: 'New Name' },\n});\n\n// Delete\nawait prisma.publication.delete({\n  where: { id: 'some-id' },\n});\n```\n\n## 4. Migrations\n\n```bash\n# Create migration\nnpx prisma migrate dev --name add_topic_briefs\n\n# Apply migrations\nnpx prisma migrate deploy\n\n# Reset database (danger!)\nnpx prisma migrate reset\n\n# Generate client\nnpx prisma generate\n\n# Push schema without migration (prototyping)\nnpx prisma db push\n```\n\n## 5. Raw Queries\n\n```typescript\n// Raw SQL\nconst result = await prisma.$queryRaw`\n  SELECT * FROM User WHERE email = ${email}\n`;\n\n// Raw SQL with Prisma\nconst result = await prisma.$queryRawUnsafe(\n  'SELECT * FROM User WHERE email = ?',\n  email\n);\n```\n\n## 6. Transactions\n\n```typescript\n// Interactive transaction\nconst result = await prisma.$transaction(async (tx) => {\n  const user = await tx.user.create({ data: { name: 'Test' } });\n  const workspace = await tx.workspace.create({\n    data: { name: 'Default', userId: user.id },\n  });\n  return { user, workspace };\n});\n\n// Batch transaction (flat array)\nconst [user, workspace] = await prisma.$transaction([\n  prisma.user.create({ data: { name: 'Test' } }),\n  prisma.workspace.create({ data: { name: 'Default' } }),\n]);\n```\n\n## 7. Environment Variables\n\n```bash\n# .env\nDATABASE_URL=\"file:./dev.db\"\n\n# For production (SQLite)\nDATABASE_URL=\"file:/path/to/production.db\"\n```\n\n## 8. UltraIa Database Patterns\n\n```types"},{"slug":"react-19","title":"React 19","version":"19.2.3","category":"frontend","categoryName":"Frontend","categoryIcon":"🎨","categoryColor":"#8b5cf6","tags":["hooks","server-components","compiler"],"sections":[{"title":"1. ¿Qué cambia en React 19?","content":"\nReact 19 es el mayor cambio desde Hooks (React 16.8). Features clave:\n\n| Feature | Reemplaza | Estable |\n|---------|-----------|---------|\n| Actions (async functions in transitions) | Manual pending/error state | ✅ 19.0 |\n| `useActionState` | `useFormState` (canary) | ✅ 19.0 |\n| `useFormStatus` | Prop-drilling `isSubmitting` | ✅ 19.0 |\n| `useOptimistic` | Manual optimistic state | ✅ 19.0 |\n| `use` | `useEffect` + `useState` para promises | ✅ 19.0 |\n| `ref` as prop | `forwardRef` | ✅ 19.0 |\n| Document metadata | `react-helmet` | ✅ 19.0 |\n| Server Components | Framework-specific loading | ✅ 19.0 |\n| React Compiler | Manual `useMemo`/`useCallback`/`memo` | ✅ 1.0 (Oct 2025) |\n| `<Activity>` | Unmount/remount hidden subtrees | ✅ 19.2 |\n| `useEffectEvent` | Stale closure workaround | ✅ 19.2 |\n\n"},{"title":"2. Actions - El paradigma de formularios","content":"\n```tsx\n// Antes (React 18): useTransition + useState + error handling boilerplate\nconst [isPending, startTransition] = useTransition();\nconst [error, setError] = useState(null);\n\n// Después (React 19): Actions son async functions en transitions\nfunction SubmitButton() {\n  const [isPending, startTransition] = useTransition();\n  \n  return (\n    <button\n      onClick={() => {\n        startTransition(async () => {\n          await submitFormData(formData);\n        });\n      }}\n    >\n      {isPending ? 'Submitting...' : 'Submit'}\n    </button>\n  );\n}\n```\n\n"},{"title":"3. use() Hook - Leer promises en render","content":"\n```tsx\n// Unlike other hooks, use() CAN be called conditionally\nfunction UserProfile({ userPromise }) {\n  const user = use(userPromise); // Suspends until resolved\n  \n  if (!user) return null;\n  \n  return <div>{user.name}</div>;\n}\n\n// With Suspense\n<Suspense fallback={<Loading />}>\n  <UserProfile userPromise={fetchUser(id)} />\n</Suspense>\n```\n\n**⚠️ Importante:** El promise pasado a `use()` debe estar cacheado fuera del componente.\n\n"},{"title":"4. useActionState - Form state management","content":"\n```tsx\nimport { useActionState } from 'react';\n\nasync function createPost(prevState, formData) {\n  const title = formData.get('title');\n  if (!title) return { error: 'Title is required' };\n  \n  await savePost(title);\n  return { success: true };\n}\n\nfunction PostForm() {\n  const [state, formAction, isPending] = useActionState(createPost, null);\n  \n  return (\n    <form action={formAction}>\n      <input name=\"title\" />\n      <button disabled={isPending}>\n        {isPending ? 'Creating...' : 'Create Post'}\n      </button>\n      {state?.error && <p className=\"error\">{state.error}</p>}\n    </form>\n  );\n}\n```\n\n"},{"title":"5. useFormStatus - Form status en children","content":"\n```tsx\nimport { useFormStatus } from 'react-dom';\n\nfunction SubmitButton() {\n  const { pending } = useFormStatus();\n  \n  return (\n    <button type=\"submit\" disabled={pending}>\n      {pending ? 'Sending...' : 'Send'}\n    </button>\n  );\n}\n```\n\n"},{"title":"6. useOptimistic - Instant UI feedback","content":"\n```tsx\nimport { useOptimistic } from 'react';\n\nfunction LikeButton({ likes, onLike }) {\n  const [optimisticLikes, addOptimisticLike] = useOptimistic(\n    likes,\n    (currentLikes, newLike) => currentLikes + 1\n  );\n  \n  return (\n    <button onClick={() => {\n      addOptimisticLike();\n      onLike(); // server action\n    }}>\n      ❤️ {optimisticLikes}\n    </button>\n  );\n}\n```\n\n"},{"title":"7. ref as prop (Goodbye forwardRef)","content":"\n```tsx\n// Antes\nconst Input = forwardRef((props, ref) => (\n  <input ref={ref} {...props} />\n));\n\n// React 19: ref is just a prop\nfunction Input({ ref, ...props }) {\n  return <input ref={ref} {...props} />;\n}\n```\n\n"},{"title":"8. Document Metadata","content":"\n```tsx\n// React 19: hoists to <head> automatically\nfunction BlogPost({ post }) {\n  return (\n    <article>\n      <title>{post.title}</title>\n      <meta name=\"description\" content={post.excerpt} />\n      <meta property=\"og:title\" content={post.title} />\n      {/* These get hoisted to <head> */}\n      <h1>{post.title}</h1>\n    </article>\n  );\n}\n```\n\n"},{"title":"9. React Compiler (v1.0 - Oct 2025)","content":"\nEl compiler analiza componentes en build time e inserta memoization automáticamente:\n- Elimina la necesidad de `useMemo`, `useCallback`, `React.memo`\n- Funciona con React 17+\n- Optimización condicional y granular\n- Reduce ~30-40% de código de optimización manual\n\n"},{"title":"10. Server Components","content":"\n```tsx\n// Server Component (default in Next.js App Router)\nasync function ProductPage({ params }) {\n  const product = await db.product.findUnique({\n    where: { id: params.id }\n  });\n  \n  return (\n    <div>\n      <h1>{product.name}</h1>\n      <AddToCartButton productId={product.id} /> {/* Client Component */}\n    </div>\n  );\n}\n```\n\n"},{"title":"11. Upgrade from React 18","content":"\n```bash\n# Step 1: Upgrade to 18.3 first\nnpm install react@18.3 react-dom@18.3\n\n# Step 2: Fix deprecation warnings\n\n# Step 3: Install React 19\nnpm install react@19 react-dom@19\n\n# Step 4: Run codemods\nnpx codemod react/19/upgrade\n\n# Step 5: Enable React Compiler (optional)\n```\n\n### Breaking changes\n- `propTypes`/`defaultProps` on function components removed\n- `forwardRef` still works but no longer needed\n- Legacy context API removed\n- `ReactDOM.render` removed\n- New JSX transform required\n\n"},{"title":"12. UltraIa Usage Patterns","content":"\n```tsx\n// apps/web uses React 19 with:\n// - Server Components for data fetching (dashboard, gallery)\n// - Client Components for interactivity (chat, builder)\n// - Actions for form submissions (login, register)\n// - useChat from Vercel AI SDK for streaming\n\n// apps/mobile uses React 19.2.3 with:\n// - Expo Router for navigation\n// - SecureStore for tokens\n// - Client-side only (no Server Components)\n```\n\n"},{"title":"13. Referencias","content":"\n- [React 19 Blog Post](https://react.dev/blog/2024/12/05/react-19)\n- [React 19 Upgrade Guide](https://react.dev/blog/2024/04/25/react-19-upgrade-guide)\n- [React Compiler](https://react.dev/learn/react-compiler)\n- [Server Components](https://react.dev/reference/rsc/server-components)\n\n"}],"rawContent":"# React 19 - Guía Completa UltraIa\n\n> **Versión usada:** 19.2.3 (web) / 19.2.3 (mobile)\n> **Docs oficiales:** https://react.dev\n> **Último patch:** 19.2.7 (Junio 2026)\n\n---\n\n## 1. ¿Qué cambia en React 19?\n\nReact 19 es el mayor cambio desde Hooks (React 16.8). Features clave:\n\n| Feature | Reemplaza | Estable |\n|---------|-----------|---------|\n| Actions (async functions in transitions) | Manual pending/error state | ✅ 19.0 |\n| `useActionState` | `useFormState` (canary) | ✅ 19.0 |\n| `useFormStatus` | Prop-drilling `isSubmitting` | ✅ 19.0 |\n| `useOptimistic` | Manual optimistic state | ✅ 19.0 |\n| `use` | `useEffect` + `useState` para promises | ✅ 19.0 |\n| `ref` as prop | `forwardRef` | ✅ 19.0 |\n| Document metadata | `react-helmet` | ✅ 19.0 |\n| Server Components | Framework-specific loading | ✅ 19.0 |\n| React Compiler | Manual `useMemo`/`useCallback`/`memo` | ✅ 1.0 (Oct 2025) |\n| `<Activity>` | Unmount/remount hidden subtrees | ✅ 19.2 |\n| `useEffectEvent` | Stale closure workaround | ✅ 19.2 |\n\n## 2. Actions - El paradigma de formularios\n\n```tsx\n// Antes (React 18): useTransition + useState + error handling boilerplate\nconst [isPending, startTransition] = useTransition();\nconst [error, setError] = useState(null);\n\n// Después (React 19): Actions son async functions en transitions\nfunction SubmitButton() {\n  const [isPending, startTransition] = useTransition();\n  \n  return (\n    <button\n      onClick={() => {\n        startTransition(async () => {\n          await submitFormData(formData);\n        });\n      }}\n    >\n      {isPending ? 'Submitting...' : 'Submit'}\n    </button>\n  );\n}\n```\n\n## 3. use() Hook - Leer promises en render\n\n```tsx\n// Unlike other hooks, use() CAN be called conditionally\nfunction UserProfile({ userPromise }) {\n  const user = use(userPromise); // Suspends until resolved\n  \n  if (!user) return null;\n  \n  return <div>{user.name}</div>;\n}\n\n// With Suspense\n<Suspense fallback={<Loading />}>\n  <UserProfile userPromise={fetchUser(id)} />\n</Suspense>\n```\n\n**⚠️ Importante:** El promise pasado a `use()` debe estar cacheado fuera del componente.\n\n## 4. useActionState - Form state management\n\n```tsx\nimport { useActionState } from 'react';\n\nasync function createPost(prevState, formData) {\n  const title = formData.get('title');\n  if (!title) return { error: 'Title is required' };\n  \n  await savePost(title);\n  return { success: true };\n}\n\nfunction PostForm() {\n  const [state, formAction, isPending] = useActionState(createPost, null);\n  \n  return (\n    <form action={formAction}>\n      <input name=\"title\" />\n      <button disabled={isPending}>\n        {isPending ? 'Creating...' : 'Create Post'}\n      </button>\n      {state?.error && <p className=\"error\">{state.error}</p>}\n    </form>\n  );\n}\n```\n\n## 5. useFormStatus - Form status en children\n\n```tsx\nimport { useFormStatus } from 'react-dom';\n\nfunction SubmitButton() {\n  const { pending } = useFormStatus();\n  \n  return (\n    <button type=\"submit\" disabled={pending}>\n      {pending ? 'Sending...' : 'Send'}\n    </button>\n  );\n}\n```\n\n## 6. useOptimistic - Instant UI feedback\n\n```tsx\nimport { useOptimistic } from 'react';\n\nfunction LikeButton({ likes, onLike }) {\n  const [optimisticLikes, addOptimisticLike] = useOptimistic(\n    likes,\n    (currentLikes, newLike) => currentLikes + 1\n  );\n  \n  return (\n    <button onClick={() => {\n      addOptimisticLike();\n      onLike(); // server action\n    }}>\n      ❤️ {optimisticLikes}\n    </button>\n  );\n}\n```\n\n## 7. ref as prop (Goodbye forwardRef)\n\n```tsx\n// Antes\nconst Input = forwardRef((props, ref) => (\n  <input ref={ref} {...props} />\n));\n\n// React 19: ref is just a prop\nfunction Input({ ref, ...props }) {\n  return <input ref={ref} {...props} />;\n}\n```\n\n## 8. Document Metadata\n\n```tsx\n// React 19: hoists to <head> automatically\nfunction BlogPost({ post }) {\n  return (\n    <article>\n      <title>{post.title}</title>\n      <meta name=\"description\" content={post.excerpt} />\n      <meta property=\"og:title\" content={post.title} />\n      {/* These get hoisted to <head> */}\n      <h1>{post.title}</h1>\n    </article>\n  );\n}\n```\n\n## 9. React Compiler (v1.0 - Oct 2025)\n\nEl compiler analiza componentes en build time e inserta memoization automáticamente:\n- Elimina la necesidad de `useMemo`, `useCallback`, `React.memo`\n- Funciona con React 17+\n- Optimización condicional y granular\n- Reduce ~30-40% de código de optimización manual\n\n## 10. Server Components\n\n```tsx\n// Server Component (default in Next.js App Router)\nasync function ProductPage({ params }) {\n  const product = await db.product.findUnique({\n    where: { id: params.id }\n  });\n  \n  return (\n    <div>\n      <h1>{product.name}</h1>\n      <AddToCartButton productId={product.id} /> {/* Client Component */}\n    </div>\n  );\n}\n```\n\n## 11. Upgrade from React 18\n\n```bash\n# Step 1: Upgrade to 18.3 first\nnpm install react@18.3 react-dom@18.3\n\n# Step 2: Fix deprecation warnings\n\n# Step 3: Install React 19\nnpm install react@19 react-dom@19\n\n# Step 4: Run codemods\nnpx codemod react/19/upgra"},{"slug":"repomix","title":"Repomix","version":"1.18.0","category":"tools","categoryName":"Herramientas","categoryIcon":"🛠️","categoryColor":"#6366f1","tags":["repo-packaging","llm"],"sections":[{"title":"1. Installation","content":"\n```bash\nnpm install -D repomix@1.18.0\n```\n\n"},{"title":"2. Usage","content":"\n```bash\n# Pack entire repo\nnpx repomix\n\n# Pack specific directories\nnpx repomix --include \"packages/core/src,apps/web/src\"\n\n# Output to specific file\nnpx repomix --output repomix-output.xml\n\n# With ignore patterns\nnpx repomix --ignore \"node_modules,.next,*.test.ts\"\n```\n\n"},{"title":"3. UltraIa Configuration","content":"\n```bash\n# npm script\nnpm run repomix\n\n# What it does\nnpx repomix \\\n  --include \"packages/core/src,packages/runtime/src,apps/web/src,apps/mobile/src,scripts,Task,start.py\" \\\n  --output repomix-output.xml\n```\n\n"},{"title":"4. Output","content":"\n- XML format (~505k tokens, 336 files)\n- Respects `.gitignore`\n- Security check: excludes sensitive files (tokens, secrets)\n- **NEVER commit the output** (in `.gitignore`: `repomix-output.*`)\n\n"},{"title":"5. Use Cases","content":"\n- Give context to LLMs about entire codebase\n- Generate documentation from code\n- Code review with full context\n- Migration planning\n\n"},{"title":"6. Referencias","content":"\n- [Repomix GitHub](https://github.com/yamadashy/repomix)\n- [Docs](https://github.com/yamadashy/repomix/blob/main/README.md)\n\n"}],"rawContent":"# Repomix - Guía UltraIa\n\n> **Versión usada:** 1.18.0\n> **Propósito:** Pack entire repo into single file for LLM context\n> **Docs:** https://github.com/yamadashy/repomix\n\n---\n\n## 1. Installation\n\n```bash\nnpm install -D repomix@1.18.0\n```\n\n## 2. Usage\n\n```bash\n# Pack entire repo\nnpx repomix\n\n# Pack specific directories\nnpx repomix --include \"packages/core/src,apps/web/src\"\n\n# Output to specific file\nnpx repomix --output repomix-output.xml\n\n# With ignore patterns\nnpx repomix --ignore \"node_modules,.next,*.test.ts\"\n```\n\n## 3. UltraIa Configuration\n\n```bash\n# npm script\nnpm run repomix\n\n# What it does\nnpx repomix \\\n  --include \"packages/core/src,packages/runtime/src,apps/web/src,apps/mobile/src,scripts,Task,start.py\" \\\n  --output repomix-output.xml\n```\n\n## 4. Output\n\n- XML format (~505k tokens, 336 files)\n- Respects `.gitignore`\n- Security check: excludes sensitive files (tokens, secrets)\n- **NEVER commit the output** (in `.gitignore`: `repomix-output.*`)\n\n## 5. Use Cases\n\n- Give context to LLMs about entire codebase\n- Generate documentation from code\n- Code review with full context\n- Migration planning\n\n## 6. Referencias\n\n- [Repomix GitHub](https://github.com/yamadashy/repomix)\n- [Docs](https://github.com/yamadashy/repomix/blob/main/README.md)\n"},{"slug":"tailwind-v4","title":"Tailwind CSS v4","version":"4.1.4","category":"frontend","categoryName":"Frontend","categoryIcon":"🎨","categoryColor":"#8b5cf6","tags":["css","design-system","@theme"],"sections":[{"title":"1. ¿Qué cambia en Tailwind v4?","content":"\n| Aspecto | v3 | v4 |\n|---------|----|----|\n| Config file | `tailwind.config.js` | `@theme` en CSS |\n| Engine | PostCSS | Lightning CSS |\n| Build | Purge + rem | Source maps reales |\n| Performance | ~10x más lento | 10x más rápido |\n| Defaults | `@tailwind base/components/utilities` | `@import \"tailwindcss\"` |\n\n"},{"title":"2. Configuración UltraIa","content":"\n```css\n/* globals.css */\n@import \"tailwindcss\";\n\n/* Custom tokens Dark Obsidian */\n@theme {\n  --color-canvas: #08080a;\n  --color-panel: #111115;\n  --color-primary: #8b5cf6;\n  --color-border-subtle: #1f1f2a;\n  \n  /* Neo Violet palette */\n  --color-neo-100: #f3f0ff;\n  --color-neo-200: #e9e5ff;\n  --color-neo-300: #d4ccff;\n  --color-neo-400: #b4a3ff;\n  --color-neo-500: #8b5cf6;\n  --color-neo-600: #6d28d9;\n  --color-neo-700: #5b21b6;\n  \n  /* Typography */\n  --font-sans: 'Inter', sans-serif;\n  --font-display: 'Plus Jakarta Sans', sans-serif;\n  --font-mono: 'JetBrains Mono', monospace;\n}\n\n/* Utility classes */\n.glass-panel {\n  backdrop-filter: blur(12px);\n  border-top: 1px solid rgba(255, 255, 255, 0.05);\n}\n\n.card-glow-hover {\n  transition: transform 200ms var(--ease-ultra), box-shadow 200ms var(--ease-ultra);\n}\n.card-glow-hover:hover {\n  transform: translateY(-2px);\n  box-shadow: 0 0 150px var(--color-primary);\n}\n\n.gradient-neo-text {\n  background: linear-gradient(135deg, var(--color-neo-400), var(--color-neo-600));\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n}\n```\n\n"},{"title":"3. Utility-First Pattern","content":"\n```tsx\n// Dark Obsidian components\n<div className=\"\n  bg-panel \n  border border-border-subtle \n  rounded-xl \n  p-6\n  hover:border-primary/30\n  transition-colors duration-200\n\">\n  <h2 className=\"text-lg font-display font-semibold text-white\">\n    Title\n  </h2>\n  <p className=\"text-sm text-gray-400 mt-2\">\n    Description\n  </p>\n</div>\n```\n\n"},{"title":"4. Responsive Design","content":"\n```tsx\n// Mobile-first breakpoints (default in v4)\n<div className=\"\n  grid grid-cols-1 \n  md:grid-cols-2 \n  lg:grid-cols-3 \n  gap-4\n\">\n  {/* Cards */}\n</div>\n```\n\n"},{"title":"5. Animation Patterns","content":"\n```css\n/* CSS animations */\n@keyframes fade-in {\n  from { opacity: 0; transform: translateY(10px); }\n  to { opacity: 1; transform: translateY(0); }\n}\n\n.animate-fade-in {\n  animation: fade-in 0.3s ease-out forwards;\n}\n\n/* Staggered list items */\n.animate-chat-enter {\n  animation: chat-enter 0.3s ease-out forwards;\n  opacity: 0;\n}\n```\n\n"},{"title":"6. Dark Mode (always dark in UltraIa)","content":"\n```tsx\n// UltraIa uses always-dark mode via CSS variables\n// No need for dark: prefix - everything is dark by default\n<div className=\"bg-canvas text-white\">\n  {/* Always dark */}\n</div>\n```\n\n"},{"title":"7. Custom Components Pattern","content":"\n```tsx\n// Button variant system\nconst buttonVariants = {\n  primary: 'bg-primary hover:bg-primary/90 text-white',\n  secondary: 'bg-panel border border-border-subtle hover:border-primary/30',\n  ghost: 'hover:bg-panel/50 text-gray-400 hover:text-white',\n  danger: 'bg-red-500/10 text-red-400 hover:bg-red-500/20',\n};\n\nfunction Button({ variant = 'primary', children, ...props }) {\n  return (\n    <button\n      className={`px-4 py-2 rounded-lg transition-colors duration-200 ${buttonVariants[variant]}`}\n      {...props}\n    >\n      {children}\n    </button>\n  );\n}\n```\n\n"},{"title":"8. UltraIa Design Tokens","content":"\n| Token | Value | Usage |\n|-------|-------|-------|\n| `canvas` | `#08080a` | Page background |\n| `panel` | `#111115` | Card/panel background |\n| `primary` | `#8b5cf6` | Accent, CTAs |\n| `border-subtle` | `#1f1f2a` | Borders, dividers |\n| `neo-500` | `#8b5cf6` | Neo Violet accent |\n| `font-display` | Plus Jakarta Sans | Headings, chat |\n| `font-mono` | JetBrains Mono | Code, logs |\n\n"},{"title":"9. Referencias","content":"\n- [Tailwind CSS v4 Docs](https://tailwindcss.com/docs/v4-beta)\n- [Theme Configuration](https://tailwindcss.com/docs/theme)\n- [Utility Classes](https://tailwindcss.com/docs/utility-first)\n\n"}],"rawContent":"# Tailwind CSS v4 - Guía Completa UltraIa\n\n> **Versión usada:** 4.1.4\n> **Engine:** Lightning CSS (reemplaza PostCSS en dev)\n> **Config:** CSS-first (`@theme` en CSS, NO tailwind.config.js)\n\n---\n\n## 1. ¿Qué cambia en Tailwind v4?\n\n| Aspecto | v3 | v4 |\n|---------|----|----|\n| Config file | `tailwind.config.js` | `@theme` en CSS |\n| Engine | PostCSS | Lightning CSS |\n| Build | Purge + rem | Source maps reales |\n| Performance | ~10x más lento | 10x más rápido |\n| Defaults | `@tailwind base/components/utilities` | `@import \"tailwindcss\"` |\n\n## 2. Configuración UltraIa\n\n```css\n/* globals.css */\n@import \"tailwindcss\";\n\n/* Custom tokens Dark Obsidian */\n@theme {\n  --color-canvas: #08080a;\n  --color-panel: #111115;\n  --color-primary: #8b5cf6;\n  --color-border-subtle: #1f1f2a;\n  \n  /* Neo Violet palette */\n  --color-neo-100: #f3f0ff;\n  --color-neo-200: #e9e5ff;\n  --color-neo-300: #d4ccff;\n  --color-neo-400: #b4a3ff;\n  --color-neo-500: #8b5cf6;\n  --color-neo-600: #6d28d9;\n  --color-neo-700: #5b21b6;\n  \n  /* Typography */\n  --font-sans: 'Inter', sans-serif;\n  --font-display: 'Plus Jakarta Sans', sans-serif;\n  --font-mono: 'JetBrains Mono', monospace;\n}\n\n/* Utility classes */\n.glass-panel {\n  backdrop-filter: blur(12px);\n  border-top: 1px solid rgba(255, 255, 255, 0.05);\n}\n\n.card-glow-hover {\n  transition: transform 200ms var(--ease-ultra), box-shadow 200ms var(--ease-ultra);\n}\n.card-glow-hover:hover {\n  transform: translateY(-2px);\n  box-shadow: 0 0 150px var(--color-primary);\n}\n\n.gradient-neo-text {\n  background: linear-gradient(135deg, var(--color-neo-400), var(--color-neo-600));\n  -webkit-background-clip: text;\n  -webkit-text-fill-color: transparent;\n}\n```\n\n## 3. Utility-First Pattern\n\n```tsx\n// Dark Obsidian components\n<div className=\"\n  bg-panel \n  border border-border-subtle \n  rounded-xl \n  p-6\n  hover:border-primary/30\n  transition-colors duration-200\n\">\n  <h2 className=\"text-lg font-display font-semibold text-white\">\n    Title\n  </h2>\n  <p className=\"text-sm text-gray-400 mt-2\">\n    Description\n  </p>\n</div>\n```\n\n## 4. Responsive Design\n\n```tsx\n// Mobile-first breakpoints (default in v4)\n<div className=\"\n  grid grid-cols-1 \n  md:grid-cols-2 \n  lg:grid-cols-3 \n  gap-4\n\">\n  {/* Cards */}\n</div>\n```\n\n## 5. Animation Patterns\n\n```css\n/* CSS animations */\n@keyframes fade-in {\n  from { opacity: 0; transform: translateY(10px); }\n  to { opacity: 1; transform: translateY(0); }\n}\n\n.animate-fade-in {\n  animation: fade-in 0.3s ease-out forwards;\n}\n\n/* Staggered list items */\n.animate-chat-enter {\n  animation: chat-enter 0.3s ease-out forwards;\n  opacity: 0;\n}\n```\n\n## 6. Dark Mode (always dark in UltraIa)\n\n```tsx\n// UltraIa uses always-dark mode via CSS variables\n// No need for dark: prefix - everything is dark by default\n<div className=\"bg-canvas text-white\">\n  {/* Always dark */}\n</div>\n```\n\n## 7. Custom Components Pattern\n\n```tsx\n// Button variant system\nconst buttonVariants = {\n  primary: 'bg-primary hover:bg-primary/90 text-white',\n  secondary: 'bg-panel border border-border-subtle hover:border-primary/30',\n  ghost: 'hover:bg-panel/50 text-gray-400 hover:text-white',\n  danger: 'bg-red-500/10 text-red-400 hover:bg-red-500/20',\n};\n\nfunction Button({ variant = 'primary', children, ...props }) {\n  return (\n    <button\n      className={`px-4 py-2 rounded-lg transition-colors duration-200 ${buttonVariants[variant]}`}\n      {...props}\n    >\n      {children}\n    </button>\n  );\n}\n```\n\n## 8. UltraIa Design Tokens\n\n| Token | Value | Usage |\n|-------|-------|-------|\n| `canvas` | `#08080a` | Page background |\n| `panel` | `#111115` | Card/panel background |\n| `primary` | `#8b5cf6` | Accent, CTAs |\n| `border-subtle` | `#1f1f2a` | Borders, dividers |\n| `neo-500` | `#8b5cf6` | Neo Violet accent |\n| `font-display` | Plus Jakarta Sans | Headings, chat |\n| `font-mono` | JetBrains Mono | Code, logs |\n\n## 9. Referencias\n\n- [Tailwind CSS v4 Docs](https://tailwindcss.com/docs/v4-beta)\n- [Theme Configuration](https://tailwindcss.com/docs/theme)\n- [Utility Classes](https://tailwindcss.com/docs/utility-first)\n"},{"slug":"threejs","title":"Three.js","version":"0.185.1","category":"animation","categoryName":"Animación/3D","categoryIcon":"🎬","categoryColor":"#ec4899","tags":["webgl","3d","shaders"],"sections":[{"title":"1. Fundamentos","content":"\n```typescript\nimport * as THREE from 'three';\n\n// Scene setup\nconst scene = new THREE.Scene();\nconst camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);\nconst renderer = new THREE.WebGLRenderer({ antialias: true });\nrenderer.setSize(window.innerWidth, window.innerHeight);\ndocument.body.appendChild(renderer.domElement);\n\n// Geometry + Material + Mesh\nconst geometry = new THREE.BoxGeometry(1, 1, 1);\nconst material = new THREE.MeshStandardMaterial({ color: 0x8b5cf6 });\nconst cube = new THREE.Mesh(geometry, material);\nscene.add(cube);\n\n// Lights\nconst ambientLight = new THREE.AmbientLight(0xffffff, 0.5);\nconst pointLight = new THREE.PointLight(0xffffff, 1);\nscene.add(ambientLight, pointLight);\n\n// Animation loop\nfunction animate() {\n  requestAnimationFrame(animate);\n  cube.rotation.x += 0.01;\n  cube.rotation.y += 0.01;\n  renderer.render(scene, camera);\n}\nanimate();\n```\n\n"},{"title":"2. React Integration (Next.js)","content":"\n```tsx\n'use client';\nimport { Canvas, useFrame } from '@react-three/fiber';\nimport { Suspense, useRef } from 'react';\n\n// Dynamic import to avoid SSR issues\nimport dynamic from 'next/dynamic';\nconst AuroraCanvas = dynamic(() => import('@/components/aurora/aurora-canvas'), {\n  ssr: false,\n  loading: () => <div className=\"h-screen bg-canvas\" />,\n});\n\n// Usage\n<AuroraCanvas />\n```\n\n"},{"title":"3. Custom Shader (Aurora Example)","content":"\n```glsl\n// vertex shader\nvarying vec2 vUv;\nvoid main() {\n  vUv = uv;\n  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}\n\n// fragment shader\nuniform float uTime;\nvarying vec2 vUv;\n\n// Simplex noise function\nfloat noise(vec2 st) {\n  // ... implementation\n}\n\nvoid main() {\n  vec2 uv = vUv;\n  float n = noise(uv * 3.0 + uTime * 0.5);\n  vec3 color = mix(vec3(0.03, 0.03, 0.04), vec3(0.54, 0.36, 0.96), n);\n  gl_FragColor = vec4(color, 1.0);\n}\n```\n\n"},{"title":"4. ShaderMaterial","content":"\n```typescript\nconst material = new THREE.ShaderMaterial({\n  uniforms: {\n    uTime: { value: 0 },\n    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },\n  },\n  vertexShader: vertexShader,\n  fragmentShader: fragmentShader,\n});\n\n// Update in render loop\nfunction animate() {\n  material.uniforms.uTime.value += 0.01;\n  renderer.render(scene, camera);\n}\n```\n\n"},{"title":"5. UltraIa Aurora Canvas","content":"\n```tsx\n// components/aurora/aurora-canvas.tsx\n'use client';\nimport { useRef, useMemo } from 'react';\nimport { Canvas, useFrame } from '@react-three/fiber';\nimport * as THREE from 'three';\n\nfunction AuroraPlane() {\n  const meshRef = useRef<THREE.Mesh>(null);\n  \n  const uniforms = useMemo(() => ({\n    uTime: { value: 0 },\n  }), []);\n  \n  useFrame(({ clock }) => {\n    uniforms.uTime.value = clock.getElapsedTime();\n  });\n  \n  return (\n    <mesh ref={meshRef}>\n      <planeGeometry args={[2, 2, 1, 1]} />\n      <shaderMaterial\n        uniforms={uniforms}\n        vertexShader={vertexShader}\n        fragmentShader={fragmentShader}\n      />\n    </mesh>\n  );\n}\n\nexport default function AuroraCanvas() {\n  return (\n    <Canvas camera={{ position: [0, 0, 1] }}>\n      <Suspense fallback={null}>\n        <AuroraPlane />\n      </Suspense>\n    </Canvas>\n  );\n}\n```\n\n"},{"title":"6. Performance Tips","content":"\n```typescript\n// 1. Use BufferGeometry (not Geometry)\nconst geometry = new THREE.BufferGeometry();\n\n// 2. Reuse materials\nconst material = new THREE.MeshStandardMaterial({ color: 0x8b5cf6 });\nconst mesh1 = new THREE.Mesh(geometry, material);\nconst mesh2 = new THREE.Mesh(geometry, material);\n\n// 3. Dispose resources\ngeometry.dispose();\nmaterial.dispose();\n\n// 4. Use instancing for many similar objects\nconst mesh = new THREE.InstancedMesh(geometry, material, count);\n\n// 5. Limit draw calls\n// Group objects, use LOD (Level of Detail)\n```\n\n"},{"title":"7. Referencias","content":"\n- [Three.js Docs](https://threejs.org/docs/)\n- [React Three Fiber](https://docs.pmnd.rs/react-three-fiber/)\n- [Shader Material](https://threejs.org/docs/#api/en/materials/ShaderMaterial)\n\n"}],"rawContent":"# Three.js - Guía Completa UltraIa\n\n> **Versión usada:** 0.185.1\n> **Propósito:** WebGL rendering, aurora canvas, VFX, SDF rendering\n> **Docs:** https://threejs.org/docs/\n\n---\n\n## 1. Fundamentos\n\n```typescript\nimport * as THREE from 'three';\n\n// Scene setup\nconst scene = new THREE.Scene();\nconst camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);\nconst renderer = new THREE.WebGLRenderer({ antialias: true });\nrenderer.setSize(window.innerWidth, window.innerHeight);\ndocument.body.appendChild(renderer.domElement);\n\n// Geometry + Material + Mesh\nconst geometry = new THREE.BoxGeometry(1, 1, 1);\nconst material = new THREE.MeshStandardMaterial({ color: 0x8b5cf6 });\nconst cube = new THREE.Mesh(geometry, material);\nscene.add(cube);\n\n// Lights\nconst ambientLight = new THREE.AmbientLight(0xffffff, 0.5);\nconst pointLight = new THREE.PointLight(0xffffff, 1);\nscene.add(ambientLight, pointLight);\n\n// Animation loop\nfunction animate() {\n  requestAnimationFrame(animate);\n  cube.rotation.x += 0.01;\n  cube.rotation.y += 0.01;\n  renderer.render(scene, camera);\n}\nanimate();\n```\n\n## 2. React Integration (Next.js)\n\n```tsx\n'use client';\nimport { Canvas, useFrame } from '@react-three/fiber';\nimport { Suspense, useRef } from 'react';\n\n// Dynamic import to avoid SSR issues\nimport dynamic from 'next/dynamic';\nconst AuroraCanvas = dynamic(() => import('@/components/aurora/aurora-canvas'), {\n  ssr: false,\n  loading: () => <div className=\"h-screen bg-canvas\" />,\n});\n\n// Usage\n<AuroraCanvas />\n```\n\n## 3. Custom Shader (Aurora Example)\n\n```glsl\n// vertex shader\nvarying vec2 vUv;\nvoid main() {\n  vUv = uv;\n  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n}\n\n// fragment shader\nuniform float uTime;\nvarying vec2 vUv;\n\n// Simplex noise function\nfloat noise(vec2 st) {\n  // ... implementation\n}\n\nvoid main() {\n  vec2 uv = vUv;\n  float n = noise(uv * 3.0 + uTime * 0.5);\n  vec3 color = mix(vec3(0.03, 0.03, 0.04), vec3(0.54, 0.36, 0.96), n);\n  gl_FragColor = vec4(color, 1.0);\n}\n```\n\n## 4. ShaderMaterial\n\n```typescript\nconst material = new THREE.ShaderMaterial({\n  uniforms: {\n    uTime: { value: 0 },\n    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },\n  },\n  vertexShader: vertexShader,\n  fragmentShader: fragmentShader,\n});\n\n// Update in render loop\nfunction animate() {\n  material.uniforms.uTime.value += 0.01;\n  renderer.render(scene, camera);\n}\n```\n\n## 5. UltraIa Aurora Canvas\n\n```tsx\n// components/aurora/aurora-canvas.tsx\n'use client';\nimport { useRef, useMemo } from 'react';\nimport { Canvas, useFrame } from '@react-three/fiber';\nimport * as THREE from 'three';\n\nfunction AuroraPlane() {\n  const meshRef = useRef<THREE.Mesh>(null);\n  \n  const uniforms = useMemo(() => ({\n    uTime: { value: 0 },\n  }), []);\n  \n  useFrame(({ clock }) => {\n    uniforms.uTime.value = clock.getElapsedTime();\n  });\n  \n  return (\n    <mesh ref={meshRef}>\n      <planeGeometry args={[2, 2, 1, 1]} />\n      <shaderMaterial\n        uniforms={uniforms}\n        vertexShader={vertexShader}\n        fragmentShader={fragmentShader}\n      />\n    </mesh>\n  );\n}\n\nexport default function AuroraCanvas() {\n  return (\n    <Canvas camera={{ position: [0, 0, 1] }}>\n      <Suspense fallback={null}>\n        <AuroraPlane />\n      </Suspense>\n    </Canvas>\n  );\n}\n```\n\n## 6. Performance Tips\n\n```typescript\n// 1. Use BufferGeometry (not Geometry)\nconst geometry = new THREE.BufferGeometry();\n\n// 2. Reuse materials\nconst material = new THREE.MeshStandardMaterial({ color: 0x8b5cf6 });\nconst mesh1 = new THREE.Mesh(geometry, material);\nconst mesh2 = new THREE.Mesh(geometry, material);\n\n// 3. Dispose resources\ngeometry.dispose();\nmaterial.dispose();\n\n// 4. Use instancing for many similar objects\nconst mesh = new THREE.InstancedMesh(geometry, material, count);\n\n// 5. Limit draw calls\n// Group objects, use LOD (Level of Detail)\n```\n\n## 7. Referencias\n\n- [Three.js Docs](https://threejs.org/docs/)\n- [React Three Fiber](https://docs.pmnd.rs/react-three-fiber/)\n- [Shader Material](https://threejs.org/docs/#api/en/materials/ShaderMaterial)\n"},{"slug":"typescript-5","title":"TypeScript 5.8","version":"5.8.2","category":"frontend","categoryName":"Frontend","categoryIcon":"🎨","categoryColor":"#8b5cf6","tags":["types","generics","pattern-matching"],"sections":[{"title":"1. Configuración UltraIa","content":"\n```json\n// tsconfig.base.json\n{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"module\": \"ESNext\",\n    \"moduleResolution\": \"Bundler\",\n    \"strict\": true,\n    \"esModuleInterop\": true,\n    \"skipLibCheck\": true,\n    \"forceConsistentCasingInFileNames\": true,\n    \"resolveJsonModule\": true,\n    \"noEmit\": true\n  }\n}\n```\n\n"},{"title":"2. Advanced Types - Patrones esenciales","content":"\n### Conditional Types\n```typescript\ntype IsString<T> = T extends string ? true : false;\ntype A = IsString<'hello'>; // true\ntype B = IsString<number>;  // false\n```\n\n### infer - Extraer tipos\n```typescript\ntype UnwrapPromise<T> = T extends Promise<infer U> ? U : T;\ntype Unwrapped = UnwrapPromise<Promise<string>>; // string\n\ntype ExtractFunctionReturn<T> = T extends (...args: any[]) => infer R ? R : never;\n```\n\n### Template Literal Types\n```typescript\ntype KebabToCamel<S extends string> =\n  S extends `${infer First}-${infer Rest}`\n    ? `${First}${Capitalize<KebabToCamel<Rest>>}`\n    : S;\n\ntype Result = KebabToCamel<'hello-world'>; // 'helloWorld'\n```\n\n### Discriminated Unions\n```typescript\ntype Shape =\n  | { kind: 'circle'; radius: number }\n  | { kind: 'rectangle'; width: number; height: number };\n\nfunction area(shape: Shape): number {\n  switch (shape.kind) {\n    case 'circle': return Math.PI * shape.radius ** 2;\n    case 'rectangle': return shape.width * shape.height;\n  }\n}\n```\n\n### Branded Types\n```typescript\ntype UserId = string & { __brand: 'UserId' };\ntype OrderId = string & { __brand: 'OrderId' };\n\nfunction getUser(id: UserId) { /* ... */ }\n\n// Can't mix them\nconst userId = '123' as UserId;\nconst orderId = '456' as OrderId;\ngetUser(userId);  // ✅\ngetUser(orderId); // ❌ Type error\n```\n\n"},{"title":"3. satisfies Operator (TS 4.9+)","content":"\n```typescript\n// Validates shape without widening type\nconst palette = {\n  red: [255, 0, 0],\n  green: '#00ff00',\n} satisfies Record<string, string | number[]>;\n\n// palette.red is still typed as number[], not string | number[]\npalette.red.map(c => c.toString()); // ✅ works\n```\n\n"},{"title":"4. const Type Parameters","content":"\n```typescript\n// Before: user had to add `as const` at call site\nfunction getRoutes<const T extends readonly string[]>(routes: T): T {\n  return routes;\n}\n\n// Now infers literal types automatically\nconst routes = getRoutes(['/home', '/about', '/contact']);\n// typeof routes: readonly [\"/home\", \"/about\", \"/contact\"]\n```\n\n"},{"title":"5. using - Explicit Resource Management (TS 5.2+)","content":"\n```typescript\nclass DatabaseConnection implements Disposable {\n  [Symbol.dispose]() {\n    this.close();\n  }\n  \n  query(sql: string) { /* ... */ }\n  close() { /* ... */ }\n}\n\nfunction getData() {\n  using conn = new DatabaseConnection(); // Auto-cleanup\n  return conn.query('SELECT * FROM users');\n}\n```\n\n"},{"title":"6. Template Literal Pattern Matching","content":"\n```typescript\ntype ParseRoute<S extends string> =\n  S extends `${string}:${infer Param}/${infer Rest}`\n    ? Param | ParseRoute<Rest>\n    : S extends `${string}:${infer Param}`\n      ? Param\n      : never;\n\ntype Params = ParseRoute<'/users/:id/posts/:postId'>;\n// 'id' | 'postId'\n```\n\n"},{"title":"7. Recursive Types","content":"\n```typescript\ntype DeepPartial<T> = T extends object\n  ? { [K in keyof T]?: DeepPartial<T[K]> }\n  : T;\n\ntype Paths<T, P extends string = ''> = T extends object\n  ? { [K in keyof T & string]: Paths<T[K], `${P}${P ? '.' : ''}${K}`> }[keyof T & string]\n  : P;\n```\n\n"},{"title":"8. Variadic Tuple Types","content":"\n```typescript\ntype Concat<A extends any[], B extends any[]> = [...A, ...B];\ntype Result = Concat<[1, 2], [3, 4]>; // [1, 2, 3, 4]\n\ntype FunctionArgs = (...args: infer A) => void;\ntype Args = FunctionArgs<string, number, boolean>; // [string, number, boolean]\n```\n\n"},{"title":"9. Mapped Types con Key Remapping","content":"\n```typescript\ntype Accessors<T> = {\n  [K in keyof T as `get${Capitalize<string & K>}`]: () => T[K]\n} & {\n  [K in keyof T as `set${Capitalize<string & K>}`]: (value: T[K]) => void\n};\n\ntype UserAccessors = Accessors<{ name: string; age: number }>;\n// { getName: () => string; getAge: () => number;\n//   setName: (v: string) => void; setAge: (v: number) => void }\n```\n\n"},{"title":"10. TypeScript 5.8 Features","content":"\n### Granular Return Type Checks\n```typescript\nfunction getColor(): 'red' | 'blue' {\n  return Math.random() > 0.5 ? 'red' : 'blue'; // ✅ checked\n}\n```\n\n### --module node18\nStable module resolution for Node.js 18 projects.\n\n### --erasableSyntaxOnly\nEnforces TypeScript-only constructs that have no runtime behavior.\n\n"},{"title":"11. UltraIa TypeScript Patterns","content":"\n```typescript\n// Zod + TypeScript: single source of truth\nconst UserSchema = z.object({\n  id: z.string().uuid(),\n  email: z.string().email(),\n  role: z.enum(['USER', 'ADMIN']),\n});\ntype User = z.infer<typeof UserSchema>;\n\n// Discriminated unions for capabilities\ntype Capability = \n  | 'video_edit' | 'codevfx' | 'travel'\n  | 'diagram' | 'screenflow' | 'cloud'\n  | 'growth' | 'vault' | 'pdfsearch';\n\n// Template literals for tool names\ntype ToolName = `skill_${string}` | `g0_${string}`;\n```\n\n"},{"title":"12. Referencias","content":"\n- [TypeScript Handbook](https://www.typescriptlang.org/docs/handbook/)\n- [TypeScript 5.8 Release Notes](https://www.typescriptlang.org/docs/handbook/release-notes/typescript-5-8.html)\n- [Advanced Types](https://www.typescriptlang.org/docs/handbook/advanced-types.html)\n- [Utility Types](https://www.typescriptlang.org/docs/handbook/utility-types.html)\n\n"}],"rawContent":"# TypeScript 5.8 - Guía Completa UltraIa\n\n> **Versión usada:** 5.8.2\n> **Docs oficiales:** https://www.typescriptlang.org/docs/\n> **Target:** ES2022, Module: ESNext, ModuleResolution: Bundler\n\n---\n\n## 1. Configuración UltraIa\n\n```json\n// tsconfig.base.json\n{\n  \"compilerOptions\": {\n    \"target\": \"ES2022\",\n    \"module\": \"ESNext\",\n    \"moduleResolution\": \"Bundler\",\n    \"strict\": true,\n    \"esModuleInterop\": true,\n    \"skipLibCheck\": true,\n    \"forceConsistentCasingInFileNames\": true,\n    \"resolveJsonModule\": true,\n    \"noEmit\": true\n  }\n}\n```\n\n## 2. Advanced Types - Patrones esenciales\n\n### Conditional Types\n```typescript\ntype IsString<T> = T extends string ? true : false;\ntype A = IsString<'hello'>; // true\ntype B = IsString<number>;  // false\n```\n\n### infer - Extraer tipos\n```typescript\ntype UnwrapPromise<T> = T extends Promise<infer U> ? U : T;\ntype Unwrapped = UnwrapPromise<Promise<string>>; // string\n\ntype ExtractFunctionReturn<T> = T extends (...args: any[]) => infer R ? R : never;\n```\n\n### Template Literal Types\n```typescript\ntype KebabToCamel<S extends string> =\n  S extends `${infer First}-${infer Rest}`\n    ? `${First}${Capitalize<KebabToCamel<Rest>>}`\n    : S;\n\ntype Result = KebabToCamel<'hello-world'>; // 'helloWorld'\n```\n\n### Discriminated Unions\n```typescript\ntype Shape =\n  | { kind: 'circle'; radius: number }\n  | { kind: 'rectangle'; width: number; height: number };\n\nfunction area(shape: Shape): number {\n  switch (shape.kind) {\n    case 'circle': return Math.PI * shape.radius ** 2;\n    case 'rectangle': return shape.width * shape.height;\n  }\n}\n```\n\n### Branded Types\n```typescript\ntype UserId = string & { __brand: 'UserId' };\ntype OrderId = string & { __brand: 'OrderId' };\n\nfunction getUser(id: UserId) { /* ... */ }\n\n// Can't mix them\nconst userId = '123' as UserId;\nconst orderId = '456' as OrderId;\ngetUser(userId);  // ✅\ngetUser(orderId); // ❌ Type error\n```\n\n## 3. satisfies Operator (TS 4.9+)\n\n```typescript\n// Validates shape without widening type\nconst palette = {\n  red: [255, 0, 0],\n  green: '#00ff00',\n} satisfies Record<string, string | number[]>;\n\n// palette.red is still typed as number[], not string | number[]\npalette.red.map(c => c.toString()); // ✅ works\n```\n\n## 4. const Type Parameters\n\n```typescript\n// Before: user had to add `as const` at call site\nfunction getRoutes<const T extends readonly string[]>(routes: T): T {\n  return routes;\n}\n\n// Now infers literal types automatically\nconst routes = getRoutes(['/home', '/about', '/contact']);\n// typeof routes: readonly [\"/home\", \"/about\", \"/contact\"]\n```\n\n## 5. using - Explicit Resource Management (TS 5.2+)\n\n```typescript\nclass DatabaseConnection implements Disposable {\n  [Symbol.dispose]() {\n    this.close();\n  }\n  \n  query(sql: string) { /* ... */ }\n  close() { /* ... */ }\n}\n\nfunction getData() {\n  using conn = new DatabaseConnection(); // Auto-cleanup\n  return conn.query('SELECT * FROM users');\n}\n```\n\n## 6. Template Literal Pattern Matching\n\n```typescript\ntype ParseRoute<S extends string> =\n  S extends `${string}:${infer Param}/${infer Rest}`\n    ? Param | ParseRoute<Rest>\n    : S extends `${string}:${infer Param}`\n      ? Param\n      : never;\n\ntype Params = ParseRoute<'/users/:id/posts/:postId'>;\n// 'id' | 'postId'\n```\n\n## 7. Recursive Types\n\n```typescript\ntype DeepPartial<T> = T extends object\n  ? { [K in keyof T]?: DeepPartial<T[K]> }\n  : T;\n\ntype Paths<T, P extends string = ''> = T extends object\n  ? { [K in keyof T & string]: Paths<T[K], `${P}${P ? '.' : ''}${K}`> }[keyof T & string]\n  : P;\n```\n\n## 8. Variadic Tuple Types\n\n```typescript\ntype Concat<A extends any[], B extends any[]> = [...A, ...B];\ntype Result = Concat<[1, 2], [3, 4]>; // [1, 2, 3, 4]\n\ntype FunctionArgs = (...args: infer A) => void;\ntype Args = FunctionArgs<string, number, boolean>; // [string, number, boolean]\n```\n\n## 9. Mapped Types con Key Remapping\n\n```typescript\ntype Accessors<T> = {\n  [K in keyof T as `get${Capitalize<string & K>}`]: () => T[K]\n} & {\n  [K in keyof T as `set${Capitalize<string & K>}`]: (value: T[K]) => void\n};\n\ntype UserAccessors = Accessors<{ name: string; age: number }>;\n// { getName: () => string; getAge: () => number;\n//   setName: (v: string) => void; setAge: (v: number) => void }\n```\n\n## 10. TypeScript 5.8 Features\n\n### Granular Return Type Checks\n```typescript\nfunction getColor(): 'red' | 'blue' {\n  return Math.random() > 0.5 ? 'red' : 'blue'; // ✅ checked\n}\n```\n\n### --module node18\nStable module resolution for Node.js 18 projects.\n\n### --erasableSyntaxOnly\nEnforces TypeScript-only constructs that have no runtime behavior.\n\n## 11. UltraIa TypeScript Patterns\n\n```typescript\n// Zod + TypeScript: single source of truth\nconst UserSchema = z.object({\n  id: z.string().uuid(),\n  email: z.string().email(),\n  role: z.enum(['USER', 'ADMIN']),\n});\ntype User = z.infer<typeof UserSchema>;\n\n// Discriminated unions for capabilities\ntype Capability = \n  | 'video_edit' | 'codevfx' | 'travel'\n  | 'diagram' | 'screenflow' | 'cloud'\n  | 'growth' | 'vault' | 'p"},{"slug":"vercel-ai-sdk","title":"Vercel AI SDK","version":"4.1.61","category":"backend","categoryName":"Backend","categoryIcon":"⚙️","categoryColor":"#3b82f6","tags":["ai","streaming","tools","agents"],"sections":[{"title":"1. ¿Qué es el Vercel AI SDK?","content":"\nFramework para construir aplicaciones AI con streaming, tools, y agents:\n- `generateText()` — respuesta de texto completa\n- `streamText()` — streaming de tokens en tiempo real\n- `generateObject()` — respuesta estructurada (JSON/Zod)\n- `streamObject()` — streaming de objetos\n- Tools — funciones que el modelo puede llamar\n- Agents — loops de tool-calling autónomos\n\n"},{"title":"2. Configuración UltraIa","content":"\n```ts\n// packages/core/src/ai/llm.ts\nimport { openai } from '@ai-sdk/openai';\nimport { google } from '@ai-sdk/google';\nimport { createOllama } from 'ollama-ai-provider';\n\nconst providers = {\n  openai: openai(process.env.OPENAI_API_KEY),\n  google: google(process.env.GOOGLE_API_KEY),\n  ollama: createOllama({ baseUrl: 'http://localhost:11434' }),\n};\n\nexport function resolveModel(providerName: string, modelId?: string) {\n  const provider = providers[providerName] || providers.openai;\n  return provider(modelId || 'gpt-4o');\n}\n```\n\n"},{"title":"3. generateText - Respuesta completa","content":"\n```ts\nimport { generateText } from 'ai';\n\nconst { text } = await generateText({\n  model: openai('gpt-4o'),\n  system: 'You are a helpful assistant.',\n  prompt: 'Explain quantum computing in simple terms.',\n  maxTokens: 1000,\n  temperature: 0.7,\n});\n\nconsole.log(text);\n```\n\n"},{"title":"4. streamText - Streaming en tiempo real","content":"\n```ts\nimport { streamText } from 'ai';\n\nconst result = streamText({\n  model: openai('gpt-4o'),\n  messages,\n  tools,\n  maxSteps: 5,\n  onStepFinish: ({ toolCalls, toolResults }) => {\n    console.log('Tool calls:', toolCalls);\n  },\n});\n\nreturn result.toDataStreamResponse();\n```\n\n"},{"title":"5. generateObject - Respuesta estructurada","content":"\n```ts\nimport { generateObject } from 'ai';\nimport { z } from 'zod';\n\nconst { object } = await generateObject({\n  model: openai('gpt-4o'),\n  schema: z.object({\n    title: z.string(),\n    summary: z.string(),\n    tags: z.array(z.string()),\n    sentiment: z.enum(['positive', 'negative', 'neutral']),\n  }),\n  prompt: 'Analyze this article...',\n});\n\nconsole.log(object.title); // Typed as string\n```\n\n"},{"title":"6. Tools - Funciones del modelo","content":"\n```ts\nconst tools = {\n  getWeather: tool({\n    description: 'Get current weather for a city',\n    parameters: z.object({\n      city: z.string().describe('City name'),\n      units: z.enum(['celsius', 'fahrenheit']).default('celsius'),\n    }),\n    execute: async ({ city, units }) => {\n      const weather = await fetchWeather(city, units);\n      return { temperature: weather.temp, condition: weather.desc };\n    },\n  }),\n  \n  searchDatabase: tool({\n    description: 'Search the database',\n    parameters: z.object({\n      query: z.string(),\n      limit: z.number().default(10),\n    }),\n    execute: async ({ query, limit }) => {\n      return await prisma.post.findMany({\n        where: { title: { contains: query } },\n        take: limit,\n      });\n    },\n  }),\n};\n\n// Usage with streaming\nconst result = streamText({\n  model: openai('gpt-4o'),\n  messages,\n  tools,\n  maxSteps: 5, // Allow multiple tool call rounds\n});\n```\n\n"},{"title":"7. Agent Pattern - Multi-step reasoning","content":"\n```ts\nconst result = await generateText({\n  model: openai('gpt-4o'),\n  prompt: 'Analyze the sentiment of these comments and summarize',\n  tools: {\n    analyzeSentiment: tool({\n      description: 'Analyze sentiment of text',\n      parameters: z.object({ text: z.string() }),\n      execute: async ({ text }) => {\n        // Analysis logic\n        return { sentiment: 'positive', confidence: 0.95 };\n      },\n    }),\n    summarize: tool({\n      description: 'Summarize analysis results',\n      parameters: z.object({ results: z.array(z.object({})) }),\n      execute: async ({ results }) => {\n        return { summary: '...' };\n      },\n    }),\n  },\n  maxSteps: 10, // Agent loop\n});\n```\n\n"},{"title":"8. UI Integration (React)","content":"\n```tsx\n'use client';\nimport { useChat } from 'ai/react';\n\nexport function Chat() {\n  const { messages, input, handleInputChange, handleSubmit, isLoading } = useChat({\n    api: '/api/chat',\n    maxSteps: 5,\n  });\n\n  return (\n    <div>\n      {messages.map(m => (\n        <div key={m.id} className={m.role === 'user' ? 'user' : 'assistant'}>\n          {m.content}\n          {m.toolInvocations?.map(tool => (\n            <div key.toolCallId className=\"tool-call\">\n              {tool.state === 'result' ? tool.result : 'Loading...'}\n            </div>\n          ))}\n        </div>\n      ))}\n      <form onSubmit={handleSubmit}>\n        <input value={input} onChange={handleInputC
