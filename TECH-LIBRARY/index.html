hange} />\n      </form>\n    </div>\n  );\n}\n```\n\n"},{"title":"9. Provider Configuration","content":"\n```ts\n// OpenAI\nconst openaiProvider = openai({\n  apiKey: process.env.OPENAI_API_KEY,\n});\n\n// Google\nconst googleProvider = google({\n  apiKey: process.env.GOOGLE_API_KEY,\n});\n\n// Ollama (local)\nconst ollamaProvider = createOllama({\n  baseUrl: 'http://localhost:11434',\n});\n\n// Model selection\nconst model = resolveModel('openai', 'gpt-4o'); // or 'gpt-4o-mini'\n```\n\n"},{"title":"10. Error Handling","content":"\n```ts\nimport { generateText } from 'ai';\nimport { APICallError } from 'ai';\n\ntry {\n  const result = await generateText({ model, prompt });\n} catch (error) {\n  if (error instanceof APICallError) {\n    console.error('API Error:', error.statusCode, error.message);\n  }\n}\n```\n\n"},{"title":"11. UltraIa Usage","content":"\n```ts\n// packages/core/src/ai/llm.ts\n// Main entry point for all AI operations\n\n// Agent capabilities registered as tools\nconst allTools = {\n  // Content tools\n  skill_plan: planTool,\n  skill_build: buildTool,\n  skill_test: testTool,\n  \n  // Media tools\n  video_edit_pack: videoEditPackTool,\n  diagram_render: diagramRenderTool,\n  vfx_code: vfxCodeTool,\n  \n  // Research tools\n  reach_searchWeb: searchWebTool,\n  reach_readWeb: readWebTool,\n  \n  // System tools\n  memory_store: memoryStoreTool,\n  cloud_files: cloudFilesTool,\n};\n\n// Stream response with tools\nexport async function streamChat(messages, opts) {\n  return streamText({\n    model: resolveModel(opts.provider, opts.model),\n    messages,\n    tools: allTools,\n    maxSteps: opts.maxSteps || 5,\n  });\n}\n```\n\n"},{"title":"12. Referencias","content":"\n- [AI SDK Docs](https://sdk.vercel.ai/docs)\n- [generateText](https://sdk.vercel.ai/docs/ai-sdk-core/generating-text)\n- [Tools](https://sdk.vercel.ai/docs/ai-sdk-core/tools-and-tool-calling)\n- [Streaming](https://sdk.vercel.ai/docs/ai-sdk-ui/streaming)\n\n"}],"rawContent":"# Vercel AI SDK - Guía Completa UltraIa\n\n> **Versión usada:** 4.1.61\n> **Providers:** OpenAI (`@ai-sdk/openai`), Google (`@ai-sdk/google`), Ollama, LMStudio, DeepSeek\n> **Docs:** https://sdk.vercel.ai/docs\n\n---\n\n## 1. ¿Qué es el Vercel AI SDK?\n\nFramework para construir aplicaciones AI con streaming, tools, y agents:\n- `generateText()` — respuesta de texto completa\n- `streamText()` — streaming de tokens en tiempo real\n- `generateObject()` — respuesta estructurada (JSON/Zod)\n- `streamObject()` — streaming de objetos\n- Tools — funciones que el modelo puede llamar\n- Agents — loops de tool-calling autónomos\n\n## 2. Configuración UltraIa\n\n```ts\n// packages/core/src/ai/llm.ts\nimport { openai } from '@ai-sdk/openai';\nimport { google } from '@ai-sdk/google';\nimport { createOllama } from 'ollama-ai-provider';\n\nconst providers = {\n  openai: openai(process.env.OPENAI_API_KEY),\n  google: google(process.env.GOOGLE_API_KEY),\n  ollama: createOllama({ baseUrl: 'http://localhost:11434' }),\n};\n\nexport function resolveModel(providerName: string, modelId?: string) {\n  const provider = providers[providerName] || providers.openai;\n  return provider(modelId || 'gpt-4o');\n}\n```\n\n## 3. generateText - Respuesta completa\n\n```ts\nimport { generateText } from 'ai';\n\nconst { text } = await generateText({\n  model: openai('gpt-4o'),\n  system: 'You are a helpful assistant.',\n  prompt: 'Explain quantum computing in simple terms.',\n  maxTokens: 1000,\n  temperature: 0.7,\n});\n\nconsole.log(text);\n```\n\n## 4. streamText - Streaming en tiempo real\n\n```ts\nimport { streamText } from 'ai';\n\nconst result = streamText({\n  model: openai('gpt-4o'),\n  messages,\n  tools,\n  maxSteps: 5,\n  onStepFinish: ({ toolCalls, toolResults }) => {\n    console.log('Tool calls:', toolCalls);\n  },\n});\n\nreturn result.toDataStreamResponse();\n```\n\n## 5. generateObject - Respuesta estructurada\n\n```ts\nimport { generateObject } from 'ai';\nimport { z } from 'zod';\n\nconst { object } = await generateObject({\n  model: openai('gpt-4o'),\n  schema: z.object({\n    title: z.string(),\n    summary: z.string(),\n    tags: z.array(z.string()),\n    sentiment: z.enum(['positive', 'negative', 'neutral']),\n  }),\n  prompt: 'Analyze this article...',\n});\n\nconsole.log(object.title); // Typed as string\n```\n\n## 6. Tools - Funciones del modelo\n\n```ts\nconst tools = {\n  getWeather: tool({\n    description: 'Get current weather for a city',\n    parameters: z.object({\n      city: z.string().describe('City name'),\n      units: z.enum(['celsius', 'fahrenheit']).default('celsius'),\n    }),\n    execute: async ({ city, units }) => {\n      const weather = await fetchWeather(city, units);\n      return { temperature: weather.temp, condition: weather.desc };\n    },\n  }),\n  \n  searchDatabase: tool({\n    description: 'Search the database',\n    parameters: z.object({\n      query: z.string(),\n      limit: z.number().default(10),\n    }),\n    execute: async ({ query, limit }) => {\n      return await prisma.post.findMany({\n        where: { title: { contains: query } },\n        take: limit,\n      });\n    },\n  }),\n};\n\n// Usage with streaming\nconst result = streamText({\n  model: openai('gpt-4o'),\n  messages,\n  tools,\n  maxSteps: 5, // Allow multiple tool call rounds\n});\n```\n\n## 7. Agent Pattern - Multi-step reasoning\n\n```ts\nconst result = await generateText({\n  model: openai('gpt-4o'),\n  prompt: 'Analyze the sentiment of these comments and summarize',\n  tools: {\n    analyzeSentiment: tool({\n      description: 'Analyze sentiment of text',\n      parameters: z.object({ text: z.string() }),\n      execute: async ({ text }) => {\n        // Analysis logic\n        return { sentiment: 'positive', confidence: 0.95 };\n      },\n    }),\n    summarize: tool({\n      description: 'Summarize analysis results',\n      parameters: z.object({ results: z.array(z.object({})) }),\n      execute: async ({ results }) => {\n        return { summary: '...' };\n      },\n    }),\n  },\n  maxSteps: 10, // Agent loop\n});\n```\n\n## 8. UI Integration (React)\n\n```tsx\n'use client';\nimport { useChat } from 'ai/react';\n\nexport function Chat() {\n  const { messages, input, handleInputChange, handleSubmit, isLoading } = useChat({\n    api: '/api/chat',\n    maxSteps: 5,\n  });\n\n  return (\n    <div>\n      {messages.map(m => (\n        <div key={m.id} className={m.role === 'user' ? 'user' : 'assistant'}>\n          {m.content}\n          {m.toolInvocations?.map(tool => (\n            <div key.toolCallId className=\"tool-call\">\n              {tool.state === 'result' ? tool.result : 'Loading...'}\n            </div>\n          ))}\n        </div>\n      ))}\n      <form onSubmit={handleSubmit}>\n        <input value={input} onChange={handleInputChange} />\n      </form>\n    </div>\n  );\n}\n```\n\n## 9. Provider Configuration\n\n```ts\n// OpenAI\nconst openaiProvider = openai({\n  apiKey: process.env.OPENAI_API_KEY,\n});\n\n// Google\nconst googleProvider = google({\n  apiKey: process.env.GOOGLE_API_KEY,\n});\n\n// Ollama (local)\nconst ollamaProvider = createOllama({\n  baseUrl: 'http://localhost:11434',\n});\n\n//"},{"slug":"vitest","title":"Vitest","version":"3.0.9","category":"testing","categoryName":"Testing","categoryIcon":"🧪","categoryColor":"#06b6d4","tags":["unit","mocking","coverage"],"sections":[{"title":"1. Fundamentos","content":"\n```typescript\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\ndescribe('UserService', () => {\n  it('should create a user', () => {\n    const user = createUser({ name: 'Test' });\n    expect(user.name).toBe('Test');\n    expect(user.id).toBeDefined();\n  });\n});\n```\n\n"},{"title":"2. Mocking","content":"\n```typescript\n// Mock function\nconst mockFn = vi.fn();\nmockFn.mockReturnValue(42);\nexpect(mockFn()).toBe(42);\n\n// Mock module\nvi.mock('./database', () => ({\n  prisma: {\n    user: {\n      findMany: vi.fn().mockResolvedValue([]),\n      create: vi.fn().mockResolvedValue({ id: '1', name: 'Test' }),\n    },\n  },\n}));\n\n// Mock with implementation\nvi.mock('ai', () => ({\n  generateText: vi.fn().mockResolvedValue({ text: 'Hello' }),\n  streamText: vi.fn().mockReturnValue({\n    toDataStreamResponse: vi.fn(),\n  }),\n}));\n```\n\n"},{"title":"3. Setup & Teardown","content":"\n```typescript\ndescribe('My Suite', () => {\n  beforeEach(() => {\n    vi.clearAllMocks();\n  });\n  \n  afterEach(() => {\n    vi.restoreAllMocks();\n  });\n  \n  it('test 1', () => { /* ... */ });\n  it('test 2', () => { /* ... */ });\n});\n```\n\n"},{"title":"4. Async Tests","content":"\n```typescript\nit('should fetch data', async () => {\n  const result = await fetchData();\n  expect(result).toEqual({ data: 'test' });\n});\n\nit('should reject', async () => {\n  await expect(fetchData()).rejects.toThrow('Not found');\n});\n```\n\n"},{"title":"5. Snapshot Testing","content":"\n```typescript\nit('should match snapshot', () => {\n  const component = renderComponent();\n  expect(component).toMatchSnapshot();\n});\n\nit('should match inline snapshot', () => {\n  expect(getData()).toMatchInlineSnapshot(`\n    {\n      \"id\": \"1\",\n      \"name\": \"Test\",\n    }\n  `);\n});\n```\n\n"},{"title":"6. UltraIa Test Patterns","content":"\n```typescript\n// Mock AI providers\nvi.mock('@ai-sdk/openai', () => ({\n  openai: vi.fn(() => ({\n    __call: vi.fn(),\n  })),\n}));\n\n// Mock Prisma\nvi.mock('@prisma/client', () => ({\n  PrismaClient: vi.fn(() => ({\n    user: { findMany: vi.fn(), create: vi.fn() },\n    publication: { findMany: vi.fn(), create: vi.fn() },\n  })),\n}));\n\n// Tool testing\ndescribe('tool', () => {\n  it('should validate parameters', () => {\n    const result = toolSchema.safeParse({ city: 'Lima' });\n    expect(result.success).toBe(true);\n  });\n  \n  it('should execute', async () => {\n    const result = await tool.execute({ city: 'Lima' });\n    expect(result).toBeDefined();\n  });\n});\n```\n\n"},{"title":"7. Configuration","content":"\n```typescript\n// vitest.config.ts\nimport { defineConfig } from 'vitest/config';\n\nexport default defineConfig({\n  test: {\n    globals: true,\n    environment: 'node',\n    include: ['**/*.test.ts'],\n    coverage: {\n      provider: 'v8',\n      reporter: ['text', 'json', 'html'],\n    },\n  },\n});\n```\n\n"},{"title":"8. Referencias","content":"\n- [Vitest Docs](https://vitest.dev/docs/)\n- [Vitest GitHub](https://github.com/vitest-dev/vitest)\n- [Mocking Guide](https://vitest.dev/guide/mocking.html)\n\n"}],"rawContent":"# Vitest - Guía Completa UltraIa\n\n> **Versión usada:** 3.0.9\n> **Coverage:** `@vitest/coverage-v8`\n> **Docs:** https://vitest.dev/docs/\n\n---\n\n## 1. Fundamentos\n\n```typescript\nimport { describe, it, expect, vi, beforeEach } from 'vitest';\n\ndescribe('UserService', () => {\n  it('should create a user', () => {\n    const user = createUser({ name: 'Test' });\n    expect(user.name).toBe('Test');\n    expect(user.id).toBeDefined();\n  });\n});\n```\n\n## 2. Mocking\n\n```typescript\n// Mock function\nconst mockFn = vi.fn();\nmockFn.mockReturnValue(42);\nexpect(mockFn()).toBe(42);\n\n// Mock module\nvi.mock('./database', () => ({\n  prisma: {\n    user: {\n      findMany: vi.fn().mockResolvedValue([]),\n      create: vi.fn().mockResolvedValue({ id: '1', name: 'Test' }),\n    },\n  },\n}));\n\n// Mock with implementation\nvi.mock('ai', () => ({\n  generateText: vi.fn().mockResolvedValue({ text: 'Hello' }),\n  streamText: vi.fn().mockReturnValue({\n    toDataStreamResponse: vi.fn(),\n  }),\n}));\n```\n\n## 3. Setup & Teardown\n\n```typescript\ndescribe('My Suite', () => {\n  beforeEach(() => {\n    vi.clearAllMocks();\n  });\n  \n  afterEach(() => {\n    vi.restoreAllMocks();\n  });\n  \n  it('test 1', () => { /* ... */ });\n  it('test 2', () => { /* ... */ });\n});\n```\n\n## 4. Async Tests\n\n```typescript\nit('should fetch data', async () => {\n  const result = await fetchData();\n  expect(result).toEqual({ data: 'test' });\n});\n\nit('should reject', async () => {\n  await expect(fetchData()).rejects.toThrow('Not found');\n});\n```\n\n## 5. Snapshot Testing\n\n```typescript\nit('should match snapshot', () => {\n  const component = renderComponent();\n  expect(component).toMatchSnapshot();\n});\n\nit('should match inline snapshot', () => {\n  expect(getData()).toMatchInlineSnapshot(`\n    {\n      \"id\": \"1\",\n      \"name\": \"Test\",\n    }\n  `);\n});\n```\n\n## 6. UltraIa Test Patterns\n\n```typescript\n// Mock AI providers\nvi.mock('@ai-sdk/openai', () => ({\n  openai: vi.fn(() => ({\n    __call: vi.fn(),\n  })),\n}));\n\n// Mock Prisma\nvi.mock('@prisma/client', () => ({\n  PrismaClient: vi.fn(() => ({\n    user: { findMany: vi.fn(), create: vi.fn() },\n    publication: { findMany: vi.fn(), create: vi.fn() },\n  })),\n}));\n\n// Tool testing\ndescribe('tool', () => {\n  it('should validate parameters', () => {\n    const result = toolSchema.safeParse({ city: 'Lima' });\n    expect(result.success).toBe(true);\n  });\n  \n  it('should execute', async () => {\n    const result = await tool.execute({ city: 'Lima' });\n    expect(result).toBeDefined();\n  });\n});\n```\n\n## 7. Configuration\n\n```typescript\n// vitest.config.ts\nimport { defineConfig } from 'vitest/config';\n\nexport default defineConfig({\n  test: {\n    globals: true,\n    environment: 'node',\n    include: ['**/*.test.ts'],\n    coverage: {\n      provider: 'v8',\n      reporter: ['text', 'json', 'html'],\n    },\n  },\n});\n```\n\n## 8. Referencias\n\n- [Vitest Docs](https://vitest.dev/docs/)\n- [Vitest GitHub](https://github.com/vitest-dev/vitest)\n- [Mocking Guide](https://vitest.dev/guide/mocking.html)\n"},{"slug":"webrtc","title":"WebRTC","version":"-","category":"realtime","categoryName":"Tiempo Real","categoryIcon":"⚡","categoryColor":"#f59e0b","tags":["p2p","video","data-channels"],"sections":[{"title":"1. Fundamentals","content":"\n```typescript\n// Create peer connection\nconst pc = new RTCPeerConnection({\n  iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],\n});\n\n// Create offer\nconst offer = await pc.createOffer();\nawait pc.setLocalDescription(offer);\n\n// Signal offer to remote peer (via WebSocket/HTTP)\nawait sendSignaling({ type: 'offer', sdp: offer.sdp });\n\n// Receive answer\nconst answer = await pc.createAnswer();\nawait pc.setLocalDescription(answer);\n\n// ICE candidates\npc.onicecandidate = (event) => {\n  if (event.candidate) {\n    sendSignaling({ type: 'candidate', candidate: event.candidate });\n  }\n};\n\n// Remote stream\npc.ontrack = (event) => {\n  remoteVideo.srcObject = event.streams[0];\n};\n```\n\n"},{"title":"2. Signaling Flow","content":"\n```\nPeer A                    Signaling Server               Peer B\n  |                             |                           |\n  |--- Create Offer ----------->|                           |\n  |                             |--- Forward Offer -------->|\n  |                             |<-- Create Answer ---------|\n  |<-- Forward Answer ----------|                           |\n  |                             |                           |\n  |<-------- ICE Candidates (bidirectional) -------------->|\n  |                             |                           |\n  |<============ Media Stream (P2P) ======================>|\n```\n\n"},{"title":"3. UltraIa Usage","content":"\n- **Chat voice/video**: `apps/web` uses WebRTC for real-time communication\n- **Agent voice**: TTS output streamed via WebRTC\n- **Screen sharing**: Agent can view user's screen\n\n"},{"title":"4. Referencias","content":"\n- [WebRTC MDN](https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API)\n- [SimpleWebRTC](https://simplewebrtc.com/)\n\n"}],"rawContent":"# WebRTC - Guía UltraIa\n\n> **Propósito:** P2P video calling, data channels\n> **Docs:** https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API\n\n---\n\n## 1. Fundamentals\n\n```typescript\n// Create peer connection\nconst pc = new RTCPeerConnection({\n  iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],\n});\n\n// Create offer\nconst offer = await pc.createOffer();\nawait pc.setLocalDescription(offer);\n\n// Signal offer to remote peer (via WebSocket/HTTP)\nawait sendSignaling({ type: 'offer', sdp: offer.sdp });\n\n// Receive answer\nconst answer = await pc.createAnswer();\nawait pc.setLocalDescription(answer);\n\n// ICE candidates\npc.onicecandidate = (event) => {\n  if (event.candidate) {\n    sendSignaling({ type: 'candidate', candidate: event.candidate });\n  }\n};\n\n// Remote stream\npc.ontrack = (event) => {\n  remoteVideo.srcObject = event.streams[0];\n};\n```\n\n## 2. Signaling Flow\n\n```\nPeer A                    Signaling Server               Peer B\n  |                             |                           |\n  |--- Create Offer ----------->|                           |\n  |                             |--- Forward Offer -------->|\n  |                             |<-- Create Answer ---------|\n  |<-- Forward Answer ----------|                           |\n  |                             |                           |\n  |<-------- ICE Candidates (bidirectional) -------------->|\n  |                             |                           |\n  |<============ Media Stream (P2P) ======================>|\n```\n\n## 3. UltraIa Usage\n\n- **Chat voice/video**: `apps/web` uses WebRTC for real-time communication\n- **Agent voice**: TTS output streamed via WebRTC\n- **Screen sharing**: Agent can view user's screen\n\n## 4. Referencias\n\n- [WebRTC MDN](https://developer.mozilla.org/en-US/docs/Web/API/WebRTC_API)\n- [SimpleWebRTC](https://simplewebrtc.com/)\n"},{"slug":"websocket","title":"WebSocket","version":"-","category":"realtime","categoryName":"Tiempo Real","categoryIcon":"⚡","categoryColor":"#f59e0b","tags":["realtime","ws"],"sections":[{"title":"1. Fundamentals","content":"\n```typescript\n// Client-side WebSocket\nconst ws = new WebSocket('ws://localhost:8000/events');\n\nws.onopen = () => {\n  console.log('Connected');\n  ws.send(JSON.stringify({ type: 'subscribe', topic: 'health' }));\n};\n\nws.onmessage = (event) => {\n  const data = JSON.parse(event.data);\n  console.log('Received:', data);\n};\n\nws.onclose = () => console.log('Disconnected');\nws.onerror = (error) => console.error('WebSocket error:', error);\n```\n\n"},{"title":"2. Server-side (Node.js)","content":"\n```typescript\n// Using ws library\nimport { WebSocketServer } from 'ws';\n\nconst wss = new WebSocketServer({ port: 8000 });\n\nwss.on('connection', (ws, req) => {\n  // Validate token from URL params\n  const url = new URL(req.url, 'http://localhost');\n  const token = url.searchParams.get('token');\n  \n  if (!validateToken(token)) {\n    ws.close(1008, 'Unauthorized');\n    return;\n  }\n  \n  // Send connected message\n  ws.send(JSON.stringify({ type: 'connected', at: Date.now() }));\n  \n  ws.on('message', (message) => {\n    const data = JSON.parse(message.toString());\n    // Handle subscription\n  });\n  \n  ws.on('close', () => {\n    console.log('Client disconnected');\n  });\n});\n\n// Broadcast to all clients\nfunction broadcast(topic, payload) {\n  wss.clients.forEach((client) => {\n    if (client.readyState === WebSocket.OPEN) {\n      client.send(JSON.stringify({\n        type: 'event',\n        topic,\n        payload,\n        at: Date.now(),\n      }));\n    }\n  });\n}\n```\n\n"},{"title":"3. UltraIa Event Bus Pattern","content":"\n```typescript\n// packages/runtime/src/api/ws.ts\n// Topic filtering: only send events matching subscription pattern\nconst TOPIC_PATTERN = /^(module|task|health|resource|memory|runtime|api)\\./;\n\nws.on('message', (message) => {\n  const data = JSON.parse(message.toString());\n  \n  if (data.type === 'subscribe') {\n    subscriptions.add(data.topic);\n  }\n});\n\n// When event occurs\nfunction emitEvent(topic: string, payload: any) {\n  if (!TOPIC_PATTERN.test(topic)) return; // Invalid topic\n  \n  const message = JSON.stringify({\n    type: 'event',\n    topic,\n    payload,\n    at: Date.now(),\n  });\n  \n  wss.clients.forEach((client) => {\n    if (client.readyState === WebSocket.OPEN) {\n      // Check if client is subscribed to this topic\n      client.send(message);\n    }\n  });\n}\n\n// Usage\nemitEvent('health.check', { status: 'ok', latency: 12 });\nemitEvent('task.completed', { taskId: '123', result: '...' });\nemitEvent('module.loaded', { moduleId: 'weather', version: '1.0.0' });\n```\n\n"},{"title":"4. Connection Management","content":"\n```typescript\n// Reconnection with backoff\nfunction connectWithReconnect(url, maxRetries = 5) {\n  let retries = 0;\n  \n  function connect() {\n    const ws = new WebSocket(url);\n    \n    ws.onopen = () => {\n      retries = 0; // Reset on success\n    };\n    \n    ws.onclose = () => {\n      if (retries < maxRetries) {\n        const delay = Math.min(1000 * 2 ** retries, 30000);\n        retries++;\n        setTimeout(connect, delay);\n      }\n    };\n    \n    return ws;\n  }\n  \n  return connect();\n}\n```\n\n"},{"title":"5. Referencias","content":"\n- [MDN WebSocket](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket)\n- [ws Library](https://github.com/websockets/ws)\n\n"}],"rawContent":"# WebSocket - Guía UltraIa\n\n> **Propósito:** Real-time communication (chat, notifications, agent events)\n> **Docs:** https://developer.mozilla.org/en-US/docs/Web/API/WebSocket\n\n---\n\n## 1. Fundamentals\n\n```typescript\n// Client-side WebSocket\nconst ws = new WebSocket('ws://localhost:8000/events');\n\nws.onopen = () => {\n  console.log('Connected');\n  ws.send(JSON.stringify({ type: 'subscribe', topic: 'health' }));\n};\n\nws.onmessage = (event) => {\n  const data = JSON.parse(event.data);\n  console.log('Received:', data);\n};\n\nws.onclose = () => console.log('Disconnected');\nws.onerror = (error) => console.error('WebSocket error:', error);\n```\n\n## 2. Server-side (Node.js)\n\n```typescript\n// Using ws library\nimport { WebSocketServer } from 'ws';\n\nconst wss = new WebSocketServer({ port: 8000 });\n\nwss.on('connection', (ws, req) => {\n  // Validate token from URL params\n  const url = new URL(req.url, 'http://localhost');\n  const token = url.searchParams.get('token');\n  \n  if (!validateToken(token)) {\n    ws.close(1008, 'Unauthorized');\n    return;\n  }\n  \n  // Send connected message\n  ws.send(JSON.stringify({ type: 'connected', at: Date.now() }));\n  \n  ws.on('message', (message) => {\n    const data = JSON.parse(message.toString());\n    // Handle subscription\n  });\n  \n  ws.on('close', () => {\n    console.log('Client disconnected');\n  });\n});\n\n// Broadcast to all clients\nfunction broadcast(topic, payload) {\n  wss.clients.forEach((client) => {\n    if (client.readyState === WebSocket.OPEN) {\n      client.send(JSON.stringify({\n        type: 'event',\n        topic,\n        payload,\n        at: Date.now(),\n      }));\n    }\n  });\n}\n```\n\n## 3. UltraIa Event Bus Pattern\n\n```typescript\n// packages/runtime/src/api/ws.ts\n// Topic filtering: only send events matching subscription pattern\nconst TOPIC_PATTERN = /^(module|task|health|resource|memory|runtime|api)\\./;\n\nws.on('message', (message) => {\n  const data = JSON.parse(message.toString());\n  \n  if (data.type === 'subscribe') {\n    subscriptions.add(data.topic);\n  }\n});\n\n// When event occurs\nfunction emitEvent(topic: string, payload: any) {\n  if (!TOPIC_PATTERN.test(topic)) return; // Invalid topic\n  \n  const message = JSON.stringify({\n    type: 'event',\n    topic,\n    payload,\n    at: Date.now(),\n  });\n  \n  wss.clients.forEach((client) => {\n    if (client.readyState === WebSocket.OPEN) {\n      // Check if client is subscribed to this topic\n      client.send(message);\n    }\n  });\n}\n\n// Usage\nemitEvent('health.check', { status: 'ok', latency: 12 });\nemitEvent('task.completed', { taskId: '123', result: '...' });\nemitEvent('module.loaded', { moduleId: 'weather', version: '1.0.0' });\n```\n\n## 4. Connection Management\n\n```typescript\n// Reconnection with backoff\nfunction connectWithReconnect(url, maxRetries = 5) {\n  let retries = 0;\n  \n  function connect() {\n    const ws = new WebSocket(url);\n    \n    ws.onopen = () => {\n      retries = 0; // Reset on success\n    };\n    \n    ws.onclose = () => {\n      if (retries < maxRetries) {\n        const delay = Math.min(1000 * 2 ** retries, 30000);\n        retries++;\n        setTimeout(connect, delay);\n      }\n    };\n    \n    return ws;\n  }\n  \n  return connect();\n}\n```\n\n## 5. Referencias\n\n- [MDN WebSocket](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket)\n- [ws Library](https://github.com/websockets/ws)\n"},{"slug":"zod","title":"Zod","version":"3.24.2","category":"backend","categoryName":"Backend","categoryIcon":"⚙️","categoryColor":"#3b82f6","tags":["validation","schema","typescript"],"sections":[{"title":"1. ¿Qué es Zod?","content":"\nZod es una library de validación TypeScript-first:\n- Define schemas que son también tipos TypeScript\n- Runtime validation en runtime\n- Type inference estático en compile time\n- Used en: API routes, form validation, env variables, tool parameters\n\n"},{"title":"2. Fundamentos","content":"\n```typescript\nimport { z } from 'zod';\n\n// Primitives\nconst stringSchema = z.string();\nconst numberSchema = z.number();\nconst booleanSchema = z.boolean();\nconst dateSchema = z.date();\n\n// Validation\nconst emailSchema = z.string().email();\nconst ageSchema = z.number().min(0).max(150);\nconst nameSchema = z.string().min(1).max(100);\n\n// Coercion\nconst coercedNumber = z.coerce.number(); // \"123\" → 123\nconst coercedDate = z.coerce.date(); // \"2024-01-01\" → Date\n```\n\n"},{"title":"3. Objects & Arrays","content":"\n```typescript\n// Object schema\nconst UserSchema = z.object({\n  id: z.string().uuid(),\n  email: z.string().email(),\n  name: z.string().min(1),\n  role: z.enum(['USER', 'ADMIN']),\n  createdAt: z.date(),\n});\n\n// Type inference\ntype User = z.infer<typeof UserSchema>;\n// { id: string; email: string; name: string; role: 'USER' | 'ADMIN'; createdAt: Date }\n\n// Arrays\nconst TagsSchema = z.array(z.string());\nconst UsersSchema = z.array(UserSchema);\n\n// Nested objects\nconst PostSchema = z.object({\n  id: z.string().uuid(),\n  title: z.string(),\n  author: UserSchema,\n  tags: TagsSchema,\n});\n```\n\n"},{"title":"4. Optional & Nullable","content":"\n```typescript\nconst schema = z.object({\n  name: z.string(),\n  bio: z.string().optional(),        // string | undefined\n  avatar: z.string().nullable(),     // string | null\n  age: z.number().nullish(),         // number | null | undefined\n});\n```\n\n"},{"title":"5. Refinements","content":"\n```typescript\nconst schema = z.object({\n  password: z.string().min(8),\n  confirmPassword: z.string(),\n}).refine(data => data.password === data.confirmPassword, {\n  message: \"Passwords don't match\",\n  path: ['confirmPassword'],\n});\n\n// Super refine for complex logic\nconst schema = z.object({\n  start: z.date(),\n  end: z.date(),\n}).superRefine((data, ctx) => {\n  if (data.end < data.start) {\n    ctx.addIssue({\n      code: z.ZodIssueCode.custom,\n      message: 'End date must be after start date',\n      path: ['end'],\n    });\n  }\n});\n```\n\n"},{"title":"6. Discriminated Unions","content":"\n```typescript\nconst EventSchema = z.discriminatedUnion('type', [\n  z.object({\n    type: z.literal('click'),\n    x: z.number(),\n    y: z.number(),\n  }),\n  z.object({\n    type: z.literal('keypress'),\n    key: z.string(),\n    code: z.number(),\n  }),\n]);\n\n// Type-safe access\nconst event = EventSchema.parse(rawData);\nif (event.type === 'click') {\n  console.log(event.x, event.y); // ✅ TypeScript knows x,y exist\n}\n```\n\n"},{"title":"7. Preprocess & Transform","content":"\n```typescript\n// Preprocess: clean before validation\nconst cleanString = z.preprocess(\n  (val) => typeof val === 'string' ? val.trim() : val,\n  z.string().min(1)\n);\n\n// Transform: transform after validation\nconst slugSchema = z.string().transform(\n  (val) => val.toLowerCase().replace(/\\s+/g, '-')\n);\n\n// pipe: chain transforms\nconst ageSchema = z.pipe(\n  z.coerce.number(),\n  z.number().min(0).max(150)\n);\n```\n\n"},{"title":"8. Error Handling","content":"\n```typescript\nconst result = UserSchema.safeParse(data);\nif (result.success) {\n  console.log(result.data); // Typed as User\n} else {\n  console.log(result.error.issues);\n  // [{ code: 'invalid_type', path: ['email'], message: 'Expected string, received number' }]\n}\n\n// Custom error messages\nconst schema = z.string({\n  required_error: 'Name is required',\n  invalid_type_error: 'Name must be a string',\n});\n```\n\n"},{"title":"9. UltraIa Patterns","content":"\n```typescript\n// Tool parameters (used in AI SDK tools)\nconst weatherToolParams = z.object({\n  city: z.string().describe('City name'),\n  units: z.enum(['celsius', 'fahrenheit']).default('celsius'),\n});\n\n// API validation\nconst loginSchema = z.object({\n  identifier: z.string().min(1),\n  password: z.string().min(1),\n});\n\n// Form validation\nconst registerSchema = z.object({\n  name: z.string().min(2).max(50),\n  email: z.string().email(),\n  password: z.string().min(8).max(100),\n  confirmPassword: z.string(),\n}).refine(data => data.password === data.confirmPassword, {\n  message: \"Passwords don't match\",\n  path: ['confirmPassword'],\n});\n\n// Database schema → Zod (single source of truth)\nconst MediaFieldSchema = z.object({\n  entities: z.array(z.object({\n    id: z.string(),\n    type: z.enum(['video', 'audio', 'image']),\n  })),\n  relations: z.array(z.object({\n    source: z.string(),\n    target: z.string(),\n    type: z.string(),\n  })),\n});\n```\n\n"},{"title":"10. Referencias","content":"\n- [Zod Docs](https://zod.dev)\n- [Zod GitHub](https://github.com/colinhacks/zod)\n- [Zod + AI SDK](https://sdk.vercel.ai/docs/ai-sdk-core/tools-and-tool-calling)\n\n"}],"rawContent":"# Zod - Guía Completa UltraIa\n\n> **Versión usada:** 3.24.2\n> **Propósito:** Schema validation + type inference (single source of truth)\n> **Docs:** https://zod.dev\n\n---\n\n## 1. ¿Qué es Zod?\n\nZod es una library de validación TypeScript-first:\n- Define schemas que son también tipos TypeScript\n- Runtime validation en runtime\n- Type inference estático en compile time\n- Used en: API routes, form validation, env variables, tool parameters\n\n## 2. Fundamentos\n\n```typescript\nimport { z } from 'zod';\n\n// Primitives\nconst stringSchema = z.string();\nconst numberSchema = z.number();\nconst booleanSchema = z.boolean();\nconst dateSchema = z.date();\n\n// Validation\nconst emailSchema = z.string().email();\nconst ageSchema = z.number().min(0).max(150);\nconst nameSchema = z.string().min(1).max(100);\n\n// Coercion\nconst coercedNumber = z.coerce.number(); // \"123\" → 123\nconst coercedDate = z.coerce.date(); // \"2024-01-01\" → Date\n```\n\n## 3. Objects & Arrays\n\n```typescript\n// Object schema\nconst UserSchema = z.object({\n  id: z.string().uuid(),\n  email: z.string().email(),\n  name: z.string().min(1),\n  role: z.enum(['USER', 'ADMIN']),\n  createdAt: z.date(),\n});\n\n// Type inference\ntype User = z.infer<typeof UserSchema>;\n// { id: string; email: string; name: string; role: 'USER' | 'ADMIN'; createdAt: Date }\n\n// Arrays\nconst TagsSchema = z.array(z.string());\nconst UsersSchema = z.array(UserSchema);\n\n// Nested objects\nconst PostSchema = z.object({\n  id: z.string().uuid(),\n  title: z.string(),\n  author: UserSchema,\n  tags: TagsSchema,\n});\n```\n\n## 4. Optional & Nullable\n\n```typescript\nconst schema = z.object({\n  name: z.string(),\n  bio: z.string().optional(),        // string | undefined\n  avatar: z.string().nullable(),     // string | null\n  age: z.number().nullish(),         // number | null | undefined\n});\n```\n\n## 5. Refinements\n\n```typescript\nconst schema = z.object({\n  password: z.string().min(8),\n  confirmPassword: z.string(),\n}).refine(data => data.password === data.confirmPassword, {\n  message: \"Passwords don't match\",\n  path: ['confirmPassword'],\n});\n\n// Super refine for complex logic\nconst schema = z.object({\n  start: z.date(),\n  end: z.date(),\n}).superRefine((data, ctx) => {\n  if (data.end < data.start) {\n    ctx.addIssue({\n      code: z.ZodIssueCode.custom,\n      message: 'End date must be after start date',\n      path: ['end'],\n    });\n  }\n});\n```\n\n## 6. Discriminated Unions\n\n```typescript\nconst EventSchema = z.discriminatedUnion('type', [\n  z.object({\n    type: z.literal('click'),\n    x: z.number(),\n    y: z.number(),\n  }),\n  z.object({\n    type: z.literal('keypress'),\n    key: z.string(),\n    code: z.number(),\n  }),\n]);\n\n// Type-safe access\nconst event = EventSchema.parse(rawData);\nif (event.type === 'click') {\n  console.log(event.x, event.y); // ✅ TypeScript knows x,y exist\n}\n```\n\n## 7. Preprocess & Transform\n\n```typescript\n// Preprocess: clean before validation\nconst cleanString = z.preprocess(\n  (val) => typeof val === 'string' ? val.trim() : val,\n  z.string().min(1)\n);\n\n// Transform: transform after validation\nconst slugSchema = z.string().transform(\n  (val) => val.toLowerCase().replace(/\\s+/g, '-')\n);\n\n// pipe: chain transforms\nconst ageSchema = z.pipe(\n  z.coerce.number(),\n  z.number().min(0).max(150)\n);\n```\n\n## 8. Error Handling\n\n```typescript\nconst result = UserSchema.safeParse(data);\nif (result.success) {\n  console.log(result.data); // Typed as User\n} else {\n  console.log(result.error.issues);\n  // [{ code: 'invalid_type', path: ['email'], message: 'Expected string, received number' }]\n}\n\n// Custom error messages\nconst schema = z.string({\n  required_error: 'Name is required',\n  invalid_type_error: 'Name must be a string',\n});\n```\n\n## 9. UltraIa Patterns\n\n```typescript\n// Tool parameters (used in AI SDK tools)\nconst weatherToolParams = z.object({\n  city: z.string().describe('City name'),\n  units: z.enum(['celsius', 'fahrenheit']).default('celsius'),\n});\n\n// API validation\nconst loginSchema = z.object({\n  identifier: z.string().min(1),\n  password: z.string().min(1),\n});\n\n// Form validation\nconst registerSchema = z.object({\n  name: z.string().min(2).max(50),\n  email: z.string().email(),\n  password: z.string().min(8).max(100),\n  confirmPassword: z.string(),\n}).refine(data => data.password === data.confirmPassword, {\n  message: \"Passwords don't match\",\n  path: ['confirmPassword'],\n});\n\n// Database schema → Zod (single source of truth)\nconst MediaFieldSchema = z.object({\n  entities: z.array(z.object({\n    id: z.string(),\n    type: z.enum(['video', 'audio', 'image']),\n  })),\n  relations: z.array(z.object({\n    source: z.string(),\n    target: z.string(),\n    type: z.string(),\n  })),\n});\n```\n\n## 10. Referencias\n\n- [Zod Docs](https://zod.dev)\n- [Zod GitHub](https://github.com/colinhacks/zod)\n- [Zod + AI SDK](https://sdk.vercel.ai/docs/ai-sdk-core/tools-and-tool-calling)\n"}];

};

function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
function quitarAcentos(s) { return s.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase(); }
function seccionInfo(id) { return SECCIONES.find(s=>s.id===id)||{titulo:id,descripcion:'',categoria:''}; }
function categoriaInfo(id) { return CATEGORIAS.find(c=>c.id===id)||{nombre:id}; }
function countByCategory(catId) { return SECCIONES.filter(s=>s.categoria===catId).reduce((a,s)=>a+LIBROS.filter(l=>l.seccion===s.id).length,0); }
function countBySection(secId) { return LIBROS.filter(l=>l.seccion===secId).length; }
function isFav(i){return state.favorites.includes(i)}
function isRead(i){return state.read.includes(i)}
function isTechFav(s){return state.techFavorites.includes(s)}
function isTechRead(s){return state.techRead.includes(s)}

function toggleFav(i,e){e&&e.stopPropagation();const x=state.favorites.indexOf(i);if(x>=0)state.favorites.splice(x,1);else state.favorites.push(i);saveState();render()}
function toggleRead(i,e){e&&e.stopPropagation();const x=state.read.indexOf(i);if(x>=0)state.read.splice(x,1);else state.read.push(i);saveState();render()}
function toggleTechFav(s,e){e&&e.stopPropagation();const x=state.techFavorites.indexOf(s);if(x>=0)state.techFavorites.splice(x,1);else state.techFavorites.push(s);saveState();render()}
function toggleTechRead(s,e){e&&e.stopPropagation();const x=state.techRead.indexOf(s);if(x>=0)state.techRead.splice(x,1);else state.techRead.push(s);saveState();render()}
function toggleNotes(i,e){e&&e.stopPropagation();const c=document.querySelector('[data-book="'+i+'"] .card-notes');if(c)c.classList.toggle('visible')}
function saveNote(i,t){state.notes[i]=t;saveState()}

// ===== FILTERING =====
function getFilteredBooks() {
  let books = LIBROS.map((b,i)=>({...b,_idx:i}));
  if(state.search){const terms=quitarAcentos(state.search).split(/\s+/).filter(Boolean);books=books.filter(b=>{const t=quitarAcentos(b.titulo),a=b.autor?quitarAcentos(b.autor):'',s=quitarAcentos(seccionInfo(b.seccion).titulo);return terms.every(x=>t.includes(x)||a.includes(x)||s.includes(x));})}
  if(state.categoryFilter){const ids=SECCIONES.filter(s=>s.categoria===state.categoryFilter).map(s=>s.id);books=books.filter(b=>ids.includes(b.seccion))}
  if(state.sectionFilter)books=books.filter(b=>b.seccion===state.sectionFilter);
  if(state.formatFilter){if(state.formatFilter==='none')books=books.filter(b=>!b.formato);else books=books.filter(b=>b.formato&&quitarAcentos(b.formato).includes(quitarAcentos(state.formatFilter)))}
  books.sort((a,b)=>{if(state.sort==='author')return(a.autor||'zzz').localeCompare(b.autor||'zzz','es');if(state.sort==='section')return a.seccion.localeCompare(b.seccion)||a.titulo.localeCompare(b.titulo,'es');return a.titulo.localeCompare(b.titulo,'es')});
  return books;
}

function getFilteredTech() {
  let tech = [...TECHNOLOGIES];
  if(state.search){const terms=quitarAcentos(state.search).split(/\s+/).filter(Boolean);tech=tech.filter(t=>{const ti=quitarAcentos(t.title),ta=t.tags.join(' '),cat=quitarAcentos(t.categoryName),co=quitarAcentos(t.sections.map(s=>s.title+' '+s.content).join(' ').slice(0,6000));return terms.every(x=>ti.includes(x)||ta.includes(x)||cat.includes(x)||co.includes(x))})}
  if(state.techCategoryFilter)tech=tech.filter(t=>t.category===state.techCategoryFilter);
  return tech;
}

// Mini-markdown offline: fences, headings, tablas, citas, listas, inline code/bold
function renderMD(md){
 const bt=String.fromCharCode(96);
 const lines=String(md).split('\n');
 let h='',inCode=false,inList=false,inTable=false;
 const inline=(s)=>{
  const parts=esc(s).split(bt);let o='';
  for(let i=0;i<parts.length;i++)o+=i%2?'<code>'+parts[i]+'</code>':parts[i].replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return o;
 };
 lines.forEach(raw=>{
  const t=raw.trimStart();
  if(t.slice(0,3)===bt+bt+bt){h+=inCode?'</code></pre>':'<pre><code>';inCode=!inCode;return;}
  if(inCode){h+=esc(raw)+'\n';return;}
  if(/^\|.*\|$/.test(t)){
   const cells=t.split('|').slice(1,-1).map(c=>c.trim());
   if(cells.length&&cells.every(c=>/^:?-{2,}:?$/.test(c))){if(!inTable){h+='<table class="kv-table">';inTable=true;}return;}
   if(!inTable){h+='<table class="kv-table">';inTable=true;}
   h+='<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';return;
  }
  if(inTable){h+='</table>';inTable=false;}
  if(t.slice(0,4)==='### '){if(inList){h+='</ul>';inList=false;}h+='<h4>'+inline(t.slice(4))+'</h4>';return;}
  if(t.slice(0,3)==='## '){if(inList){h+='</ul>';inList=false;}h+='<h4>'+inline(t.slice(3))+'</h4>';return;}
  if(t[0]==='>'){if(inList){h+='</ul>';inList=false;}h+='<div class="clip-cita">'+inline(t.slice(1).trim())+'</div>';return;}
  if(t.slice(0,2)==='- '||/^\d+[.)] /.test(t)){if(!inList){h+='<ul>';inList=true;}h+='<li>'+inline(t.replace(/^(- |\d+[.)] )/g,''))+'</li>';return;}
  if(!t){if(inList){h+='</ul>';inList=false;}return;}
  if(inList){h+='</ul>';inList=false;}
  h+='<p>'+inline(raw.trim())+'</p>';
 });
 if(inList)h+='</ul>';
 if(inTable)h+='</table>';
 if(inCode)h+='</code></pre>';
 return h;
}

function render(){
  const c=document.getElementById('content');
  let h='';
  if(aviso){h+='<div class="notice">'+esc(aviso)+'</div>';aviso='';}
  if(state.view==='detail'&&state.selectedBook!==null)h+=renderBookDetail(state.selectedBook);
  else if(state.view==='detail'&&state.selectedTech)h+=renderTechDetail(state.selectedTech);
  else if(state.tab==='books')h+=renderBooksView();
  else if(state.tab==='tech')h+=renderTechView();
  else if(state.tab==='stats')h+=renderStatsView();
  else if(state.tab==='curso')h+=renderCursoView();
  else if(state.tab==='guardados')h+=renderGuardadosView();
  else if(state.tab==='agente')h+=renderAgenteView();
  c.innerHTML=h;
  const count=state.tab==='books'?getFilteredBooks().length:state.tab==='tech'?getFilteredTech().length:state.tab==='curso'?tarjetasVencidas()+' repaso':state.tab==='guardados'?state.clips.length:'-';
  document.getElementById('resultCount').textContent=count+(state.tab!=='stats'?' / '+(state.tab==='books'?LIBROS.length:TECHNOLOGIES.length):'');
}

const INTERVALOS=[0,1,3,7,16];
function techPorSlug(slug){return TECHNOLOGIES.find(t=>t.slug===slug);}
function textoPlano(s){return String(s).replace(/```[\s\S]*?```/g,' ').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[#>*`|\-]/g,' ').replace(/\s+/g,' ').trim();}
function resumenExtr(s,n){const t=textoPlano(s);const fr=(t.match(/[^.!?\n]+[.!?]+/g)||[t]).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>3);const pool=fr.length?fr:[t];return pool.slice(0,n||2).join(' ').trim().slice(0,420);}
function construirTarjeta(t,si,s){
 const titulo=String(s.title).replace(/^\d+\.\s*/,'');
 if(String(s.content).indexOf('```')>=0)return{id:t.slug+'#'+si,tech:t.slug,sec:si,titulo:titulo,tipo:'codigo',q:'¿Qué hace este código de «'+titulo+'» ('+t.title+')?',a:resumenExtr(s.content,2)||('Bloque de ejemplo en '+t.title)};
 return{id:t.slug+'#'+si,tech:t.slug,sec:si,titulo:titulo,tipo:'concepto',q:'Explica: '+titulo+' ('+t.title+')',a:resumenExtr(s.content,2)||(t.title+' · '+titulo+' — ver material completo')};
}
let DECK_CACHE=null;
function mazoCompleto(){if(DECK_CACHE)return DECK_CACHE;const d=[];TECHNOLOGIES.forEach(t=>{t.sections.forEach((s,si)=>d.push(construirTarjeta(t,si,s)));});DECK_CACHE=d;return d;}
function hoyDia(){return Math.floor(Date.now()/86400000);}
function cajaDe(id){const b=state.quizBox[id];return b?b.box:0;}
function venceHoy(id){const b=state.quizBox[id];if(!b)return true;return b.next<=hoyDia();}
function tarjetasVencidas(){return mazoCompleto().filter(c=>venceHoy(c.id)).length;}
function barajar(arr,semilla){const a=[...arr];let s=semilla||1;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function intercalar(cards){const por={};cards.forEach(c=>{(por[c.tech]=por[c.tech]||[]).push(c);});const ks=Object.keys(por);const out=[];let i=0,mas=true;while(mas){mas=false;ks.forEach(k=>{if(por[k][i]){out.push(por[k][i]);mas=true;}});i++;}return out;}
function elegirMazo(soloNivel){
 let base=mazoCompleto(),sem=hoyDia();
 if(soloNivel&&soloNivel!=='mezcla'){const nv=RUTA.find(r=>r.id===soloNivel);if(nv)base=base.filter(c=>nv.techs.includes(c.tech));}
 if(soloNivel==='mezcla'){sem=hoyDia()+99;base=intercalar(base);}
 const vence=base.filter(c=>venceHoy(c.id)),nuevas=base.filter(c=>{return !venceHoy(c.id)&&cajaDe(c.id)===0;});
 const resto=base.filter(c=>{return !venceHoy(c.id)&&cajaDe(c.id)>0;});
 return barajar([...vence,...nuevas],sem).concat(barajar(resto,sem+7)).slice(0,10);
}
function calificarSM2(id,g){
 const box=cajaDe(id);let nb=box;
 if(g===0)nb=0;else if(g===1)nb=Math.max(0,box-1);else if(g===2)nb=Math.min(4,box+1);else nb=Math.min(4,box+2);
 state.quizBox[id]={box:nb,next:hoyDia()+INTERVALOS[nb]};
 saveState();
}
function iniciarSesion(modo,nivel){
 const mazo=elegirMazo(nivel||null);
 if(!mazo.length){aviso='No hay tarjetas disponibles.';render();return;}
 if(modo==='test'){
  const mazoT=mazo.slice(0,8).map(c=>{
   const distract=barajar(mazoCompleto().filter(x=>x.tech!==c.tech),c.id.length*7+c.sec+1).slice(0,3).map(x=>techPorSlug(x.tech).title);
   const ops=barajar([techPorSlug(c.tech).title,...distract],c.sec+3);
   return{q:'«'+c.titulo+'» pertenece a…',correcta:techPorSlug(c.tech).title,ops:ops,card:c,resp:null};
  });
  sesion={modo:'test',items:mazoT,i:0,aciertos:0,nivel:nivel||null};
 }else{
  sesion={modo:'estudio',items:mazo.map(c=>({card:c,revelada:false,fey:''})),i:0,bien:0,total:0,nivel:nivel||null};
 }
 render();window.scrollTo(0,0);
}
function mostrarRespuesta(){if(sesion&&sesion.modo==='estudio'){sesion.items[sesion.i].revelada=true;render();}}
function guardarFey(v){if(sesion&&sesion.modo==='estudio')sesion.items[sesion.i].fey=v;}
function calificarEstudio(g){
 if(!sesion||sesion.modo!=='estudio')return;
 const it=sesion.items[sesion.i];
 calificarSM2(it.card.id,g);

  const e=p[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('(^|[^a-záéíóúñ])'+e+'(?=[^a-záéíóúñ]|$)','gi');
  if(re.test(out)){usadas.push(p);out=out.replace(re,'$1'+p[1]);}
 });
 return{texto:out.trim(),usadas:usadas};
}
function guardarRecurso(ix,ev){
 if(ev)ev.stopPropagation();
 const r=RECURSOS[ix];if(!r)return;
 const t=techPorSlug(r.tech);
 state.clips.push({id:uid('f'),folderId:state.carpetaSel||'root',titulo:('['+r.tipo+'] '+r.ti).slice(0,120),origen:r.f+' · '+(t?t.title:r.tech),cita:r.u+(r.n?' — '+r.n:''),nota:'',ts:Date.now()});
 saveState();aviso='✅ Recurso guardado en "'+carpetaNombre(state.carpetaSel||'root')+'".';render();
}
function recomendar(slug){
 const t=techPorSlug(slug);if(!t)return'<p>Tema no encontrado.</p>';
 const recs=RECURSOS.filter(r=>r.tech===slug);
 const pods=PODCASTS.filter(p=>p.cat===t.category||p.cat==='general').slice(0,3);
 let h='<h4>🎬 Recursos verificados: '+esc(t.title)+'</h4><ul>';
 recs.forEach(r=>{const ic=r.tipo==='video'?'🎬':r.tipo==='docs'?'📘':'🧪';h+='<li>'+ic+' <a href="'+esc(r.u)+'" target="_blank" rel="noopener">'+esc(r.ti)+'</a> <span style="color:var(--text-muted)">'+esc(r.f)+'</span></li>';});
 h+='</ul>';
 if(pods.length)h+='<h4>🎙️ Para escuchar</h4><ul>'+pods.map(p=>'<li><a href="'+esc(p.u)+'" target="_blank" rel="noopener">'+esc(p.ti)+'</a> <span style="color:var(--text-muted)">'+esc(p.f)+'</span></li>').join('')+'</ul>';
 return h;
}
function agentResponder(q){
 const n=quitarAcentos(q);
 if(/^(hola|ayuda|help|que puedes|quien eres)/.test(n.trim()))return{tipo:'ayuda',html:'<h4>🤖 Soy tu agente local (sin internet)</h4><ul><li><strong>Busca</strong>: «busca react server components»</li><li><strong>Enlaza</strong>: «enlaza nextjs con libros»</li><li><strong>Resume</strong>: «resume docker»</li><li><strong>Explica</strong>: «explica qué es zod»</li><li><strong>Traduce</strong>: «traduce: el servidor renderiza el componente»</li></ul><p style="color:var(--text-muted)">Todo se genera en tu PC con el material de la biblioteca.</p>'};
 if(/traduc/.test(n)){
  let txt=(q.match(/[:“"'](.+)$/)||[])[1]||'';
  if(!txt&&agentUltima)txt=agentUltima;
  if(!txt)return{tipo:'texto',html:'<p>Escríbeme el texto así: <em>traduce: el servidor renderiza el componente</em></p>'};
  const r=traducirTexto(txt,agentDir);
  return{tipo:'texto',html:'<h4>🌐 Traducción por glosario técnico ('+(agentDir==='es-en'?'ES→EN':'EN→ES')+')</h4><p style="color:var(--text-secondary)">'+esc(r.texto)+'</p>'+(r.usadas.length?'<table class="kv-table">'+r.usadas.map(p=>'<tr><td>'+esc(p[0])+'</td><td>→</td><td>'+esc(p[1])+'</td></tr>').join('')+'</table>':'<p style="color:var(--text-muted)">Sin términos del glosario; frase intacta.</p>')+'<p style="color:var(--text-muted);font-size:0.72rem">Nota honesta: es ayuda de vocabulario offline, no traducción automática completa (eso exige conexión).</p>'};
 }
 const tema=mejorTema(q)||(agentTema?techPorSlug(agentTema):null);
 if(/resum/.test(n)){
  if(!tema)return{tipo:'texto',html:'<p>¿Qué tema resumo? Ej: <em>resume docker</em></p>'};
  agentTema=tema.slug;return{tipo:'tema',slug:tema.slug,html:resumirTech(tema.slug)};
 }
 if(/explica|que es|para que sirve|como funciona|no entiendo/.test(n)){
  if(!tema)return{tipo:'texto',html:'<p>¿Qué te explico? Ej: <em>explica qué es zod</em></p>'};
  agentTema=tema.slug;return{tipo:'tema',slug:tema.slug,html:explicarTech(tema.slug)};
 }
 if(/enlaz|relacion|conecta|ver tambien|sigue con|libros de/.test(n)){
  if(!tema)return{tipo:'texto',html:'<p>¿Qué tema enlazo? Ej: <em>enlaza nextjs</em></p>'};
  agentTema=tema.slug;const t=tema,en=enlazarTech(tema.slug);
  let h='<h4>🔗 '+esc(t.title)+' conectado</h4>';
  if(en.rel.length)h+='<p style="color:var(--text-secondary)">Tecnologías afines:</p><ul>'+en.rel.map(r=>'<li><a href="javascript:void(0)" onclick="openTech(\''+r.x.slug+'\')">'+esc(r.x.title)+'</a></li>').join('')+'</ul>';
  if(en.libros.length)h+='<p style="color:var(--text-secondary)">Libros que lo usan:</p><ul>'+en.libros.map(o=>'<li><a href="javascript:void(0)" onclick="openBook('+o.i+')">'+esc(o.b.titulo)+'</a></li>').join('')+'</ul>';
  return{tipo:'tema',slug:tema.slug,html:h};
 }
 if(/recomienda|recursos?|videos?|cursos?|podcasts?|documentacion/.test(n)){
  const tt=tema||(agentTema?techPorSlug(agentTema):null);
  if(!tt){
   let h='<h4>🎙️ Podcasts</h4><ul>'+PODCASTS.map(p=>'<li><a href="'+esc(p.u)+'" target="_blank" rel="noopener">'+esc(p.ti)+'</a> <span style="color:var(--text-muted)">'+esc(p.f)+'</span></li>').join('')+'</ul>';
   return{tipo:'texto',html:'<p>Dime un tema y te recomiendo recursos verificados. Ej: <em>recomienda videos de docker</em></p>'+h};
  }
  agentTema=tt.slug;return{tipo:'tema',slug:tt.slug,html:recomendar(tt.slug)};
 }
 const res=buscarTodo(q);
 if(!res.length)return{tipo:'texto',html:'<p>No encontré nada para «'+esc(q)+'». Prueba con: react, docker, git, testing, nextjs… o escribe <em>ayuda</em>.</p>'};
 let h='<h4>🔍 Encontré '+res.length+' resultados</h4><ul>'+res.map(r=>'<li>'+(r.tipo==='tech'?'<a href="javascript:void(0)" onclick="openTech(\''+r.slug+'\')">⚡ '+esc(r.titulo)+'</a>':'<a href="javascript:void(0)" onclick="openBook('+r.idx+')">📚 '+esc(r.titulo)+'</a>')+' <span style="color:var(--text-muted)">'+esc(r.extra)+'</span></li>').join('')+'</ul>';
 const bt=res.find(r=>r.tipo==='tech');if(bt)agentTema=bt.slug;
 return{tipo:'tema',slug:bt?bt.slug:null,html:h+'<p style="color:var(--text-muted)">Pídeme: <em>resume</em> · <em>explica</em> · <em>enlaza</em> sobre el tema.</p>'};
}
function agentEnviar(){
 const inp=document.getElementById('agent-input');
 const q=(inp.value||'').trim();if(!q)return;
 agentLog.push({rol:'user',html:esc(q)});
 const r=agentResponder(q);
 if(r.slug)agentUltima=q;
 agentLog.push({rol:'agent',html:r.html});
 if(agentLog.length>40)agentLog=agentLog.slice(-40);
 render();
 const log=document.getElementById('chat-log');if(log)log.scrollTop=log.scrollHeight;
 const inp2=document.getElementById('agent-input');if(inp2)inp2.focus();
}
function agentChip(txt){const inp=document.getElementById('agent-input');if(inp){inp.value=txt+' ';inp.focus();}}
function preguntarAgente(slug,si,ev){
 if(ev)ev.stopPropagation();
 const t=techPorSlug(slug);if(!t||!t.sections[si])return;
 agentTema=slug;state.tab='agente';state.view='list';
 agentLog.push({rol:'user',html:esc('Explica: '+t.sections[si].title)});
 const r=agentResponder('explica '+t.title+' '+t.sections[si].title);
 agentLog.push({rol:'agent',html:r.html});
 render();renderSidebar();window.scrollTo(0,0);
}
function renderAgenteView(){
 let h='<h2 style="margin-bottom:6px">🤖 Agente IA local</h2><p style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:12px">Busca, enlaza, resume, explica y traduce con el material de tu biblioteca. <strong>Sin internet.</strong>'+(agentTema&&techPorSlug(agentTema)?' Tema actual: <a href="javascript:void(0)" onclick="openTech(\''+agentTema+'\')">'+esc(techPorSlug(agentTema).title)+'</a>':'')+'</p>';
 h+='<div class="chips"><button class="pill" onclick="agentChip(\'busca\')">🔍 Buscar</button><button class="pill" onclick="agentChip(\'resume\')">📝 Resumir</button><button class="pill" onclick="agentChip(\'explica\')">💡 Explicar</button><button class="pill" onclick="agentChip(\'enlaza\')">🔗 Enlazar</button><button class="pill" onclick="agentChip(\'traduce:\')">🌐 Traducir</button><button class="pill" onclick="agentChip(\'recomienda\')">🎬 Recursos</button><button class="pill'+(agentDir==='es-en'?' active':'')+'" onclick="agentDir=\'es-en\';render()">ES→EN</button><button class="pill'+(agentDir==='en-es'?' active':'')+'" onclick="agentDir=\'en-es\';render()">EN→ES</button></div>';
 h+='<div class="chat-log" id="chat-log" style="max-height:52vh;overflow-y:auto">';
 if(!agentLog.length)h+='<div class="empty-state"><div class="icon">🤖</div><p>Pregúntame algo. Ej: <em>explica qué es zod</em> · <em>resume docker</em> · <em>enlaza nextjs</em></p></div>';
 agentLog.forEach(m=>{h+='<div class="msg msg-'+m.rol+'">'+m.html+'</div>';});
 h+='</div><div class="chat-bar"><input id="agent-input" placeholder="Escribe: busca / resume / explica / enlaza / traduce…" autocomplete="off" onkeydown="if(event.key===\'Enter\')agentEnviar()"><button class="btn btn-primary" onclick="agentEnviar()">Enviar</button></div>';
 return h;
}
// ===== INIT =====
renderSidebar();renderFilterPills();render();
</script>
</body>
</html>
