<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tech Library — UltraIa</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --canvas:#08080a;--panel:#111115;--panel-hover:#16161c;--panel-active:#1c1c24;
  --border:#1f1f2a;--border-subtle:#15151e;
  --text:#e4e4e7;--text-secondary:#a1a1aa;--text-muted:#52525b;
  --primary:#8b5cf6;--primary-dim:#7c3aed;--primary-glow:rgba(139,92,246,0.15);
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
  --radius:8px;--radius-sm:6px;--radius-lg:12px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --font-sans:system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,monospace;
}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:var(--font-sans);background:var(--canvas);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-glow)}
::selection{background:var(--primary);color:#fff}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.app{display:flex;min-height:100vh}
.sidebar{width:280px;min-width:280px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;overflow-y:auto}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:1.1rem;font-weight:700}
.sidebar-header .subtitle{font-size:0.72rem;color:var(--text-muted);margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.nav-section{margin-bottom:4px}
.nav-section-title{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:8px 12px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--radius-sm);font-size:0.82rem;color:var(--text-secondary);transition:all 0.15s;cursor:pointer}
.nav-item:hover{background:var(--panel-hover);color:var(--text)}
.nav-item.active{background:var(--primary-glow);color:var(--primary);font-weight:500}
.nav-item .count{margin-left:auto;font-size:0.7rem;background:var(--border);padding:1px 6px;border-radius:10px;color:var(--text-muted)}
.nav-item.active .count{background:rgba(139,92,246,0.2);color:var(--primary)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:0.7rem;color:var(--text-muted);text-align:center}
.main{flex:1;margin-left:280px;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:5;background:rgba(8,8,10,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px}
.search-box{flex:1;position:relative}
.search-box input{width:100%;padding:10px 16px 10px 40px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);font-size:0.9rem}
.search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:20px;font-size:0.75rem;font-weight:500;border:1px solid var(--border);color:var(--text-secondary);transition:all 0.15s;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--primary);color:var(--text)}
.pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pill.book-pill{border-color:rgba(34,197,94,0.3);color:var(--success)}
.pill.book-pill.active{background:var(--success);border-color:var(--success)}
.pill.tech-pill{border-color:rgba(139,92,246,0.3);color:var(--primary)}
.pill.tech-pill.active{background:var(--primary);border-color:var(--primary)}
.result-count{font-size:0.75rem;color:var(--text-muted);white-space:nowrap}
.content{flex:1;padding:24px}
.books-grid,.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;transition:all 0.2s;display:flex;flex-direction:column}
.card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.card .card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .card-title{font-size:0.95rem;font-weight:600;line-height:1.4;flex:1}
.card .card-subtitle{font-size:0.8rem;color:var(--text-secondary);margin-top:4px}
.card .card-meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:0.7rem;font-weight:500}
.badge-format{background:rgba(139,92,246,0.12);color:var(--primary)}
.badge-section{background:rgba(34,197,94,0.1);color:var(--success)}
.badge-category{background:rgba(245,158,11,0.1);color:var(--warning)}
.badge-tech{background:rgba(236,72,153,0.1);color:#ec4899}
.badge-version{background:rgba(6,182,212,0.1);color:#06b6d4}
.card .card-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-subtle)}
.card .card-actions button{padding:6px 12px;border-radius:var(--radius-sm);font-size:0.75rem;font-weight:500;border:1px solid var(--border);color:var(--text-secondary);transition:all 0.15s}
.card .card-actions button:hover{border-color:var(--primary);color:var(--text)}
.card .card-actions .btn-fav.active{background:rgba(245,158,11,0.15);color:var(--warning);border-color:var(--warning)}
.card .card-actions .btn-read.active{background:rgba(34,197,94,0.15);color:var(--success);border-color:var(--success)}
.card .card-notes{margin-top:8px;padding:8px 12px;background:var(--canvas);border-radius:var(--radius-sm);font-size:0.78rem;color:var(--text-secondary);border:1px solid var(--border-subtle);display:none}
.card .card-notes.visible{display:block}
.card .card-notes textarea{width:100%;min-height:60px;background:transparent;border:none;color:var(--text);font-size:0.78rem;resize:vertical;padding:0}
.card .related{margin-top:10px;font-size:0.72rem;color:var(--text-muted)}
.card .related a{font-size:0.72rem;margin-right:8px}
.view{display:none}.view.active{display:block}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center;cursor:pointer;transition:all 0.2s}
.stat-card:hover{border-color:var(--primary);transform:translateY(-2px)}
.stat-card .stat-value{font-size:2rem;font-weight:700;color:var(--primary)}
.stat-card .stat-label{font-size:0.8rem;color:var(--text-secondary);margin-top:4px}
.book-detail,.tech-detail{max-width:800px;margin:0 auto}
.book-detail h2,.tech-detail h2{font-size:1.5rem;font-weight:700;margin-bottom:8px}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.detail-desc{color:var(--text-secondary);margin:16px 0;line-height:1.7}
.detail-actions{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}
.detail-actions a,.detail-actions button{padding:10px 20px;border-radius:var(--radius);font-weight:500;font-size:0.85rem;border:1px solid var(--border);transition:all 0.15s}
.detail-actions .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.detail-actions .btn-primary:hover{background:var(--primary-dim)}
.related-section{margin-top:32px;padding-top:20px;border-top:1px solid var(--border)}
.related-section h3{font-size:1rem;font-weight:600;margin-bottom:12px}
.tech-content{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin:16px 0}
.tech-content h3{font-size:1rem;font-weight:600;margin:16px 0 8px;color:var(--primary)}
.tech-content h4{font-size:0.9rem;font-weight:600;margin:14px 0 6px;color:var(--text)}
.tech-content pre{background:var(--canvas);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;overflow-x:auto;font-size:0.8rem;font-family:var(--font-mono);margin:8px 0}
.tech-content code{font-family:var(--font-mono);font-size:0.85em;background:var(--canvas);padding:1px 4px;border-radius:3px}
.tech-content pre code{background:none;padding:0}
.tech-content ul,.tech-content ol{padding-left:20px;margin:8px 0}
.tech-content li{margin:4px 0;color:var(--text-secondary)}
.tech-content p{margin:8px 0;color:var(--text-secondary)}
.tech-content strong{color:var(--text)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.tag-list{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:0.65rem;padding:1px 6px;background:var(--border);border-radius:8px;color:var(--text-muted)}
@media(max-width:768px){.sidebar{transform:translateX(-100%);transition:transform 0.3s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.books-grid,.tech-grid{grid-template-columns:1fr}.mobile-toggle{display:flex!important}}
.mobile-toggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:9}.overlay.visible{display:block}
.shortcuts-hint{position:fixed;bottom:16px;right:16px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-size:0.7rem;color:var(--text-muted);z-index:20;display:flex;gap:12px}
kbd{display:inline-block;padding:1px 5px;background:var(--canvas);border:1px solid var(--border);border-radius:3px;font-family:var(--font-mono);font-size:0.65rem}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 20px;font-size:0.85rem;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;transition:all 0.15s;cursor:pointer}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.quiz-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:760px;margin:0 auto}
.quiz-q{font-size:1.05rem;font-weight:600;line-height:1.5}
.quiz-a{background:var(--canvas);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:14px;margin:14px 0;color:var(--text-secondary);line-height:1.7}
.quiz-a.visible{color:var(--text)}
.grade-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grade-row button{flex:1;min-width:110px;padding:10px;border-radius:var(--radius);border:1px solid var(--border);font-size:0.8rem;font-weight:600}
.g-again:hover{border-color:var(--danger);color:var(--danger)}
.g-hard:hover{border-color:var(--warning);color:var(--warning)}
.g-good:hover{border-color:var(--success);color:var(--success)}
.g-easy:hover{border-color:var(--primary);color:var(--primary)}
.opt-btn{display:block;width:100%;text-align:left;padding:10px 14px;margin:8px 0;border:1px solid var(--border);border-radius:var(--radius);font-size:0.85rem;color:var(--text-secondary)}
.opt-btn:hover:not(:disabled){border-color:var(--primary);color:var(--text)}
.opt-btn.ok{border-color:var(--success);color:var(--success);background:rgba(34,197,94,0.08)}
.opt-btn.ko{border-color:var(--danger);color:var(--danger);background:rgba(239,68,68,0.08)}
.folder{margin:2px 0}
.folder-row{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius-sm);font-size:0.85rem;cursor:pointer}
.folder-row:hover{background:var(--panel-hover)}
.folder-row.sel{background:var(--primary-glow);color:var(--primary)}
.folder-kids{margin-left:18px;border-left:1px solid var(--border-subtle);padding-left:8px}
.clip{border:1px solid var(--border);border-radius:var(--radius);margin:8px 0;background:var(--panel)}
.clip-head{padding:10px 14px;font-weight:600;font-size:0.88rem;cursor:pointer;display:flex;gap:8px;align-items:center}
.clip-head:hover{color:var(--primary)}
.clip-body{display:none;padding:0 14px 14px;color:var(--text-secondary);font-size:0.82rem;line-height:1.7}
.clip.open .clip-body{display:block}
.clip-cita{background:var(--canvas);border-left:3px solid var(--primary);padding:10px 12px;margin:8px 0;border-radius:0 6px 6px 0}
.form-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.form-row input,.form-row select,.form-row textarea{flex:1;min-width:160px}
.btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);font-size:0.8rem;font-weight:600;color:var(--text)}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dim);color:#fff}
.chat-log{display:flex;flex-direction:column;gap:10px;max-width:860px;margin:0 auto 16px}
.msg{padding:12px 16px;border-radius:var(--radius-lg);font-size:0.85rem;line-height:1.7;max-width:100%}
.msg-user{background:var(--primary-glow);border:1px solid var(--primary);align-self:flex-end}
.msg-agent{background:var(--panel);border:1px solid var(--border);align-self:flex-start}
.msg-agent h4{color:var(--primary);font-size:0.85rem;margin:10px 0 4px}
.msg-agent ul{padding-left:20px;margin:6px 0}
.msg-agent li{margin:3px 0;color:var(--text-secondary)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.chat-bar{display:flex;gap:8px;max-width:860px;margin:0 auto}
.chat-bar input{flex:1}
.prog{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:8px 0}
.prog > div{height:100%;background:var(--primary)}
.notice{background:rgba(34,197,94,0.1);border:1px solid var(--success);color:var(--success);padding:10px 16px;border-radius:var(--radius);font-size:0.82rem;margin-bottom:16px;max-width:860px}
.level-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.kv-table{width:100%;border-collapse:collapse;font-size:0.8rem;margin:8px 0}
.kv-table td{border:1px solid var(--border);padding:4px 10px;color:var(--text-secondary)}
.two-col{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>📚 Tech Library</h1>
      <div class="subtitle">Biblioteca + Curso + Agente · 100% Offline</div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">UltraIa · Sin conexión · 2026-09-02</div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <div class="topbar">
      <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
      <div class="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar libros, tecnologías... (Ctrl+K)" autocomplete="off">
      </div>
      <div class="filter-pills" id="filterPills"></div>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="content" id="content"></div>
  </div>
  <div class="shortcuts-hint">
    <span><kbd>/</kbd> Buscar</span>
    <span><kbd>Esc</kbd> Limpiar</span>
    <span><kbd>1-5</kbd> Tab</span>
  </div>
</div>

const TECHNOLOGIES = [{"slug":"ai-sdk-providers","title":"AI Providers","version":"-","category":"ai-ml","categoryName":"IA/ML","categoryIcon":"🤖","categoryColor":"#ef4444","tags":["openai","google","anthropic"],"sections":[{"title":"1. Provider Configuration","content":"\n```typescript\n// packages/core/src/ai/llm.ts\nimport { openai } from '@ai-sdk/openai';\nimport { google } from '@ai-sdk/google';\nimport { createOllama } from 'ollama-ai-provider';\n\nexport const providers = {\n  openai: openai(process.env.OPENAI_API_KEY),\n  google: google(process.env.GOOGLE_API_KEY),\n  ollama: createOllama({ baseUrl: 'http://localhost:11434' }),\n};\n\nexport function resolveModel(providerName: string, modelId?: string) {\n  const provider = providers[providerName] || providers.openai;\n  return provider(modelId || 'gpt-4o');\n}\n```\n\n"},{"title":"2. Model Selection","content":"\n| Provider | Model | Use Case | Cost |\n|----------|-------|----------|------|\n| OpenAI | gpt-4o | General, complex reasoning | $$$ |\n| OpenAI | gpt-4o-mini | Simple tasks, fast | $ |\n| Google | gemini-2.0-flash | Fast, multimodal | $ |\n| Google | gemini-1.5-pro | Complex analysis | $$ |\n| Ollama | llama3.1 | Local, free | Free |\n| Ollama | phi3 | Local, lightweight | Free |\n\n"},{"title":"3. Streaming","content":"\n```typescript\nimport { streamText } from 'ai';\n\nconst result = streamText({\n  model: resolveModel('openai', 'gpt-4o'),\n  messages,\n  tools,\n  maxSteps: 5,\n});\n\nreturn result.toDataStreamResponse();\n```\n\n"},{"title":"4. Structured Output","content":"\n```typescript\nimport { generateObject } from 'ai';\nimport { z } from 'zod';\n\nconst { object } = await generateObject({\n  model: resolveModel('openai', 'gpt-4o'),\n  schema: z.object({\n    title: z.string(),\n    summary: z.string(),\n    sentiment: z.enum(['positive', 'negative', 'neutral']),\n  }),\n  prompt: 'Analyze this text...',\n});\n```\n\n"},{"title":"5. Tool Calling","content":"\n```typescript\nconst tools = {\n  getWeather: tool({\n    description: 'Get weather for a city',\n    parameters: z.object({\n      city: z.string(),\n    }),\n    execute: async ({ city }) => {\n      return await fetchWeather(city);\n    },\n  }),\n};\n```\n\n"},{"title":"6. Referencias","content":"\n- [Vercel AI SDK](https://sdk.vercel.ai/docs)\n- [OpenAI API](https://platform.openai.com/docs)\n- [Google AI](https://ai.google.dev/docs)\n- [Ollama](https://ollama.com/)\n\n"}],"rawContent":"# AI/ML Providers - Guía UltraIa\n\n> **Providers:** OpenAI, Google (Gemini), Anthropic (futuro), Ollama (local), LMStudio (local)\n> **SDK:** Vercel AI SDK 4.1.61\n\n---\n\n## 1. Provider Configuration\n\n```typescript\n// packages/core/src/ai/llm.ts\nimport { openai } from '@ai-sdk/openai';\nimport { google } from '@ai-sdk/google';\nimport { createOllama } from 'ollama-ai-provider';\n\nexport const providers = {\n  openai: openai(process.env.OPENAI_API_KEY),\n  google: google(process.env.GOOGLE_API_KEY),\n  ollama: createOllama({ baseUrl: 'http://localhost:11434' }),\n};\n\nexport function resolveModel(providerName: string, modelId?: string) {\n  const provider = providers[providerName] || providers.openai;\n  return provider(modelId || 'gpt-4o');\n}\n```\n\n## 2. Model Selection\n\n| Provider | Model | Use Case | Cost |\n|----------|-------|----------|------|\n| OpenAI | gpt-4o | General, complex reasoning | $$$ |\n| OpenAI | gpt-4o-mini | Simple tasks, fast | $ |\n| Google | gemini-2.0-flash | Fast, multimodal | $ |\n| Google | gemini-1.5-pro | Complex analysis | $$ |\n| Ollama | llama3.1 | Local, free | Free |\n| Ollama | phi3 | Local, lightweight | Free |\n\n## 3. Streaming\n\n```typescript\nimport { streamText } from 'ai';\n\nconst result = streamText({\n  model: resolveModel('openai', 'gpt-4o'),\n  messages,\n  tools,\n  maxSteps: 5,\n});\n\nreturn result.toDataStreamResponse();\n```\n\n## 4. Structured Output\n\n```typescript\nimport { generateObject } from 'ai';\nimport { z } from 'zod';\n\nconst { object } = await generateObject({\n  model: resolveModel('openai', 'gpt-4o'),\n  schema: z.object({\n    title: z.string(),\n    summary: z.string(),\n    sentiment: z.enum(['positive', 'negative', 'neutral']),\n  }),\n  prompt: 'Analyze this text...',\n});\n```\n\n## 5. Tool Calling\n\n```typescript\nconst tools = {\n  getWeather: tool({\n    description: 'Get weather for a city',\n    parameters: z.object({\n      city: z.string(),\n    }),\n    execute: async ({ city }) => {\n      return await fetchWeather(city);\n    },\n  }),\n};\n```\n\n## 6. Referencias\n\n- [Vercel AI SDK](https://sdk.vercel.ai/docs)\n- [OpenAI API](https://platform.openai.com/docs)\n- [Google AI](https://ai.google.dev/docs)\n- [Ollama](https://ollama.com/)\n"},{"slug":"auth-patterns","title":"Auth Patterns","version":"-","category":"security","categoryName":"Seguridad","categoryIcon":"🔒","categoryColor":"#ef4444","tags":["jwt","oauth2","rbac","sessions"],"sections":[{"title":"1. Session Token Pattern","content":"\n```typescript\n// Token generation\nimport crypto from 'crypto';\n\nexport function createSession(userId: string): { token: string; expiresAt: Date } {\n  const token = crypto.randomBytes(32).toString('hex');\n  const expiresAt = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000); // 30 days\n  \n  return { token, expiresAt };\n}\n\n// Token validation\nexport async function validateSession(token: string): Promise<User | null> {\n  const session = await prisma.session.findUnique({\n    where: { token },\n    include: { user: true },\n  });\n  \n  if (!session || session.expiresAt < new Date()) {\n    return null; // Invalid or expired\n  }\n  \n  return session.user;\n}\n```\n\n"},{"title":"2. API Authentication","content":"\n```typescript\n// Middleware pattern\nexport async function getCurrentUser(req?: Request): Promise<User | null> {\n  // Check multiple auth sources\n  const token = \n    req?.headers.get('x-ultraia-session') ||\n    req?.headers.get('Authorization')?.replace('Bearer ', '') ||\n    req?.headers.get('cookie')?.match(/ultraia_session=([^;]+)/)?.[1];\n  \n  if (!token) return null;\n  return validateSession(token);\n}\n\n// Usage in API routes\nexport async function GET(req: Request) {\n  const user = await getCurrentUser(req);\n  if (!user) {\n    return new Response('Unauthorized', { status: 401 });\n  }\n  // Proceed...\n}\n```\n\n"},{"title":"3. RBAC (Role-Based Access Control)","content":"\n```typescript\ntype Role = 'USER' | 'ADMIN';\n\nconst permissions = {\n  USER: ['read', 'write_own'],\n  ADMIN: ['read', 'write_own', 'write_all', 'delete', 'admin'],\n} as const;\n\nexport function hasPermission(role: Role, permission: string): boolean {\n  return permissions[role]?.includes(permission as any) || false;\n}\n\n// Usage\nif (!hasPermission(user.role, 'admin')) {\n  return new Response('Forbidden', { status: 403 });\n}\n```\n\n"},{"title":"4. Login Flow","content":"\n```typescript\n// POST /api/auth/login\nexport async function POST(req: Request) {\n  const { identifier, password } = await req.json();\n  \n  // Find user by email or username\n  const user = await prisma.user.findFirst({\n    where: {\n      OR: [\n        { email: identifier },\n        { name: identifier },\n      ],\n    },\n  });\n  \n  if (!user || !await bcrypt.compare(password, user.password)) {\n    return new Response('Invalid credentials', { status: 401 });\n  }\n  \n  // Create session\n  const { token, expiresAt } = createSession(user.id);\n  await prisma.session.create({\n    data: { userId: user.id, token, expiresAt },\n  });\n  \n  return Response.json({ token, expiresAt, user: { id: user.id, name: user.name, role: user.role } });\n}\n```\n\n"},{"title":"5. Password Hashing","content":"\n```typescript\nimport bcrypt from 'bcryptjs';\n\n// Hash password\nconst hashedPassword = await bcrypt.hash(password, 12); // 12 salt rounds\n\n// Verify password\nconst isValid = await bcrypt.compare(inputPassword, hashedPassword);\n```\n\n"},{"title":"6. CORS Configuration","content":"\n```typescript\n// next.config.ts\nconst nextConfig = {\n  async headers() {\n    return [\n      {\n        source: '/api/:path*',\n        headers: [\n          { key: 'Access-Control-Allow-Origin', value: 'http://localhost:19006' }, // Expo\n          { key: 'Access-Control-Allow-Methods', value: 'GET,POST,PUT,DELETE,OPTIONS' },\n          { key: 'Access-Control-Allow-Headers', value: 'Content-Type, Authorization, x-ultraia-session' },\n        ],\n      },\n    ];\n  },\n};\n```\n\n"},{"title":"7. Referencias","content":"\n- [OWASP Authentication](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html)\n- [bcrypt.js](https://www.npmjs.com/package/bcryptjs)\n\n"}],"rawContent":"# Auth Patterns - Guía UltraIa\n\n> **Métodos:** Session tokens (JWT-like), OAuth2 (futuro), RBAC (USER/ADMIN)\n> **Docs:** N/A (patterns)\n\n---\n\n## 1. Session Token Pattern\n\n```typescript\n// Token generation\nimport crypto from 'crypto';\n\nexport function createSession(userId: string): { token: string; expiresAt: Date } {\n  const token = crypto.randomBytes(32).toString('hex');\n  const expiresAt = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000); // 30 days\n  \n  return { token, expiresAt };\n}\n\n// Token validation\nexport async function validateSession(token: string): Promise<User | null> {\n  const session = await prisma.session.findUnique({\n    where: { token },\n    include: { user: true },\n  });\n  \n  if (!session || session.expiresAt < new Date()) {\n    return null; // Invalid or expired\n  }\n  \n  return session.user;\n}\n```\n\n## 2. API Authentication\n\n```typescript\n// Middleware pattern\nexport async function getCurrentUser(req?: Request): Promise<User | null> {\n  // Check multiple auth sources\n  const token = \n    req?.headers.get('x-ultraia-session') ||\n    req?.headers.get('Authorization')?.replace('Bearer ', '') ||\n    req?.headers.get('cookie')?.match(/ultraia_session=([^;]+)/)?.[1];\n  \n  if (!token) return null;\n  return validateSession(token);\n}\n\n// Usage in API routes\nexport async function GET(req: Request) {\n  const user = await getCurrentUser(req);\n  if (!user) {\n    return new Response('Unauthorized', { status: 401 });\n  }\n  // Proceed...\n}\n```\n\n## 3. RBAC (Role-Based Access Control)\n\n```typescript\ntype Role = 'USER' | 'ADMIN';\n\nconst permissions = {\n  USER: ['read', 'write_own'],\n  ADMIN: ['read', 'write_own', 'write_all', 'delete', 'admin'],\n} as const;\n\nexport function hasPermission(role: Role, permission: string): boolean {\n  return permissions[role]?.includes(permission as any) || false;\n}\n\n// Usage\nif (!hasPermission(user.role, 'admin')) {\n  return new Response('Forbidden', { status: 403 });\n}\n```\n\n## 4. Login Flow\n\n```typescript\n// POST /api/auth/login\nexport async function POST(req: Request) {\n  const { identifier, password } = await req.json();\n  \n  // Find user by email or username\n  const user = await prisma.user.findFirst({\n    where: {\n      OR: [\n        { email: identifier },\n        { name: identifier },\n      ],\n    },\n  });\n  \n  if (!user || !await bcrypt.compare(password, user.password)) {\n    return new Response('Invalid credentials', { status: 401 });\n  }\n  \n  // Create session\n  const { token, expiresAt } = createSession(user.id);\n  await prisma.session.create({\n    data: { userId: user.id, token, expiresAt },\n  });\n  \n  return Response.json({ token, expiresAt, user: { id: user.id, name: user.name, role: user.role } });\n}\n```\n\n## 5. Password Hashing\n\n```typescript\nimport bcrypt from 'bcryptjs';\n\n// Hash password\nconst hashedPassword = await bcrypt.hash(password, 12); // 12 salt rounds\n\n// Verify password\nconst isValid = await bcrypt.compare(inputPassword, hashedPassword);\n```\n\n## 6. CORS Configuration\n\n```typescript\n// next.config.ts\nconst nextConfig = {\n  async headers() {\n    return [\n      {\n        source: '/api/:path*',\n        headers: [\n          { key: 'Access-Control-Allow-Origin', value: 'http://localhost:19006' }, // Expo\n          { key: 'Access-Control-Allow-Methods', value: 'GET,POST,PUT,DELETE,OPTIONS' },\n          { key: 'Access-Control-Allow-Headers', value: 'Content-Type, Authorization, x-ultraia-session' },\n        ],\n      },\n    ];\n  },\n};\n```\n\n## 7. Referencias\n\n- [OWASP Authentication](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html)\n- [bcrypt.js](https://www.npmjs.com/package/bcryptjs)\n"},{"slug":"cloudflare-workers","title":"Cloudflare Workers","version":"-","category":"infra","categoryName":"Infraestructura","categoryIcon":"☁️","categoryColor":"#8b5cf6","tags":["edge","r2","d1"],"sections":[{"title":"1. Cloudflare Workers","content":"\n```typescript\n// cloudflare/worker.ts\nexport default {\n  async fetch(request: Request, env: Env): Promise<Response> {\n    const url = new URL(request.url);\n    \n    // CORS headers\n    const headers = {\n      'Access-Control-Allow-Origin': '*',\n      'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',\n      'Access-Control-Allow-Headers': 'Content-Type, Authorization',\n    };\n    \n    if (request.method === 'OPTIONS') {\n      return new Response(null, { headers });\n    }\n    \n    // Route handling\n    if (url.pathname.startsWith('/files')) {\n      return this.handleFiles(request, env, headers);\n    }\n    \n    return new Response('Not Found', { status: 404, headers });\n  },\n  \n  async handleFiles(request: Request, env: Env, headers: Record<string, string>) {\n    const url = new URL(request.url);\n    const path = url.pathname.replace('/files', '');\n    \n    switch (request.method) {\n      case 'GET':\n        const object = await env.R2_BUCKET.get(path);\n        if (!object) return new Response('Not Found', { status: 404, headers });\n        return new Response(object.body, { headers });\n      \n      case 'PUT':\n        await env.R2_BUCKET.put(path, request.body);\n        return new Response('OK', { headers });\n      \n      case 'DELETE':\n        await env.R2_BUCKET.delete(path);\n        return new Response('OK', { headers });\n      \n      default:\n        return new Response('Method Not Allowed', { status: 405, headers });\n    }\n  },\n};\n```\n\n"},{"title":"2. R2 Object Storage","content":"\n```tomal\n# wrangler.toml\nname = \"ultraia-cloud\"\nmain = \"cloudflare/worker.ts\"\ncompatibility_date = \"2024-01-01\"\n\n[[r2_buckets]]\nbinding = \"R2_BUCKET\"\nbucket_name = \"ultraia-files\"\n```\n\n- **10 GB storage free**\n- **No egress fees** (unlike S3)\n- **S3-compatible API**\n- **Ideal for:** media, documents, backups\n\n"},{"title":"3. D1 Database","content":"\n```tomal\n[[d1_databases]]\nbinding = \"DB\"\ndatabase_name = \"ultraia-db\"\ndatabase_id = \"xxx-xxx-xxx\"\n```\n\n```sql\n-- Migrations\nCREATE TABLE users (\n  id TEXT PRIMARY KEY,\n  email TEXT UNIQUE NOT NULL,\n  name TEXT NOT NULL\n);\n\nCREATE TABLE publications (\n  id TEXT PRIMARY KEY,\n  title TEXT NOT NULL,\n  status TEXT DEFAULT 'draft',\n  created_at DATETIME DEFAULT CURRENT_TIMESTAMP\n);\n```\n\n"},{"title":"4. UltraIa Cloud Setup","content":"\n```typescript\n// cloudflare/worker.ts (UltraIa specific)\ninterface Env {\n  R2_BUCKET: R2Bucket;\n  CLOUD_TOKEN: string;\n}\n\n// Auth check\nconst authHeader = request.headers.get('Authorization');\nif (authHeader !== `Bearer ${env.CLOUD_TOKEN}`) {\n  return new Response('Unauthorized', { status: 401 });\n}\n```\n\n"},{"title":"5. Deployment","content":"\n```bash\n# Install wrangler\nnpm install -g wrangler\n\n# Login\nwrangler login\n\n# Deploy\ncd cloudflare\nwrangler deploy\n\n# Create R2 bucket\nwrangler r2 bucket create ultraia-files\n```\n\n"},{"title":"6. Free Tier Limits (2026)","content":"\n| Service | Free Limit |\n|---------|------------|\n| Workers | 100k requests/day |\n| R2 Storage | 10 GB |\n| R2 Egress | $0 (free) |\n| D1 Storage | 5 GB |\n| D1 Reads | 5M/day |\n| D1 Writes | 100k/day |\n| Custom Domain | `.pages.dev` |\n\n"},{"title":"7. Referencias","content":"\n- [Cloudflare Workers](https://developers.cloudflare.com/workers/)\n- [R2 Storage](https://developers.cloudflare.com/r2/)\n- [D1 Database](https://developers.cloudflare.com/d1/)\n\n"}],"rawContent":"# Cloudflare Workers + R2 + D1 - Guía UltraIa\n\n> **Propósito:** Edge computing, stateless file storage, edge database\n> **Docs:** https://developers.cloudflare.com/\n\n---\n\n## 1. Cloudflare Workers\n\n```typescript\n// cloudflare/worker.ts\nexport default {\n  async fetch(request: Request, env: Env): Promise<Response> {\n    const url = new URL(request.url);\n    \n    // CORS headers\n    const headers = {\n      'Access-Control-Allow-Origin': '*',\n      'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',\n      'Access-Control-Allow-Headers': 'Content-Type, Authorization',\n    };\n    \n    if (request.method === 'OPTIONS') {\n      return new Response(null, { headers });\n    }\n    \n    // Route handling\n    if (url.pathname.startsWith('/files')) {\n      return this.handleFiles(request, env, headers);\n    }\n    \n    return new Response('Not Found', { status: 404, headers });\n  },\n  \n  async handleFiles(request: Request, env: Env, headers: Record<string, string>) {\n    const url = new URL(request.url);\n    const path = url.pathname.replace('/files', '');\n    \n    switch (request.method) {\n      case 'GET':\n        const object = await env.R2_BUCKET.get(path);\n        if (!object) return new Response('Not Found', { status: 404, headers });\n        return new Response(object.body, { headers });\n      \n      case 'PUT':\n        await env.R2_BUCKET.put(path, request.body);\n        return new Response('OK', { headers });\n      \n      case 'DELETE':\n        await env.R2_BUCKET.delete(path);\n        return new Response('OK', { headers });\n      \n      default:\n        return new Response('Method Not Allowed', { status: 405, headers });\n    }\n  },\n};\n```\n\n## 2. R2 Object Storage\n\n```tomal\n# wrangler.toml\nname = \"ultraia-cloud\"\nmain = \"cloudflare/worker.ts\"\ncompatibility_date = \"2024-01-01\"\n\n[[r2_buckets]]\nbinding = \"R2_BUCKET\"\nbucket_name = \"ultraia-files\"\n```\n\n- **10 GB storage free**\n- **No egress fees** (unlike S3)\n- **S3-compatible API**\n- **Ideal for:** media, documents, backups\n\n## 3. D1 Database\n\n```tomal\n[[d1_databases]]\nbinding = \"DB\"\ndatabase_name = \"ultraia-db\"\ndatabase_id = \"xxx-xxx-xxx\"\n```\n\n```sql\n-- Migrations\nCREATE TABLE users (\n  id TEXT PRIMARY KEY,\n  email TEXT UNIQUE NOT NULL,\n  name TEXT NOT NULL\n);\n\nCREATE TABLE publications (\n  id TEXT PRIMARY KEY,\n  title TEXT NOT NULL,\n  status TEXT DEFAULT 'draft',\n  created_at DATETIME DEFAULT CURRENT_TIMESTAMP\n);\n```\n\n## 4. UltraIa Cloud Setup\n\n```typescript\n// cloudflare/worker.ts (UltraIa specific)\ninterface Env {\n  R2_BUCKET: R2Bucket;\n  CLOUD_TOKEN: string;\n}\n\n// Auth check\nconst authHeader = request.headers.get('Authorization');\nif (authHeader !== `Bearer ${env.CLOUD_TOKEN}`) {\n  return new Response('Unauthorized', { status: 401 });\n}\n```\n\n## 5. Deployment\n\n```bash\n# Install wrangler\nnpm install -g wrangler\n\n# Login\nwrangler login\n\n# Deploy\ncd cloudflare\nwrangler deploy\n\n# Create R2 bucket\nwrangler r2 bucket create ultraia-files\n```\n\n## 6. Free Tier Limits (2026)\n\n| Service | Free Limit |\n|---------|------------|\n| Workers | 100k requests/day |\n| R2 Storage | 10 GB |\n| R2 Egress | $0 (free) |\n| D1 Storage | 5 GB |\n| D1 Reads | 5M/day |\n| D1 Writes | 100k/day |\n| Custom Domain | `.pages.dev` |\n\n## 7. Referencias\n\n- [Cloudflare Workers](https://developers.cloudflare.com/workers/)\n- [R2 Storage](https://developers.cloudflare.com/r2/)\n- [D1 Database](https://developers.cloudflare.com/d1/)\n"},{"slug":"docker","title":"Docker","version":"-","category":"infra","categoryName":"Infraestructura","categoryIcon":"☁️","categoryColor":"#8b5cf6","tags":["containers","compose"],"sections":[{"title":"1. Dockerfile","content":"\n```dockerfile\n# Multi-stage build for Node.js\nFROM node:20-alpine AS builder\n\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine AS runner\nWORKDIR /app\nCOPY --from=builder /app/.next ./.next\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/node_modules ./node_modules\nCOPY --from=builder /app/package.json ./\n\nEXPOSE 3000\nCMD [\"npm\", \"start\"]\n```\n\n"},{"title":"2. Docker Compose","content":"\n```yaml\n# docker-compose.yml\nversion: '3.8'\n\nservices:\n  web:\n    build: .\n    ports:\n      - \"3000:3000\"\n    environment:\n      - DATABASE_URL=file:/app/data/dev.db\n    volumes:\n      - ./data:/app/data\n  \n  webhooks:\n    build: .\n    ports:\n      - \"8000:8000\"\n    command: [\"python\", \"start.py\", \"--hooks-only\"]\n  \n  gen-engine:\n    build: .\n    ports:\n      - \"8100:8100\"\n    command: [\"python\", \"-m\", \"uvicorn\", \"main:app\", \"--port\", \"8100\"]\n```\n\n"},{"title":"3. UltraIa Specific","content":"\n```yaml\n# docker-compose.travel.yml\nversion: '3.8'\n\nservices:\n  travel:\n    build: .\n    ports:\n      - \"8080:8080\"\n    environment:\n      - TRAVEL_DATA=/app/travel\n    volumes:\n      - ./travel-data:/app/travel\n```\n\n"},{"title":"4. Common Commands","content":"\n```bash\n# Build\ndocker build -t ultraia .\n\n# Run\ndocker run -p 3000:3000 ultraia\n\n# Compose\ndocker-compose up -d\ndocker-compose down\ndocker-compose logs -f web\n\n# Cleanup\ndocker system prune -f\ndocker volume prune -f\n```\n\n"},{"title":"5. Referencias","content":"\n- [Docker Docs](https://docs.docker.com/)\n- [Docker Compose](https://docs.docker.com/compose/)\n\n"}],"rawContent":"# Docker - Guía UltraIa\n\n> **Propósito:** Containerization, reproducible environments\n> **Docs:** https://docs.docker.com/\n\n---\n\n## 1. Dockerfile\n\n```dockerfile\n# Multi-stage build for Node.js\nFROM node:20-alpine AS builder\n\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:20-alpine AS runner\nWORKDIR /app\nCOPY --from=builder /app/.next ./.next\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/node_modules ./node_modules\nCOPY --from=builder /app/package.json ./\n\nEXPOSE 3000\nCMD [\"npm\", \"start\"]\n```\n\n## 2. Docker Compose\n\n```yaml\n# docker-compose.yml\nversion: '3.8'\n\nservices:\n  web:\n    build: .\n    ports:\n      - \"3000:3000\"\n    environment:\n      - DATABASE_URL=file:/app/data/dev.db\n    volumes:\n      - ./data:/app/data\n  \n  webhooks:\n    build: .\n    ports:\n      - \"8000:8000\"\n    command: [\"python\", \"start.py\", \"--hooks-only\"]\n  \n  gen-engine:\n    build: .\n    ports:\n      - \"8100:8100\"\n    command: [\"python\", \"-m\", \"uvicorn\", \"main:app\", \"--port\", \"8100\"]\n```\n\n## 3. UltraIa Specific\n\n```yaml\n# docker-compose.travel.yml\nversion: '3.8'\n\nservices:\n  travel:\n    build: .\n    ports:\n      - \"8080:8080\"\n    environment:\n      - TRAVEL_DATA=/app/travel\n    volumes:\n      - ./travel-data:/app/travel\n```\n\n## 4. Common Commands\n\n```bash\n# Build\ndocker build -t ultraia .\n\n# Run\ndocker run -p 3000:3000 ultraia\n\n# Compose\ndocker-compose up -d\ndocker-compose down\ndocker-compose logs -f web\n\n# Cleanup\ndocker system prune -f\ndocker volume prune -f\n```\n\n## 5. Referencias\n\n- [Docker Docs](https://docs.docker.com/)\n- [Docker Compose](https://docs.docker.com/compose/)\n"},{"slug":"eslint-prettier","title":"ESLint + Prettier","version":"-","category":"tools","categoryName":"Herramientas","categoryIcon":"🛠️","categoryColor":"#6366f1","tags":["linting","formatting"],"sections":[{"title":"1. ESLint Configuration","content":"\n```javascript\n// eslint.config.js (flat config)\nimport { dirname } from \"path\";\nimport { fileURLToURL } from \"url\";\nimport { FlatCompat } from \"@eslint/eslintrc\";\n\nconst compat = new FlatCompat({\n  baseDirectory: __dirname,\n});\n\nconst eslintConfig = [\n  ...compat.extends(\"next/core-web-vitals\", \"next/typescript\"),\n];\n\nexport default eslintConfig;\n```\n\n"},{"title":"2. Common Rules","content":"\n```json\n{\n  \"extends\": [\"next/core-web-vitals\", \"next/typescript\"],\n  \"rules\": {\n    \"react/no-unescaped-entities\": \"off\",\n    \"@next/next/no-page-custom-font\": \"off\",\n    \"prefer-const\": \"error\",\n    \"no-unused-vars\": \"warn\",\n    \"@typescript-eslint/no-unused-vars\": [\"warn\", { \"argsIgnorePattern\": \"^_\" }]\n  }\n}\n```\n\n"},{"title":"3. UltraIa Lint Commands","content":"\n```bash\n# Next.js lint\nnpm run lint\n\n# Core package lint\ncd packages/core && npm run lint\n\n# Fix auto-fixable issues\nnpm run lint -- --fix\n```\n\n"},{"title":"4. Referencias","content":"\n- [ESLint Docs](https://eslint.org/docs/)\n- [Next.js ESLint](https://nextjs.org/docs/basic-features/eslint)\n\n"}],"rawContent":"# ESLint + Prettier - Guía UltraIa\n\n> **ESLint:** 8.57.1\n> **Prettier:** (via eslint-config-next)\n> **Config:** ESLint integrated in Next.js\n\n---\n\n## 1. ESLint Configuration\n\n```javascript\n// eslint.config.js (flat config)\nimport { dirname } from \"path\";\nimport { fileURLToURL } from \"url\";\nimport { FlatCompat } from \"@eslint/eslintrc\";\n\nconst compat = new FlatCompat({\n  baseDirectory: __dirname,\n});\n\nconst eslintConfig = [\n  ...compat.extends(\"next/core-web-vitals\", \"next/typescript\"),\n];\n\nexport default eslintConfig;\n```\n\n## 2. Common Rules\n\n```json\n{\n  \"extends\": [\"next/core-web-vitals\", \"next/typescript\"],\n  \"rules\": {\n    \"react/no-unescaped-entities\": \"off\",\n    \"@next/next/no-page-custom-font\": \"off\",\n    \"prefer-const\": \"error\",\n    \"no-unused-vars\": \"warn\",\n    \"@typescript-eslint/no-unused-vars\": [\"warn\", { \"argsIgnorePattern\": \"^_\" }]\n  }\n}\n```\n\n## 3. UltraIa Lint Commands\n\n```bash\n# Next.js lint\nnpm run lint\n\n# Core package lint\ncd packages/core && npm run lint\n\n# Fix auto-fixable issues\nnpm run lint -- --fix\n```\n\n## 4. Referencias\n\n- [ESLint Docs](https://eslint.org/docs/)\n- [Next.js ESLint](https://nextjs.org/docs/basic-features/eslint)\n"},{"slug":"expo-react-native","title":"Expo + React Native","version":"SDK 57","category":"mobile","categoryName":"Móvil","categoryIcon":"📱","categoryColor":"#f59e0b","tags":["mobile","ios","android"],"sections":[{"title":"1. Estructura del Proyecto Mobile","content":"\n```\napps/mobile/\n├── app/                    # expo-router screens\n│   ├── _layout.tsx         # Root layout (Stack)\n│   ├── index.tsx           # Landing/redirect\n│   ├── login.tsx           # Login screen\n│   ├── register.tsx        # Register screen\n│   └── (tabs)/             # Tab navigation\n│       ├── _layout.tsx     # Tab layout\n│       ├── index.tsx       # Dashboard\n│       ├── publications.tsx\n│       ├── cloud.tsx\n│       └── blog.tsx\n├── src/\n│   ├── api/\n│   │   └── types.ts        # API response types (mirrors web)\n│   └── lib/\n│       └── api.ts          # API client\n├── app.json\n├── package.json\n└── tsconfig.json\n```\n\n"},{"title":"2. Dependencies","content":"\n```json\n{\n  \"expo\": \"~57.0.0\",\n  \"expo-router\": \"~5.0.0\",\n  \"expo-secure-store\": \"~14.0.0\",\n  \"expo-audio\": \"~13.0.0\",\n  \"expo-video\": \"~3.0.0\",\n  \"expo-image\": \"~3.0.0\",\n  \"react\": \"19.2.3\",\n  \"react-native\": \"0.86.2\",\n  \"react-native-reanimated\": \"~3.17.0\",\n  \"react-native-gesture-handler\": \"~2.24.0\",\n  \"@react-navigation/native\": \"^7.0.0\"\n}\n```\n\n"},{"title":"3. Auth Pattern (SecureStore)","content":"\n```typescript\nimport * as SecureStore from 'expo-secure-store';\n\n// Store token\nawait SecureStore.setItemAsync('session_token', token);\n\n// Retrieve token\nconst token = await SecureStore.getItemAsync('session_token');\n\n// Delete token\nawait SecureStore.deleteItemAsync('session_token');\n```\n\n"},{"title":"4. API Client","content":"\n```typescript\n// src/lib/api.ts\nimport * as SecureStore from 'expo-secure-store';\n\nconst BASE_URL = process.env.EXPO_PUBLIC_API_URL || 'http://localhost:3000';\n\nasync function apiRequest<T>(path: string, options: RequestInit = {}): Promise<T> {\n  const token = await SecureStore.getItemAsync('session_token');\n  \n  const response = await fetch(`${BASE_URL}${path}`, {\n    ...options,\n    headers: {\n      'Content-Type': 'application/json',\n      'x-ultraia-session': token || '',\n      ...options.headers,\n    },\n  });\n  \n  if (!response.ok) {\n    throw new Error(`API Error: ${response.status}`);\n  }\n  \n  return response.json();\n}\n\n// Usage\nexport const api = {\n  login: (data: LoginRequest) => apiRequest<LoginResponse>('/api/auth/login', {\n    method: 'POST',\n    body: JSON.stringify(data),\n  }),\n  \n  getPublications: () => apiRequest<Publication[]>('/api/publications'),\n  \n  approvePublication: (id: string) => \n    apiRequest(`/api/publications/${id}/approve`, { method: 'POST' }),\n};\n```\n\n"},{"title":"5. Navigation","content":"\n```tsx\n// app/_layout.tsx\nimport { Stack } from 'expo-router';\n\nexport default function RootLayout() {\n  return (\n    <Stack>\n      <Stack.Screen name=\"login\" options={{ headerShown: false }} />\n      <Stack.Screen name=\"register\" options={{ headerShown: false }} />\n      <Stack.Screen name=\"(tabs)\" options={{ headerShown: false }} />\n    </Stack>\n  );\n}\n\n// app/(tabs)/_layout.tsx\nimport { Tabs } from 'expo-router';\nimport { Ionicons } from '@expo/vector-icons';\n\nexport default function TabLayout() {\n  return (\n    <Tabs>\n      <Tabs.Screen\n        name=\"index\"\n        options={{\n          title: 'Dashboard',\n          tabBarIcon: ({ color }) => <Ionicons name=\"home\" color={color} size={24} />,\n        }}\n      />\n      {/* ... more tabs */}\n    </Tabs>\n  );\n}\n```\n\n"},{"title":"6. Important Notes","content":"\n- **Metro bundler** does NOT resolve `node:*` imports\n- Mobile app mirrors API types in `src/api/types.ts` (does NOT import from `@ultraia/core`)\n- `EXPO_PUBLIC_API_URL` env var for API base URL\n- QR code for Expo Go testing\n- EAS Build for production builds\n\n"},{"title":"7. Referencias","content":"\n- [Expo Docs](https://docs.expo.dev/)\n- [Expo Router](https://docs.expo.dev/router/introduction/)\n- [React Native](https://reactnative.dev/docs)\n\n"}],"rawContent":"# Expo SDK 57 + React Native - Guía Completa UltraIa\n\n> **Versión usada:** Expo SDK 57, React Native 0.86.2\n> **Router:** expo-router\n> **Docs:** https://docs.expo.dev/\n\n---\n\n## 1. Estructura del Proyecto Mobile\n\n```\napps/mobile/\n├── app/                    # expo-router screens\n│   ├── _layout.tsx         # Root layout (Stack)\n│   ├── index.tsx           # Landing/redirect\n│   ├── login.tsx           # Login screen\n│   ├── register.tsx        # Register screen\n│   └── (tabs)/             # Tab navigation\n│       ├── _layout.tsx     # Tab layout\n│       ├── index.tsx       # Dashboard\n│       ├── publications.tsx\n│       ├── cloud.tsx\n│       └── blog.tsx\n├── src/\n│   ├── api/\n│   │   └── types.ts        # API response types (mirrors web)\n│   └── lib/\n│       └── api.ts          # API client\n├── app.json\n├── package.json\n└── tsconfig.json\n```\n\n## 2. Dependencies\n\n```json\n{\n  \"expo\": \"~57.0.0\",\n  \"expo-router\": \"~5.0.0\",\n  \"expo-secure-store\": \"~14.0.0\",\n  \"expo-audio\": \"~13.0.0\",\n  \"expo-video\": \"~3.0.0\",\n  \"expo-image\": \"~3.0.0\",\n  \"react\": \"19.2.3\",\n  \"react-native\": \"0.86.2\",\n  \"react-native-reanimated\": \"~3.17.0\",\n  \"react-native-gesture-handler\": \"~2.24.0\",\n  \"@react-navigation/native\": \"^7.0.0\"\n}\n```\n\n## 3. Auth Pattern (SecureStore)\n\n```typescript\nimport * as SecureStore from 'expo-secure-store';\n\n// Store token\nawait SecureStore.setItemAsync('session_token', token);\n\n// Retrieve token\nconst token = await SecureStore.getItemAsync('session_token');\n\n// Delete token\nawait SecureStore.deleteItemAsync('session_token');\n```\n\n## 4. API Client\n\n```typescript\n// src/lib/api.ts\nimport * as SecureStore from 'expo-secure-store';\n\nconst BASE_URL = process.env.EXPO_PUBLIC_API_URL || 'http://localhost:3000';\n\nasync function apiRequest<T>(path: string, options: RequestInit = {}): Promise<T> {\n  const token = await SecureStore.getItemAsync('session_token');\n  \n  const response = await fetch(`${BASE_URL}${path}`, {\n    ...options,\n    headers: {\n      'Content-Type': 'application/json',\n      'x-ultraia-session': token || '',\n      ...options.headers,\n    },\n  });\n  \n  if (!response.ok) {\n    throw new Error(`API Error: ${response.status}`);\n  }\n  \n  return response.json();\n}\n\n// Usage\nexport const api = {\n  login: (data: LoginRequest) => apiRequest<LoginResponse>('/api/auth/login', {\n    method: 'POST',\n    body: JSON.stringify(data),\n  }),\n  \n  getPublications: () => apiRequest<Publication[]>('/api/publications'),\n  \n  approvePublication: (id: string) => \n    apiRequest(`/api/publications/${id}/approve`, { method: 'POST' }),\n};\n```\n\n## 5. Navigation\n\n```tsx\n// app/_layout.tsx\nimport { Stack } from 'expo-router';\n\nexport default function RootLayout() {\n  return (\n    <Stack>\n      <Stack.Screen name=\"login\" options={{ headerShown: false }} />\n      <Stack.Screen name=\"register\" options={{ headerShown: false }} />\n      <Stack.Screen name=\"(tabs)\" options={{ headerShown: false }} />\n    </Stack>\n  );\n}\n\n// app/(tabs)/_layout.tsx\nimport { Tabs } from 'expo-router';\nimport { Ionicons } from '@expo/vector-icons';\n\nexport default function TabLayout() {\n  return (\n    <Tabs>\n      <Tabs.Screen\n        name=\"index\"\n        options={{\n          title: 'Dashboard',\n          tabBarIcon: ({ color }) => <Ionicons name=\"home\" color={color} size={24} />,\n        }}\n      />\n      {/* ... more tabs */}\n    </Tabs>\n  );\n}\n```\n\n## 6. Important Notes\n\n- **Metro bundler** does NOT resolve `node:*` imports\n- Mobile app mirrors API types in `src/api/types.ts` (does NOT import from `@ultraia/core`)\n- `EXPO_PUBLIC_API_URL` env var for API base URL\n- QR code for Expo Go testing\n- EAS Build for production builds\n\n## 7. Referencias\n\n- [Expo Docs](https://docs.expo.dev/)\n- [Expo Router](https://docs.expo.dev/router/introduction/)\n- [React Native](https://reactnative.dev/docs)\n"},{"slug":"git-workflows","title":"Git Workflows","version":"-","category":"devops","categoryName":"DevOps","categoryIcon":"🚀","categoryColor":"#22c55e","tags":["branching","ci-cd","hooks"],"sections":[{"title":"1. Commit Convention","content":"\n```\nfeat(scope): add new feature\nfix(scope): fix a bug\nchore(scope): maintenance task\ndocs(scope): documentation only\nrefactor(scope): code restructuring\ntest(scope): add/modify tests\n```\n\n### Examples\n```\nfeat(web): add gallery infinite scroll\nfix(core): resolve publication status transition\nchore(deps): update dependencies\ndocs(readme): update setup instructions\n```\n\n"},{"title":"2. Branch Strategy","content":"\n```bash\n# Main development\ngit checkout master\n\n# Feature branches\ngit checkout -b feat/feature-name\ngit checkout -b fix/bug-name\n\n# Merge back\ngit checkout master\ngit merge feat/feature-name\n```\n\n"},{"title":"3. Pre-commit Hooks","content":"\n```bash\n# .husky/pre-commit\nnpm run lint-staged\n\n# lint-staged config\n{\n  \"*.{ts,tsx}\": [\"eslint --fix\", \"prettier --write\"],\n  \"*.{json,md}\": [\"prettier --write\"]\n}\n```\n\n"},{"title":"4. UltraIa Specific","content":"\n```bash\n# Before any commit, run gates\nnpm run typecheck\nnpm run lint\nnpm run test\nnpm run build\n\n# NEVER commit while dev server is running\n# NEVER use git add . (always explicit files)\n\n# Git add explicit files\ngit add apps/web/src/components/gallery/gallery-client.tsx\ngit add packages/core/src/tools/gallery.ts\n```\n\n"},{"title":"5. Referencias","content":"\n- [Conventional Commits](https://www.conventionalcommits.org/)\n- [Git Flow](https://www.atlassian.com/git/tutorials/comparing-workflows/gitflow-workflow)\n\n"}],"rawContent":"# Git Workflows - Guía UltraIa\n\n> **Branch:** master (main)\n> **Hooks:** Husky + lint-staged\n> **Pattern:** Conventional Commits\n\n---\n\n## 1. Commit Convention\n\n```\nfeat(scope): add new feature\nfix(scope): fix a bug\nchore(scope): maintenance task\ndocs(scope): documentation only\nrefactor(scope): code restructuring\ntest(scope): add/modify tests\n```\n\n### Examples\n```\nfeat(web): add gallery infinite scroll\nfix(core): resolve publication status transition\nchore(deps): update dependencies\ndocs(readme): update setup instructions\n```\n\n## 2. Branch Strategy\n\n```bash\n# Main development\ngit checkout master\n\n# Feature branches\ngit checkout -b feat/feature-name\ngit checkout -b fix/bug-name\n\n# Merge back\ngit checkout master\ngit merge feat/feature-name\n```\n\n## 3. Pre-commit Hooks\n\n```bash\n# .husky/pre-commit\nnpm run lint-staged\n\n# lint-staged config\n{\n  \"*.{ts,tsx}\": [\"eslint --fix\", \"prettier --write\"],\n  \"*.{json,md}\": [\"prettier --write\"]\n}\n```\n\n## 4. UltraIa Specific\n\n```bash\n# Before any commit, run gates\nnpm run typecheck\nnpm run lint\nnpm run test\nnpm run build\n\n# NEVER commit while dev server is running\n# NEVER use git add . (always explicit files)\n\n# Git add explicit files\ngit add apps/web/src/components/gallery/gallery-client.tsx\ngit add packages/core/src/tools/gallery.ts\n```\n\n## 5. Referencias\n\n- [Conventional Commits](https://www.conventionalcommits.org/)\n- [Git Flow](https://www.atlassian.com/git/tutorials/comparing-workflows/gitflow-workflow)\n"},{"slug":"gsap","title":"GSAP","version":"3.15.0","category":"animation","categoryName":"Animación/3D","categoryIcon":"🎬","categoryColor":"#ec4899","tags":["animation","scroll","timeline"],"sections":[{"title":"1. Fundamentos GSAP","content":"\n```typescript\nimport { gsap } from 'gsap';\n\n// Basic tween\ngsap.to('.box', { x: 100, duration: 1, ease: 'power2.out' });\ngsap.from('.box', { opacity: 0, y: 20 });\ngsap.fromTo('.box', { opacity: 0 }, { opacity: 1 });\n\n// Timeline\nconst tl = gsap.timeline();\ntl.to('.box1', { x: 100 })\n  .to('.box2', { y: 50 }, '-=0.5') // overlap\n  .to('.box3', { rotation: 360 });\n```\n\n"},{"title":"2. useGSAP Hook (React)","content":"\n```tsx\nimport { useGSAP } from '@gsap/react';\nimport { gsap } from 'gsap';\n\nfunction AnimatedComponent() {\n  const containerRef = useRef(null);\n  \n  useGSAP(() => {\n    // All GSAP animations scoped to containerRef\n    gsap.to('.title', { opacity: 1, y: 0, duration: 0.8 });\n    gsap.to('.subtitle', { opacity: 1, y: 0, duration: 0.8, delay: 0.2 });\n  }, { scope: containerRef });\n  \n  return (\n    <div ref={containerRef}>\n      <h1 className=\"title\">Hello</h1>\n      <p className=\"subtitle\">World</p>\n    </div>\n  );\n}\n```\n\n"},{"title":"3. ScrollTrigger","content":"\n```tsx\nimport { ScrollTrigger } from 'gsap/ScrollTrigger';\n\ngsap.registerPlugin(ScrollTrigger);\n\nuseGSAP(() => {\n  gsap.to('.element', {\n    scrollTrigger: {\n      trigger: '.element',\n      start: 'top 80%',\n      end: 'bottom 20%',\n      scrub: 1,\n      pin: true,\n    },\n    opacity: 1,\n    y: 0,\n  });\n});\n```\n\n"},{"title":"4. Preferences Reduced Motion","content":"\n```tsx\nimport { useGSAP } from '@gsap/react';\n\nfunction SafeAnimation() {\n  useGSAP(() => {\n    const mm = gsap.matchMedia();\n    \n    mm.add('(prefers-reduced-motion: no-preference)', () => {\n      gsap.to('.box', { x: 100, duration: 1 });\n    });\n    \n    mm.add('(prefers-reduced-motion: reduce)', () => {\n      // Static state only, no animation\n      gsap.set('.box', { x: 100 });\n    });\n    \n    return () => mm.revert();\n  });\n}\n```\n\n"},{"title":"5. UltraIa Animation Rules","content":"\n```typescript\n// Rules from AGENTS.md\n// 1. gsap.context() in useLayoutEffect (not useEffect)\n// 2. gsap.matchMedia() for prefers-reduced-motion (CSS AND JS)\n// 3. Animate ONLY transform/opacity (GPU accelerated)\n// 4. Micro-interactions 100-250ms\n// 5. Stagger lists with --animate-chat-enter + delay per index\n// 6. Loaders >5s use Lottie (never public/)\n// 7. Typing indicator: .typing-dot\n// 8. Streaming: .stream-caret\n\n// Correct pattern\nimport { useLayoutEffect } from 'react';\nimport { gsap } from 'gsap';\n\nuseLayoutEffect(() => {\n  const ctx = gsap.context(() => {\n    gsap.from('.card', {\n      opacity: 0,\n      y: 20,\n      duration: 0.3,\n      stagger: 0.05,\n      ease: 'power2.out',\n    });\n  });\n  \n  return () => ctx.revert();\n}, []);\n```\n\n"},{"title":"6. Lottie Integration","content":"\n```tsx\nimport Lottie from 'lottie-react';\nimport animationData from '@/animations/loader.json';\n\nfunction PendingLoader() {\n  const lottieRef = useRef(null);\n  \n  useEffect(() => {\n    // Respect reduced motion\n    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (prefersReduced && lottieRef.current) {\n      lottieRef.current.pause();\n    }\n  }, []);\n  \n  return (\n    <Lottie\n      lottieRef={lottieRef}\n      animationData={animationData}\n      loop\n      autoplay={!prefersReduced}\n    />\n  );\n}\n```\n\n"},{"title":"7. Common Patterns","content":"\n```tsx\n// Page transition\ngsap.fromTo('.page', \n  { opacity: 0, x: 20 },\n  { opacity: 1, x: 0, duration: 0.4 }\n);\n\n// Staggered list\ngsap.from('.list-item', {\n  opacity: 0,\n  y: 15,\n  duration: 0.3,\n  stagger: 0.05,\n});\n\n// Hover effect\ngsap.to('.card', {\n  scale: 1.02,\n  duration: 0.2,\n  ease: 'power2.out',\n});\n```\n\n"},{"title":"8. Referencias","content":"\n- [GSAP Docs](https://gsap.com/docs/)\n- [useGSAP](https://gsap.com/docs/v3/GSAP/gsap.useGSAP())\n- [ScrollTrigger](https://gsap.com/docs/v3/Plugins/ScrollTrigger/)\n\n"}],"rawContent":"# GSAP + React - Guía Completa UltraIa\n\n> **Versión usada:** GSAP 3.15.0, lottie-react 2.4.1\n> **Docs:** https://gsap.com/docs/\n> **Regla UltraIa:** `gsap.context()` en `useLayoutEffect`, `gsap.matchMedia()` para reduced-motion\n\n---\n\n## 1. Fundamentos GSAP\n\n```typescript\nimport { gsap } from 'gsap';\n\n// Basic tween\ngsap.to('.box', { x: 100, duration: 1, ease: 'power2.out' });\ngsap.from('.box', { opacity: 0, y: 20 });\ngsap.fromTo('.box', { opacity: 0 }, { opacity: 1 });\n\n// Timeline\nconst tl = gsap.timeline();\ntl.to('.box1', { x: 100 })\n  .to('.box2', { y: 50 }, '-=0.5') // overlap\n  .to('.box3', { rotation: 360 });\n```\n\n## 2. useGSAP Hook (React)\n\n```tsx\nimport { useGSAP } from '@gsap/react';\nimport { gsap } from 'gsap';\n\nfunction AnimatedComponent() {\n  const containerRef = useRef(null);\n  \n  useGSAP(() => {\n    // All GSAP animations scoped to containerRef\n    gsap.to('.title', { opacity: 1, y: 0, duration: 0.8 });\n    gsap.to('.subtitle', { opacity: 1, y: 0, duration: 0.8, delay: 0.2 });\n  }, { scope: containerRef });\n  \n  return (\n    <div ref={containerRef}>\n      <h1 className=\"title\">Hello</h1>\n      <p className=\"subtitle\">World</p>\n    </div>\n  );\n}\n```\n\n## 3. ScrollTrigger\n\n```tsx\nimport { ScrollTrigger } from 'gsap/ScrollTrigger';\n\ngsap.registerPlugin(ScrollTrigger);\n\nuseGSAP(() => {\n  gsap.to('.element', {\n    scrollTrigger: {\n      trigger: '.element',\n      start: 'top 80%',\n      end: 'bottom 20%',\n      scrub: 1,\n      pin: true,\n    },\n    opacity: 1,\n    y: 0,\n  });\n});\n```\n\n## 4. Preferences Reduced Motion\n\n```tsx\nimport { useGSAP } from '@gsap/react';\n\nfunction SafeAnimation() {\n  useGSAP(() => {\n    const mm = gsap.matchMedia();\n    \n    mm.add('(prefers-reduced-motion: no-preference)', () => {\n      gsap.to('.box', { x: 100, duration: 1 });\n    });\n    \n    mm.add('(prefers-reduced-motion: reduce)', () => {\n      // Static state only, no animation\n      gsap.set('.box', { x: 100 });\n    });\n    \n    return () => mm.revert();\n  });\n}\n```\n\n## 5. UltraIa Animation Rules\n\n```typescript\n// Rules from AGENTS.md\n// 1. gsap.context() in useLayoutEffect (not useEffect)\n// 2. gsap.matchMedia() for prefers-reduced-motion (CSS AND JS)\n// 3. Animate ONLY transform/opacity (GPU accelerated)\n// 4. Micro-interactions 100-250ms\n// 5. Stagger lists with --animate-chat-enter + delay per index\n// 6. Loaders >5s use Lottie (never public/)\n// 7. Typing indicator: .typing-dot\n// 8. Streaming: .stream-caret\n\n// Correct pattern\nimport { useLayoutEffect } from 'react';\nimport { gsap } from 'gsap';\n\nuseLayoutEffect(() => {\n  const ctx = gsap.context(() => {\n    gsap.from('.card', {\n      opacity: 0,\n      y: 20,\n      duration: 0.3,\n      stagger: 0.05,\n      ease: 'power2.out',\n    });\n  });\n  \n  return () => ctx.revert();\n}, []);\n```\n\n## 6. Lottie Integration\n\n```tsx\nimport Lottie from 'lottie-react';\nimport animationData from '@/animations/loader.json';\n\nfunction PendingLoader() {\n  const lottieRef = useRef(null);\n  \n  useEffect(() => {\n    // Respect reduced motion\n    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (prefersReduced && lottieRef.current) {\n      lottieRef.current.pause();\n    }\n  }, []);\n  \n  return (\n    <Lottie\n      lottieRef={lottieRef}\n      animationData={animationData}\n      loop\n      autoplay={!prefersReduced}\n    />\n  );\n}\n```\n\n## 7. Common Patterns\n\n```tsx\n// Page transition\ngsap.fromTo('.page', \n  { opacity: 0, x: 20 },\n  { opacity: 1, x: 0, duration: 0.4 }\n);\n\n// Staggered list\ngsap.from('.list-item', {\n  opacity: 0,\n  y: 15,\n  duration: 0.3,\n  stagger: 0.05,\n});\n\n// Hover effect\ngsap.to('.card', {\n  scale: 1.02,\n  duration: 0.2,\n  ease: 'power2.out',\n});\n```\n\n## 8. Referencias\n\n- [GSAP Docs](https://gsap.com/docs/)\n- [useGSAP](https://gsap.com/docs/v3/GSAP/gsap.useGSAP())\n- [ScrollTrigger](https://gsap.com/docs/v3/Plugins/ScrollTrigger/)\n"},{"slug":"llm-agents","title":"LLM Agents","version":"-","category":"ai-ml","categoryName":"IA/ML","categoryIcon":"🤖","categoryColor":"#ef4444","tags":["agents","tools","capabilities"],"sections":[{"title":"1. Agent Architecture","content":"\n```\nUser Request\n    ↓\n┌─────────────────┐\n│  LLM Provider   │ ← OpenAI/Google/Ollama\n│  (streamText)    │\n└────────┬────────┘\n         │\n    ┌────┴────┐\n    │  Tools  │ ← Tool registry\n    └────┬────┘\n         │\n    ┌────┴────┐\n    │ Actions │ ← Execute tools\n    └─────────┘\n```\n\n"},{"title":"2. Tool Registration","content":"\n```typescript\n// packages/core/src/ai/llm.ts\nconst allTools = {\n  // Content creation\n  skill_plan: planTool,\n  skill_build: buildTool,\n  skill_test: testTool,\n  \n  // Media\n  video_edit_pack: videoEditPackTool,\n  diagram_render: diagramRenderTool,\n  vfx_code: vfxCodeTool,\n  \n  // Research\n  reach_searchWeb: searchWebTool,\n  reach_readWeb: readWebTool,\n  reach_searchGitHub: searchGitHubTool,\n  \n  // System\n  memory_store: memoryStoreTool,\n  cloud_files: cloudFilesTool,\n  audio_search: audioSearchTool,\n};\n```\n\n"},{"title":"3. Agent Blueprints","content":"\n```typescript\n// Database-driven agent configuration\ninterface AgentBlueprint {\n  id: string;\n  name: string;\n  slug: string;\n  capabilities: string[]; // ['video_edit', 'codevfx', 'travel']\n  systemPrompt: string;\n  model: string;\n  temperature: number;\n}\n\n// Seed agents\nconst adminAgents = [\n  { slug: 'bp-guionista', capabilities: ['video_edit', 'travel', 'motion'] },\n  { slug: 'bp-analista', capabilities: ['videoqa', 'motion'] },\n  { slug: 'bp-publicador', capabilities: ['videoqa', 'publish'] },\n  { slug: 'bp-orquestador', capabilities: ['sdf', 'videoqa', 'motion', 'replica'] },\n];\n```\n\n"},{"title":"4. Multi-Step Agent Loop","content":"\n```typescript\nconst result = await generateText({\n  model: resolveModel('openai', 'gpt-4o'),\n  system: agentBlueprint.systemPrompt,\n  messages,\n  tools: filterToolsByCapabilities(agentBlueprint.capabilities),\n  maxSteps: 10, // Agent loop\n  onStepFinish: ({ toolCalls, toolResults }) => {\n    // Log tool usage\n    console.log(`Step: ${toolCalls.length} tools called`);\n  },\n});\n```\n\n"},{"title":"5. Capabilities Map","content":"\n| Capability | Tools | Description |\n|-----------|-------|-------------|\n| `video_edit` | pack, edl, render, selfeval, timeline | Video editing pipeline |\n| `codevfx` | plan, colorimetria, curvatura, perspectiva, render | Visual effects |\n| `travel` | plan, toma, render, replicar, lead | Travel video creation |\n| `diagram` | render | Editorial diagrams |\n| `screenflow` | plan, capture, schedule, state | Screen recording |\n| `cloud` | files | Cloud file management |\n| `growth` | plan | Channel growth strategy |\n| `memory` | store, recall | Experience memory |\n| `reach` | searchWeb, readWeb, searchGitHub | Web research |\n| `videoqa` | metrics | Video quality analysis |\n| `motion` | analyze | Motion analysis |\n| `sdf` | render | SDF rendering |\n\n"},{"title":"6. Referencias","content":"\n- [Vercel AI SDK Tools](https://sdk.vercel.ai/docs/ai-sdk-core/tools-and-tool-calling)\n- [Agent Patterns](https://sdk.vercel.ai/docs/ai-sdk-core/agents)\n\n"}],"rawContent":"# LLM Agents Architecture - Guía UltraIa\n\n> **Pattern:** Tools + Capabilities + Agent Blueprints\n> **Framework:** Vercel AI SDK + Custom tool registry\n\n---\n\n## 1. Agent Architecture\n\n```\nUser Request\n    ↓\n┌─────────────────┐\n│  LLM Provider   │ ← OpenAI/Google/Ollama\n│  (streamText)    │\n└────────┬────────┘\n         │\n    ┌────┴────┐\n    │  Tools  │ ← Tool registry\n    └────┬────┘\n         │\n    ┌────┴────┐\n    │ Actions │ ← Execute tools\n    └─────────┘\n```\n\n## 2. Tool Registration\n\n```typescript\n// packages/core/src/ai/llm.ts\nconst allTools = {\n  // Content creation\n  skill_plan: planTool,\n  skill_build: buildTool,\n  skill_test: testTool,\n  \n  // Media\n  video_edit_pack: videoEditPackTool,\n  diagram_render: diagramRenderTool,\n  vfx_code: vfxCodeTool,\n  \n  // Research\n  reach_searchWeb: searchWebTool,\n  reach_readWeb: readWebTool,\n  reach_searchGitHub: searchGitHubTool,\n  \n  // System\n  memory_store: memoryStoreTool,\n  cloud_files: cloudFilesTool,\n  audio_search: audioSearchTool,\n};\n```\n\n## 3. Agent Blueprints\n\n```typescript\n// Database-driven agent configuration\ninterface AgentBlueprint {\n  id: string;\n  name: string;\n  slug: string;\n  capabilities: string[]; // ['video_edit', 'codevfx', 'travel']\n  systemPrompt: string;\n  model: string;\n  temperature: number;\n}\n\n// Seed agents\nconst adminAgents = [\n  { slug: 'bp-guionista', capabilities: ['video_edit', 'travel', 'motion'] },\n  { slug: 'bp-analista', capabilities: ['videoqa', 'motion'] },\n  { slug: 'bp-publicador', capabilities: ['videoqa', 'publish'] },\n  { slug: 'bp-orquestador', capabilities: ['sdf', 'videoqa', 'motion', 'replica'] },\n];\n```\n\n## 4. Multi-Step Agent Loop\n\n```typescript\nconst result = await generateText({\n  model: resolveModel('openai', 'gpt-4o'),\n  system: agentBlueprint.systemPrompt,\n  messages,\n  tools: filterToolsByCapabilities(agentBlueprint.capabilities),\n  maxSteps: 10, // Agent loop\n  onStepFinish: ({ toolCalls, toolResults }) => {\n    // Log tool usage\n    console.log(`Step: ${toolCalls.length} tools called`);\n  },\n});\n```\n\n## 5. Capabilities Map\n\n| Capability | Tools | Description |\n|-----------|-------|-------------|\n| `video_edit` | pack, edl, render, selfeval, timeline | Video editing pipeline |\n| `codevfx` | plan, colorimetria, curvatura, perspectiva, render | Visual effects |\n| `travel` | plan, toma, render, replicar, lead | Travel video creation |\n| `diagram` | render | Editorial diagrams |\n| `screenflow` | plan, capture, schedule, state | Screen recording |\n| `cloud` | files | Cloud file management |\n| `growth` | plan | Channel growth strategy |\n| `memory` | store, recall | Experience memory |\n| `reach` | searchWeb, readWeb, searchGitHub | Web research |\n| `videoqa` | metrics | Video quality analysis |\n| `motion` | analyze | Motion analysis |\n| `sdf` | render | SDF rendering |\n\n## 6. Referencias\n\n- [Vercel AI SDK Tools](https://sdk.vercel.ai/docs/ai-sdk-core/tools-and-tool-calling)\n- [Agent Patterns](https://sdk.vercel.ai/docs/ai-sdk-core/agents)\n"},{"slug":"lottie","title":"Lottie","version":"2.4.1","category":"animation","categoryName":"Animación/3D","categoryIcon":"🎬","categoryColor":"#ec4899","tags":["after-effects","animation"],"sections":[{"title":"1. Setup","content":"\n```tsx\nimport Lottie from 'lottie-react';\nimport animationData from '@/animations/loader.json';\n\nfunction AnimatedLoader() {\n  return (\n    <Lottie\n      animationData={animationData}\n      loop\n      autoplay\n      style={{ width: 200, height: 200 }}\n    />\n  );\n}\n```\n\n"},{"title":"2. Ref Control","content":"\n```tsx\nfunction ControlledLottie() {\n  const lottieRef = useRef(null);\n  \n  const handlePlay = () => lottieRef.current?.play();\n  const handlePause = () => lottieRef.current?.pause();\n  const handleStop = () => lottieRef.current?.stop();\n  \n  return (\n    <Lottie\n      lottieRef={lottieRef}\n      animationData={animationData}\n      loop\n    />\n  );\n}\n```\n\n"},{"title":"3. Reduced Motion","content":"\n```tsx\nfunction SafeLottie() {\n  const lottieRef = useRef(null);\n  \n  useEffect(() => {\n    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (prefersReduced && lottieRef.current) {\n      lottieRef.current.pause();\n    }\n  }, []);\n  \n  return (\n    <Lottie\n      lottieRef={lottieRef}\n      animationData={animationData}\n      loop\n      autoplay={false}\n    />\n  );\n}\n```\n\n"},{"title":"4. UltraIa Rules","content":"\n- Loaders >5s use Lottie\n- Store animations in `src/animations/` (NOT `public/`)\n- Always respect `prefers-reduced-motion`\n- Use `lottieRef.current.pause()` for reduced motion\n\n"},{"title":"5. Referencias","content":"\n- [Lottie React](https://github.com/Gamote/lottie-react)\n- [LottieFiles](https://lottiefiles.com/)\n\n"}],"rawContent":"# Lottie - Guía UltraIa\n\n> **Versión usada:** lottie-react 2.4.1\n> **Propósito:** After Effects animations in React\n> **Docs:** https://airbnb.io/lottie/\n\n---\n\n## 1. Setup\n\n```tsx\nimport Lottie from 'lottie-react';\nimport animationData from '@/animations/loader.json';\n\nfunction AnimatedLoader() {\n  return (\n    <Lottie\n      animationData={animationData}\n      loop\n      autoplay\n      style={{ width: 200, height: 200 }}\n    />\n  );\n}\n```\n\n## 2. Ref Control\n\n```tsx\nfunction ControlledLottie() {\n  const lottieRef = useRef(null);\n  \n  const handlePlay = () => lottieRef.current?.play();\n  const handlePause = () => lottieRef.current?.pause();\n  const handleStop = () => lottieRef.current?.stop();\n  \n  return (\n    <Lottie\n      lottieRef={lottieRef}\n      animationData={animationData}\n      loop\n    />\n  );\n}\n```\n\n## 3. Reduced Motion\n\n```tsx\nfunction SafeLottie() {\n  const lottieRef = useRef(null);\n  \n  useEffect(() => {\n    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (prefersReduced && lottieRef.current) {\n      lottieRef.current.pause();\n    }\n  }, []);\n  \n  return (\n    <Lottie\n      lottieRef={lottieRef}\n      animationData={animationData}\n      loop\n      autoplay={false}\n    />\n  );\n}\n```\n\n## 4. UltraIa Rules\n\n- Loaders >5s use Lottie\n- Store animations in `src/animations/` (NOT `public/`)\n- Always respect `prefers-reduced-motion`\n- Use `lottieRef.current.pause()` for reduced motion\n\n## 5. Referencias\n\n- [Lottie React](https://github.com/Gamote/lottie-react)\n- [LottieFiles](https://lottiefiles.com/)\n"},{"slug":"nextjs-15","title":"Next.js 15","version":"15.3.3","category":"frontend","categoryName":"Frontend","categoryIcon":"🎨","categoryColor":"#8b5cf6","tags":["react","ssr","app-router","turbopack"],"sections":[{"title":"1. ¿Qué es Next.js 15?","content":"\nNext.js 15 es un framework React full-stack que combina:\n- **App Router** con React Server Components como default\n- **Turbopack** estable (10x más rápido que Webpack, HMR 700x más rápido)\n- **React 19** como dependencia por defecto\n- **PPR** (Partial Prerendering) para shell estático + ilhas dinámicas\n- **Cache rediseñado** — ya no cachea por defecto, debes opt-in explícitamente\n\n"},{"title":"2. Estructura del Proyecto UltraIa","content":"\n```\napps/web/\n├── app/                    # App Router directory\n│   ├── layout.tsx          # Root layout (shell IDE)\n│   ├── page.tsx            # Landing page\n│   ├── (app)/              # Route group protegida\n│   │   ├── layout.tsx      # Dashboard layout\n│   │   ├── dashboard/\n│   │   ├── chat/\n│   │   ├── studio/\n│   │   ├── gallery/\n│   │   ├── builder/\n│   │   ├── cloud/\n│   │   └── blog/\n│   └── api/                # API routes (Route Handlers)\n│       ├── chat/\n│       ├── auth/\n│       ├── cloud/\n│       ├── publications/\n│       └── omag/\n├── components/\n│   ├── aurora/             # Three.js aurora canvas\n│   ├── app-shell/          # Nav, skill pipeline\n│   └── ui/                 # UI kit (Dark Obsidian)\n├── src/\n│   ├── lib/\n│   │   └── server/\n│   │       └── context.ts  # getCurrentUser()\n│   └── instrumentation.ts  # Runtime providers setup\n├── public/\n├── globals.css             # Tailwind v4 + @theme tokens\n├── next.config.ts          # Webpack config, CSP, images\n└── tsconfig.json\n```\n\n"},{"title":"3. Server Components vs Client Components","content":"\n### Server Component (default)\n```tsx\n// app/blog/page.tsx - NO necesita \"use client\"\n// Runs on server, zero JS sent to client\nimport { prisma } from '@/lib/prisma';\n\nexport default async function BlogPage() {\n  const posts = await prisma.post.findMany(); // Direct DB access\n  return (\n    <main>\n      {posts.map(post => <article key={post.id}>{post.title}</article>)}\n    </main>\n  );\n}\n```\n\n### Client Component\n```tsx\n// components/chat/chat-client.tsx\n\"use client\" // ← MUST be first line\n\nimport { useState } from 'react';\nimport { useChat } from 'ai/react';\n\nexport function ChatClient() {\n  const { messages, input, handleInputChange, handleSubmit } = useChat();\n  return (/* interactive UI */);\n}\n```\n\n### Reglas clave\n- Server Components: async, DB access, zero JS to client\n- Client Components: \"use client\", hooks, event handlers, browser APIs\n- Server → Client: pass data as props/children\n- Client → Server: Server Actions or API routes\n\n"},{"title":"4. Data Fetching","content":"\n```tsx\n// Direct fetch in Server Component (no useEffect needed)\nasync function ProductList() {\n  const products = await fetch('https://api.example.com/products', {\n    next: { revalidate: 3600 } // ISR: revalidate every hour\n  });\n  return <div>{/* render products */}</div>;\n}\n```\n\n### Cache options\n- `cache: 'force-cache'` — cache aggressively\n- `next: { revalidate: N }` — ISR revalidation\n- `cache: 'no-store'` — always fresh data\n- Default in Next.js 15: NO cache (opt-in required)\n\n"},{"title":"5. Server Actions","content":"\n```tsx\n// app/actions.ts\n\"use server\"\n\nimport { prisma } from '@/lib/prisma';\n\nexport async function createPost(formData: FormData) {\n  const title = formData.get('title') as string;\n  await prisma.post.create({ data: { title } });\n  revalidatePath('/posts');\n}\n```\n\n```tsx\n// Usage in component\n<form action={createPost}>\n  <input name=\"title\" />\n  <button type=\"submit\">Create</button>\n</form>\n```\n\n"},{"title":"6. Route Handlers (API Routes)","content":"\n```ts\n// app/api/chat/route.ts\nimport { streamText } from 'ai';\nimport { openai } from '@ai-sdk/openai';\n\nexport async function POST(req: Request) {\n  const { messages } = await req.json();\n  \n  const result = streamText({\n    model: openai('gpt-4o'),\n    messages,\n  });\n  \n  return result.toDataStreamResponse();\n}\n```\n\n"},{"title":"7. Middleware","content":"\n```ts\n// middleware.ts (root)\nimport { NextResponse } from 'next/server';\n\nexport function middleware(request) {\n  const token = request.cookies.get('ultraia_session');\n  if (!token && request.nextUrl.pathname.startsWith('/dashboard')) {\n    return NextResponse.redirect(new URL('/login', request.url));\n  }\n  return NextResponse.next();\n}\n\nexport const config = {\n  matcher: ['/dashboard/:path*', '/api/:path*']\n};\n```\n\n"},{"title":"8. Configuración UltraIa","content":"\n```ts\n// next.config.ts\nconst nextConfig: NextConfig = {\n  transpilePackages: ['@ultraia/core'],\n  serverExternalPackages: ['@prisma/client', '@google/stitch-sdk'],\n  experimental: { cpus: 1 },\n  modularizeImports: {\n    'lucide-react': {\n      transform: 'lucide-react/dist/esm/icons/{{ kebabCase member }}',\n    },\n  },\n  images: {\n    remotePatterns: [\n      { protocol: 'https', hostname: 'image.pollinations.ai' },\n      { protocol: 'https', hostname: '*.pollinations.ai' },\n      { protocol: 'https', hostname: 'images.meigen.ai' },\n    ],\n  },\n};\n```\n\n"},{"title":"9. Rendering Strategies","content":"\n| Strategy | When to Use | UltraIa Usage |\n|----------|-------------|---------------|\n| Static | Content that never changes | Landing page |\n| ISR | Content that updates periodically | Blog posts |\n| Dynamic | Content per-request | Dashboard, Chat |\n| Streaming | Slow data + instant shell | Chat with Suspense |\n| PPR | Static shell + dynamic islands | Dashboard layout |\n\n"},{"title":"10. Performance Tips","content":"\n1. **Use Server Components** by default — zero JS to client\n2. **Dynamic imports** for heavy components (Three.js):\n   ```tsx\n   import dynamic from 'next/dynamic';\n   const AuroraCanvas = dynamic(() => import('@/components/aurora/aurora-canvas'), {\n     ssr: false\n   });\n   ```\n3. **Image optimization** with `next/image`\n4. **Font optimization** with `next/font`\n5. **Route prefetching** automatic with `<Link>`\n6. **Modular imports** for tree-shaking (lucide-react)\n\n"},{"title":"11. Common Issues & Fixes","content":"\n### CSP Errors\n```ts\n// next.config.ts headers()\nContent-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'\n```\n\n### Memory in Build\n```bash\nnode --max-old-space-size=4096 ../../node_modules/next/dist/bin/next build\n```\n\n### Dev Server + Build Conflict\n**NEVER** run `npm run build` while `npm run dev` is running — kills chunks.\nAlways kill dev servers before build.\n\n"},{"title":"12. Referencias","content":"\n- [Next.js 15 Docs](https://nextjs.org/docs)\n- [App Router Migration](https://nextjs.org/docs/app/building-your-application/upgrading/app-router-migration)\n- [Server Actions](https://nextjs.org/docs/app/building-your-application/data-fetching/server-actions-and-mutations)\n- [Turbopack](https://nextjs.org/docs/app/api-reference/turbopack)\n\n"}],"rawContent":"# Next.js 15 - Guía Completa UltraIa\n\n> **Versión usada:** 15.3.3\n> **Router:** App Router (recomendado desde Next.js 14+)\n> **Docs oficiales:** https://nextjs.org/docs\n\n---\n\n## 1. ¿Qué es Next.js 15?\n\nNext.js 15 es un framework React full-stack que combina:\n- **App Router** con React Server Components como default\n- **Turbopack** estable (10x más rápido que Webpack, HMR 700x más rápido)\n- **React 19** como dependencia por defecto\n- **PPR** (Partial Prerendering) para shell estático + ilhas dinámicas\n- **Cache rediseñado** — ya no cachea por defecto, debes opt-in explícitamente\n\n## 2. Estructura del Proyecto UltraIa\n\n```\napps/web/\n├── app/                    # App Router directory\n│   ├── layout.tsx          # Root layout (shell IDE)\n│   ├── page.tsx            # Landing page\n│   ├── (app)/              # Route group protegida\n│   │   ├── layo
