services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # API REST
      - "6334:6334" # API gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  neo4j:
    image: neo4j:5.15
    ports:
      - "7474:7474" # Interfaz web (http://localhost:7474)
      - "7687:7687" # Conexion Bolt
    environment:
      - NEO4J_AUTH=neo4j/sacd_password_2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j_data:/data